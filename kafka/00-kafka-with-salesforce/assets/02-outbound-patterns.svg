<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Three ways to get events out of Salesforce and into Kafka">
  <defs>
    <marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · Outbound &#8212; Salesforce &#8594; Kafka</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Three routes. The first two are pull-based and preferred; the third is a direct push and comes with governor limits attached.</text>

  <!-- lane A -->
  <rect x="24" y="66" width="832" height="118" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="44" y="88" font-size="12" font-weight="700" fill="#0f4d2a">A &#183; Platform Events &#8594; Pub/Sub API &#8594; Kafka &#160;&#160;&#9733; the default choice</text>

  <rect x="44" y="98" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="119" y="120" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle">Apex / Flow</text>
  <text x="119" y="138" font-size="9" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">EventBus.publish()</text>
  <text x="119" y="156" font-size="9" fill="#2f5fa8" text-anchor="middle">no callout, no limit pain</text>

  <path d="M194 133 L232 133" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>

  <rect x="238" y="98" width="170" height="70" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="323" y="120" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Order_Event__e</text>
  <text x="323" y="138" font-size="9" fill="#1e7a44" text-anchor="middle">the event bus inside Salesforce</text>
  <text x="323" y="156" font-size="9" fill="#1e7a44" text-anchor="middle">72h replay for high volume</text>

  <path d="M408 133 L446 133" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>
  <text x="427" y="124" font-size="8" fill="#5b6b7f" text-anchor="middle">gRPC</text>

  <rect x="452" y="98" width="200" height="70" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="552" y="120" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">bridge subscribes</text>
  <text x="552" y="138" font-size="9" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">api.pubsub.salesforce.com:7443</text>
  <text x="552" y="156" font-size="9" fill="#8a6d00" text-anchor="middle">Avro payload &#183; replay ID checkpointing</text>

  <path d="M652 133 L690 133" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>

  <rect x="696" y="98" width="160" height="70" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="776" y="120" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka topic</text>
  <text x="776" y="140" font-size="9" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">sfdc.order-events</text>
  <text x="776" y="158" font-size="9" fill="#1e7a44" text-anchor="middle">key = Order Id</text>

  <circle r="6" cy="133" fill="#f4b400" stroke="#8a6d00" stroke-width="1.2">
    <animate attributeName="cx" dur="3.2s" repeatCount="indefinite" values="119;323;552;776"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.9;1"/>
  </circle>

  <!-- lane B -->
  <rect x="24" y="196" width="832" height="112" rx="11" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.8"/>
  <text x="44" y="218" font-size="12" font-weight="700" fill="#1b2a3a">B &#183; Change Data Capture &#8594; Kafka &#160;&#160;when you want <tspan font-style="italic">every</tspan> record change, with zero code</text>

  <rect x="44" y="228" width="180" height="62" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="134" y="250" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle">any DML on Order__c</text>
  <text x="134" y="268" font-size="9" fill="#2f5fa8" text-anchor="middle">UI, API, Flow, Apex, data loader</text>
  <text x="134" y="283" font-size="9" fill="#2f5fa8" text-anchor="middle">you write no code at all</text>

  <path d="M224 259 L262 259" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>

  <rect x="268" y="228" width="200" height="62" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="368" y="250" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">/data/Order__ChangeEvent</text>
  <text x="368" y="268" font-size="9" fill="#1e7a44" text-anchor="middle">header carries changeType and</text>
  <text x="368" y="283" font-size="9" fill="#1e7a44" text-anchor="middle">changedFields &#8212; only the delta</text>

  <path d="M468 259 L506 259" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>

  <rect x="512" y="228" width="200" height="62" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="612" y="250" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Kafka Connect source</text>
  <text x="612" y="268" font-size="8.5" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">SalesforceCdcSourceConnector</text>
  <text x="612" y="283" font-size="9" fill="#8a6d00" text-anchor="middle">config file, not code</text>

  <path d="M712 259 L750 259" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s2)"/>
  <rect x="756" y="228" width="100" height="62" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="806" y="264" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka</text>

  <circle r="6" cy="259" fill="#1e7a44">
    <animate attributeName="cx" dur="3.2s" begin="0.6s" repeatCount="indefinite" values="134;368;612;806"/>
    <animate attributeName="opacity" dur="3.2s" begin="0.6s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.9;1"/>
  </circle>

  <!-- lane C -->
  <rect x="24" y="320" width="832" height="112" rx="11" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="44" y="342" font-size="12" font-weight="700" fill="#a01818">C &#183; Apex callout &#8594; Kafka REST Proxy &#160;&#160;direct, synchronous &#8212; and the one that bites</text>

  <rect x="44" y="352" width="180" height="62" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="134" y="374" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">Apex Queueable</text>
  <text x="134" y="392" font-size="9" fill="#c0392b" text-anchor="middle" font-family="Consolas, monospace">callout:Kafka_REST_Proxy</text>
  <text x="134" y="407" font-size="9" fill="#c0392b" text-anchor="middle">Named Credential does the auth</text>

  <path d="M224 383 L262 383" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s2)"/>
  <text x="243" y="374" font-size="8" fill="#a01818" text-anchor="middle">HTTPS</text>

  <rect x="268" y="352" width="240" height="62" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="388" y="372" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">Confluent REST Proxy</text>
  <text x="388" y="390" font-size="8.5" fill="#c0392b" text-anchor="middle" font-family="Consolas, monospace">POST /topics/order-events</text>
  <text x="388" y="405" font-size="8.5" fill="#c0392b" text-anchor="middle" font-family="Consolas, monospace">application/vnd.kafka.json.v2+json</text>

  <path d="M508 383 L546 383" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s2)"/>
  <rect x="552" y="352" width="120" height="62" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="612" y="388" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">Kafka</text>

  <rect x="688" y="352" width="168" height="62" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="772" y="370" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle">what you inherit</text>
  <text x="772" y="386" font-size="8.5" fill="#a01818" text-anchor="middle">100 callouts / transaction</text>
  <text x="772" y="399" font-size="8.5" fill="#a01818" text-anchor="middle">120 s cumulative timeout</text>
  <text x="772" y="410" font-size="8.5" fill="#a01818" text-anchor="middle">no callout after DML</text>

  <rect x="24" y="440" width="832" height="24" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.4"/>
  <text x="440" y="457" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Rule of thumb: publish an event and let something outside Salesforce pull it. Reach for a synchronous Apex callout only when you genuinely need the response.</text>
</svg>
