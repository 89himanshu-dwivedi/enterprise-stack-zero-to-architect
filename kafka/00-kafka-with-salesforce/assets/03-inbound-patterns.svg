<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Getting data from Kafka into Salesforce and onto the screen">
  <defs>
    <marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">3 · Inbound &#8212; Kafka &#8594; Salesforce &#8594; the screen</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">The bridge consumes, then chooses <tspan font-weight="700">how</tspan> to land the data. That choice is the entire design.</text>

  <rect x="24" y="70" width="150" height="70" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="99" y="96" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka topic</text>
  <text x="99" y="116" font-size="9" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">payment-completed</text>
  <text x="99" y="132" font-size="9" fill="#1e7a44" text-anchor="middle">millions of records</text>

  <path d="M174 105 L212 105" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#s3)"/>

  <rect x="218" y="70" width="200" height="70" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="318" y="92" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">the bridge consumes</text>
  <text x="318" y="110" font-size="9" fill="#8a6d00" text-anchor="middle">batches, dedupes, maps to SF fields</text>
  <text x="318" y="126" font-size="9" font-weight="700" fill="#7a5b00" text-anchor="middle">and throttles &#8212; this part matters</text>

  <g stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#s3)">
    <path d="M418 92 L470 176"/><path d="M418 105 L470 262"/><path d="M418 118 L470 348"/>
  </g>

  <!-- option 1 -->
  <rect x="476" y="150" width="380" height="76" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="496" y="172" font-size="11.5" font-weight="700" fill="#12305e">1 &#183; publish a Platform Event into Salesforce</text>
  <text x="496" y="190" font-size="9.5" fill="#2f5fa8" font-family="Consolas, monospace">POST /services/data/v62.0/sobjects/Payment_Event__e</text>
  <text x="496" y="206" font-size="9.5" fill="#2f5fa8">an Apex trigger on the event does the work &#8212; and the UI can watch it live</text>
  <text x="496" y="220" font-size="9" font-weight="700" fill="#12305e">best for: real-time notifications, decoupled processing</text>

  <!-- option 2 -->
  <rect x="476" y="236" width="380" height="76" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="496" y="258" font-size="11.5" font-weight="700" fill="#0f4d2a">2 &#183; write records with the Composite or Bulk API</text>
  <text x="496" y="276" font-size="9.5" fill="#1e7a44" font-family="Consolas, monospace">composite/sobjects &#183; up to 200 &#160;&#160;|&#160;&#160; Bulk API 2.0 for millions</text>
  <text x="496" y="292" font-size="9.5" fill="#1e7a44">upsert on an External Id so a replay does not create duplicates</text>
  <text x="496" y="306" font-size="9" font-weight="700" fill="#0f4d2a">best for: bulk sync, backfills, nightly loads</text>

  <!-- option 3 -->
  <rect x="476" y="322" width="380" height="76" rx="10" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.8"/>
  <text x="496" y="344" font-size="11.5" font-weight="700" fill="#1b2a3a">3 &#183; call your own Apex REST endpoint</text>
  <text x="496" y="362" font-size="9.5" fill="#5b6b7f" font-family="Consolas, monospace">@RestResource(urlMapping='/kafka/payments/*')</text>
  <text x="496" y="378" font-size="9.5" fill="#5b6b7f">full control of validation and business logic, at the cost of owning the code</text>
  <text x="496" y="392" font-size="9" font-weight="700" fill="#1b2a3a">best for: complex mapping and custom rules</text>

  <!-- LWC live -->
  <rect x="24" y="176" width="180" height="222" rx="11" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="114" y="200" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">and on the screen</text>
  <rect x="42" y="212" width="144" height="52" rx="8" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.4"/>
  <text x="114" y="234" font-size="10" font-weight="700" fill="#12305e" text-anchor="middle">LWC</text>
  <text x="114" y="252" font-size="8.5" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">lightning/empApi</text>
  <text x="114" y="284" font-size="9" fill="#2f5fa8" text-anchor="middle">subscribes to</text>
  <text x="114" y="300" font-size="9" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">/event/Payment_Event__e</text>
  <text x="114" y="326" font-size="9" fill="#2f5fa8" text-anchor="middle">no polling, no refresh button</text>
  <text x="114" y="342" font-size="9" fill="#2f5fa8" text-anchor="middle">the tile just updates</text>
  <rect x="42" y="356" width="144" height="30" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" values="1.4;3;1.4"/>
  </rect>
  <text x="114" y="376" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Payment received &#10003;</text>

  <path d="M472 188 L210 250" fill="none" stroke="#2f5fa8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#s3)"/>
  <circle r="5" fill="#2f5fa8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M472 188 L210 250"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/>
  </circle>

  <rect x="24" y="412" width="832" height="46" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="440" y="432" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">The thing that kills these projects: Kafka does millions per second, Salesforce has a <tspan text-decoration="underline">daily API request limit</tspan>.</text>
  <text x="440" y="449" font-size="10.5" fill="#a01818" text-anchor="middle">Batch and filter in the bridge. Never point a raw high-volume topic straight at an org.</text>
</svg>
