<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A decision tree for whether Kafka belongs in your Salesforce architecture">
  <defs>
    <marker id="s8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">8 · Should Kafka be in this architecture at all?</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Work down the list. The first &#8220;no&#8221; is your answer &#8212; and most of the time the honest answer is that you do not need it.</text>

  <rect x="240" y="68" width="400" height="42" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="440" y="94" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">Is anything outside Salesforce involved?</text>
  <path d="M240 89 L176 89 L176 128" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="200" y="82" font-size="9.5" font-weight="700" fill="#a01818">no</text>
  <path d="M440 110 L440 138" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="452" y="128" font-size="9.5" font-weight="700" fill="#0f4d2a">yes</text>

  <rect x="24" y="132" width="300" height="52" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="174" y="154" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">use Platform Events. Stop here.</text>
  <text x="174" y="172" font-size="10" fill="#1e7a44" text-anchor="middle">Already licensed, zero infrastructure, zero pager.</text>

  <rect x="240" y="142" width="400" height="42" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="440" y="168" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">Is it more than a couple of point-to-point calls?</text>
  <path d="M640 163 L704 163 L704 202" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="666" y="156" font-size="9.5" font-weight="700" fill="#a01818">no</text>
  <path d="M440 184 L440 212" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="452" y="202" font-size="9.5" font-weight="700" fill="#0f4d2a">yes</text>

  <rect x="556" y="206" width="300" height="52" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="706" y="228" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">a REST callout is fine. Stop here.</text>
  <text x="706" y="246" font-size="10" fill="#1e7a44" text-anchor="middle">Named Credential, Queueable, done.</text>

  <rect x="240" y="216" width="400" height="42" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="440" y="242" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">Do you need replay, long retention or strict ordering?</text>
  <path d="M240 237 L176 237 L176 276" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="200" y="230" font-size="9.5" font-weight="700" fill="#a01818">no</text>
  <path d="M440 258 L440 286" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="452" y="276" font-size="9.5" font-weight="700" fill="#0f4d2a">yes</text>

  <rect x="24" y="280" width="300" height="52" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="174" y="302" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">consider Event Relay or MuleSoft first</text>
  <text x="174" y="320" font-size="10" fill="#8a6d00" text-anchor="middle">managed, and nobody has to run a cluster.</text>

  <rect x="240" y="290" width="400" height="42" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="440" y="316" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">Does someone already run Kafka in your company?</text>
  <path d="M640 311 L704 311 L704 350" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="666" y="304" font-size="9.5" font-weight="700" fill="#a01818">no</text>
  <path d="M440 332 L440 360" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#s8)"/>
  <text x="452" y="350" font-size="9.5" font-weight="700" fill="#0f4d2a">yes</text>

  <rect x="556" y="354" width="300" height="52" rx="10" fill="#fff8f8" stroke="#c62828" stroke-width="1.8"/>
  <text x="706" y="376" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">think very hard before you say yes</text>
  <text x="706" y="394" font-size="10" fill="#a01818" text-anchor="middle">Kafka for one CRM integration is a team, not a tool.</text>

  <rect x="240" y="364" width="400" height="52" rx="10" fill="#e6f4ea" stroke="#0f4d2a" stroke-width="2.4"/>
  <text x="440" y="386" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka genuinely earns its place</text>
  <text x="440" y="404" font-size="10.5" fill="#1e7a44" text-anchor="middle">Now go and design the bridge, not the Apex.</text>
  <rect x="240" y="364" width="400" height="52" rx="10" fill="none" stroke="#0f4d2a" stroke-width="3" opacity="0.4">
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.2;1;0.2"/>
  </rect>

  <rect x="24" y="430" width="832" height="32" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="440" y="451" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">Typical yes: order and inventory events across many systems &#183; streaming to a data lake &#183; telemetry &#183; replacing a nightly batch &#183; multi-org or post-merger integration.</text>
</svg>
