<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Kafka retains messages while a consumer is down and replays them when it comes back up">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#ffffff"/>

  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">3 · Consumer goes down — nothing is lost</text>
  <text x="24" y="54" font-size="13" fill="#5b6b7f">Order Service keeps working. Kafka keeps the messages. Notification catches up when it returns.</text>

  <!-- producer -->
  <rect x="40" y="78" width="160" height="52" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="120" y="100" font-size="13" font-weight="600" fill="#12305e" text-anchor="middle">Order Service</text>
  <text x="120" y="118" font-size="10" fill="#2f5fa8" text-anchor="middle">still publishing, unaffected</text>
  <path d="M200 104 L250 104 L250 168" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#ar3)"/>

  <!-- log frame -->
  <rect x="46" y="158" width="768" height="94" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="60" y="150" font-size="11" font-weight="600" fill="#0f4d2a">Kafka append-only log — topic: order-placed</text>

  <!-- slots -->
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.03;0.05;1"/>
    <rect x="60" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="115" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #101</text>
    <text x="115" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 0</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.10;0.12;1"/>
    <rect x="185" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="240" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #102</text>
    <text x="240" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 1</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.17;0.19;1"/>
    <rect x="310" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="365" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #103</text>
    <text x="365" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 2</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.24;0.26;1"/>
    <rect x="435" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="490" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #104</text>
    <text x="490" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 3</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.31;0.33;1"/>
    <rect x="560" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="615" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #105</text>
    <text x="615" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 4</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.38;0.40;1"/>
    <rect x="685" y="172" width="110" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
    <text x="740" y="198" font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">order #106</text>
    <text x="740" y="216" font-size="10" fill="#1e7a44" text-anchor="middle">offset 5</text>
  </g>

  <!-- consumed ticks -->
  <g fill="#1e7a44" font-size="15" font-weight="700" text-anchor="middle">
    <text x="155" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.55;0.57;0.97;1"/></text>
    <text x="280" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.61;0.63;0.97;1"/></text>
    <text x="405" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.67;0.69;0.97;1"/></text>
    <text x="530" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.73;0.75;0.97;1"/></text>
    <text x="655" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.79;0.81;0.97;1"/></text>
    <text x="780" y="190">&#10003;<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.85;0.87;0.97;1"/></text>
  </g>

  <!-- read pointer -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.51;0.54;0.93;1"/>
    <polygon points="-9,282 9,282 0,266" fill="#2f5fa8">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" dur="12s" repeatCount="indefinite"
               values="115 0;115 0;115 0;240 0;365 0;490 0;615 0;740 0;740 0"
               keyTimes="0;0.52;0.55;0.61;0.67;0.73;0.79;0.85;1"/>
    </polygon>
  </g>
  <text x="440" y="302" font-size="10" fill="#2f5fa8" text-anchor="middle" opacity="0">
    consumer offset moving forward — replaying from where it stopped
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.51;0.54;0.93;1"/>
  </text>

  <!-- consumer state: DOWN -->
  <g opacity="1">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.45;0.48;0.97;1"/>
    <rect x="320" y="318" width="240" height="64" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="440" y="344" font-size="13" font-weight="600" fill="#a01818" text-anchor="middle">Notification Service — DOWN</text>
    <text x="440" y="364" font-size="10" fill="#a01818" text-anchor="middle">offline ~10 minutes · orders keep flowing</text>
  </g>

  <!-- consumer state: UP -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.49;0.97;1"/>
    <rect x="320" y="318" width="240" height="64" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
    <text x="440" y="344" font-size="13" font-weight="600" fill="#0f4d2a" text-anchor="middle">Notification Service — UP</text>
    <text x="440" y="364" font-size="10" fill="#1e7a44" text-anchor="middle">reads all pending messages, sends every email/SMS</text>
  </g>
</svg>
