<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Applications talking to a Kafka cluster of many brokers, with a separate ZooKeeper ensemble managing the cluster">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>

  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">1 · One Kafka is never one server — it is a cluster, and ZooKeeper used to manage it</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">The same application can be a producer and a consumer at the same time.</text>

  <!-- apps -->
  <rect x="20" y="110" width="150" height="60" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="95" y="134" font-size="13" font-weight="600" fill="#12305e" text-anchor="middle">Application 1</text>
  <text x="95" y="152" font-size="10" fill="#2f5fa8" text-anchor="middle">producer &#160;&amp;&#160; consumer</text>

  <rect x="20" y="210" width="150" height="60" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="95" y="234" font-size="13" font-weight="600" fill="#12305e" text-anchor="middle">Application 2</text>
  <text x="95" y="252" font-size="10" fill="#2f5fa8" text-anchor="middle">producer &#160;&amp;&#160; consumer</text>

  <line x1="170" y1="140" x2="204" y2="140" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="170" y1="240" x2="204" y2="240" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a1)"/>

  <circle cy="140" r="7" fill="#f4b400" stroke="#8a6d00" stroke-width="1.2">
    <animate attributeName="cx" dur="3s" repeatCount="indefinite" values="95;300"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/>
  </circle>
  <circle cy="240" r="7" fill="#f4b400" stroke="#8a6d00" stroke-width="1.2">
    <animate attributeName="cx" dur="3s" begin="1.2s" repeatCount="indefinite" values="95;300"/>
    <animate attributeName="opacity" dur="3s" begin="1.2s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/>
  </circle>

  <!-- kafka cluster -->
  <rect x="196" y="78" width="384" height="300" rx="14" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="388" y="100" font-size="14" font-weight="600" fill="#0f4d2a" text-anchor="middle">Kafka cluster &#8212; N servers (could be thousands)</text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8">
    <rect x="212" y="118" width="170" height="66" rx="9"/>
    <rect x="396" y="118" width="170" height="66" rx="9"/>
    <rect x="212" y="200" width="170" height="66" rx="9"/>
    <rect x="396" y="200" width="170" height="66" rx="9"/>
    <rect x="212" y="282" width="170" height="66" rx="9"/>
    <rect x="396" y="282" width="170" height="66" rx="9"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="297" y="148">Kafka server 1</text>
    <text x="481" y="148">Kafka server 2</text>
    <text x="297" y="230">Kafka server 3</text>
    <text x="481" y="230">Kafka server 4</text>
    <text x="297" y="312">Kafka server 5</text>
    <text x="481" y="312">Kafka server 6</text>
  </g>
  <g font-size="9.5" fill="#1e7a44" text-anchor="middle">
    <text x="297" y="166">= broker</text>
    <text x="481" y="166">= broker</text>
    <text x="297" y="248">= broker</text>
    <text x="481" y="248">= broker</text>
    <text x="297" y="330">= broker</text>
    <text x="481" y="330">= broker</text>
  </g>

  <!-- zookeeper -->
  <rect x="620" y="110" width="240" height="230" rx="14" fill="#fff8e1" stroke="#b8860b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="740" y="134" font-size="13" font-weight="600" fill="#7a5b00" text-anchor="middle">ZooKeeper ensemble</text>
  <text x="740" y="150" font-size="9.5" fill="#8a6d00" text-anchor="middle">its own separate cluster / VMs</text>
  <g fill="#fff3cd" stroke="#b8860b" stroke-width="1.6">
    <rect x="640" y="164" width="200" height="46" rx="8"/>
    <rect x="640" y="222" width="200" height="46" rx="8"/>
    <rect x="640" y="280" width="200" height="46" rx="8"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#7a5b00" text-anchor="middle">
    <text x="740" y="192">ZK node 1</text>
    <text x="740" y="250">ZK node 2</text>
    <text x="740" y="308">ZK node 3</text>
  </g>

  <line x1="580" y1="225" x2="614" y2="225" stroke="#b8860b" stroke-width="2" marker-end="url(#a1)"/>
  <text x="597" y="212" font-size="9" fill="#8a6d00" text-anchor="middle">heartbeats</text>
  <circle cy="225" r="6" fill="#b8860b">
    <animate attributeName="cx" dur="2.2s" repeatCount="indefinite" values="480;740"/>
    <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>
  <circle cy="225" r="6" fill="#b8860b">
    <animate attributeName="cx" dur="2.2s" begin="1.1s" repeatCount="indefinite" values="480;740"/>
    <animate attributeName="opacity" dur="2.2s" begin="1.1s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.15;0.85;1"/>
  </circle>

  <!-- duties -->
  <text x="440" y="400" font-size="12" font-weight="600" fill="#7a5b00" text-anchor="middle">ZooKeeper = a distributed coordination service. It was the manager for Kafka:</text>
  <g fill="#fff3cd" stroke="#b8860b" stroke-width="1.4">
    <rect x="40" y="412" width="250" height="44" rx="9"/>
    <rect x="315" y="412" width="250" height="44" rx="9"/>
    <rect x="590" y="412" width="250" height="44" rx="9"/>
  </g>
  <g font-size="11.5" font-weight="600" fill="#7a5b00" text-anchor="middle">
    <text x="165" y="432">Cluster management</text>
    <text x="440" y="432">Leader election</text>
    <text x="715" y="432">Configuration management</text>
  </g>
  <g font-size="9.5" fill="#8a6d00" text-anchor="middle">
    <text x="165" y="448">which broker is up &amp; running</text>
    <text x="440" y="448">who is leader, who is replica</text>
    <text x="715" y="448">IPs, ports, replicas, topic config</text>
  </g>
</svg>
