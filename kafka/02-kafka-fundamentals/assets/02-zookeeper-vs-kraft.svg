<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="ZooKeeper as a separate cluster versus KRaft where one broker is the controller">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">2 · Why ZooKeeper was dropped &#8212; and what KRaft does instead</text>

  <!-- Panel A -->
  <rect x="20" y="50" width="400" height="360" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.5"/>
  <text x="220" y="76" font-size="13" font-weight="600" fill="#a01818" text-anchor="middle">Before &#8212; two clusters to run</text>

  <rect x="45" y="92" width="350" height="112" rx="10" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="220" y="112" font-size="11" font-weight="600" fill="#a01818" text-anchor="middle">Kafka cluster</text>
  <g fill="#f8dede" stroke="#c62828" stroke-width="1.4">
    <rect x="57" y="122" width="74" height="44" rx="7"/>
    <rect x="143" y="122" width="74" height="44" rx="7"/>
    <rect x="229" y="122" width="74" height="44" rx="7"/>
    <rect x="315" y="122" width="74" height="44" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#a01818" text-anchor="middle">
    <text x="94" y="149">broker</text>
    <text x="180" y="149">broker</text>
    <text x="266" y="149">broker</text>
    <text x="352" y="149">broker</text>
  </g>
  <text x="220" y="192" font-size="9.5" fill="#c0392b" text-anchor="middle">brokers cannot manage themselves</text>

  <line x1="220" y1="204" x2="220" y2="236" stroke="#c62828" stroke-width="2" marker-end="url(#a2)"/>
  <circle cx="220" r="5" fill="#c62828">
    <animate attributeName="cy" dur="1.8s" repeatCount="indefinite" values="204;236"/>
    <animate attributeName="opacity" dur="1.8s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.75;1"/>
  </circle>

  <rect x="85" y="240" width="270" height="80" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="220" y="260" font-size="11" font-weight="600" fill="#7a5b00" text-anchor="middle">ZooKeeper ensemble &#8212; separate VMs</text>
  <g fill="#fff8e1" stroke="#b8860b" stroke-width="1.3">
    <rect x="95" y="268" width="70" height="42" rx="7"/>
    <rect x="185" y="268" width="70" height="42" rx="7"/>
    <rect x="275" y="268" width="70" height="42" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#7a5b00" text-anchor="middle">
    <text x="130" y="294">ZK 1</text>
    <text x="220" y="294">ZK 2</text>
    <text x="310" y="294">ZK 3</text>
  </g>

  <g font-size="11" fill="#a01818">
    <text x="46" y="344">&#10007;&#160; Infrastructure cost &#8212; extra cluster, extra VMs</text>
    <text x="46" y="366">&#10007;&#160; Operational complexity &#8212; need ZooKeeper skills too</text>
    <text x="46" y="388">&#10007;&#160; Scalability &#8212; as Kafka grows, ZK becomes the bottleneck</text>
  </g>

  <!-- Panel B -->
  <rect x="460" y="50" width="400" height="360" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.5"/>
  <text x="660" y="76" font-size="13" font-weight="600" fill="#0f4d2a" text-anchor="middle">Now &#8212; KRaft: one cluster, self-managed</text>

  <rect x="485" y="92" width="350" height="200" rx="10" fill="#f2f9f4" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="660" y="112" font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">Kafka cluster (KRaft mode)</text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="609" y="126" width="100" height="56" rx="8"/>
    <rect x="721" y="126" width="100" height="56" rx="8"/>
    <rect x="497" y="196" width="100" height="56" rx="8"/>
    <rect x="609" y="196" width="100" height="56" rx="8"/>
    <rect x="721" y="196" width="100" height="56" rx="8"/>
  </g>
  <!-- controller -->
  <rect x="497" y="126" width="100" height="56" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="2.4">
    <animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" values="2.4;4.2;2.4"/>
  </rect>
  <text x="547" y="150" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">CONTROLLER</text>
  <text x="547" y="166" font-size="9" fill="#8a6d00" text-anchor="middle">a broker too</text>
  <g font-size="10.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="659" y="158">broker</text>
    <text x="771" y="158">broker</text>
    <text x="547" y="228">broker</text>
    <text x="659" y="228">broker</text>
    <text x="771" y="228">broker</text>
  </g>

  <!-- controller pushes metadata -->
  <g stroke="#b8860b" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="597" y1="154" x2="609" y2="154"/>
    <line x1="597" y1="160" x2="771" y2="196"/>
    <line x1="547" y1="182" x2="547" y2="196"/>
    <line x1="560" y1="182" x2="659" y2="196"/>
    <line x1="570" y1="182" x2="760" y2="196"/>
  </g>
  <circle r="5" fill="#b8860b">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M547 182 L547 196"/>
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/>
  </circle>
  <circle r="5" fill="#b8860b">
    <animateMotion dur="2.6s" begin="0.4s" repeatCount="indefinite" path="M597 154 L659 154"/>
    <animate attributeName="opacity" dur="2.6s" begin="0.4s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/>
  </circle>
  <circle r="5" fill="#b8860b">
    <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M570 182 L760 196"/>
    <animate attributeName="opacity" dur="2.6s" begin="0.8s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/>
  </circle>
  <text x="660" y="274" font-size="9.5" fill="#8a6d00" text-anchor="middle">controller pushes metadata to every broker</text>

  <g font-size="11" fill="#0f4d2a">
    <text x="486" y="322">&#10003;&#160; No second cluster &#8212; no extra VMs, no extra cost</text>
    <text x="486" y="344">&#10003;&#160; One system to operate and understand</text>
    <text x="486" y="366">&#10003;&#160; Metadata lives inside Kafka &#8212; scales with the cluster</text>
    <text x="486" y="388">&#10003;&#160; Controller dies? another broker takes over &#8212; &#8220;they work like a family&#8221;</text>
  </g>
</svg>
