<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="An event is anything that happened, Kafka calls it a record or message and stores it in a topic which behaves like a table">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">3 · Event &#8594; record / message &#8594; topic</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">An event is simply &#8220;something that happened&#8221;. A topic is where Kafka collects and organises them.</text>

  <!-- events -->
  <text x="135" y="94" font-size="11.5" font-weight="600" fill="#12305e" text-anchor="middle">Something happened</text>
  <g fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8">
    <rect x="30" y="108" width="210" height="52" rx="9"/>
    <rect x="30" y="176" width="210" height="52" rx="9"/>
    <rect x="30" y="244" width="210" height="52" rx="9"/>
  </g>
  <g font-size="12" font-weight="600" fill="#12305e" text-anchor="middle">
    <text x="135" y="132">I like a post on Facebook</text>
    <text x="135" y="200">I place an order on Amazon</text>
    <text x="135" y="268">A user clicks a link</text>
  </g>
  <g font-size="9.5" fill="#2f5fa8" text-anchor="middle">
    <text x="135" y="148">&#8594; a like event</text>
    <text x="135" y="216">&#8594; an order event</text>
    <text x="135" y="284">&#8594; a click event</text>
  </g>

  <!-- bridge -->
  <line x1="248" y1="202" x2="404" y2="202" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="256" y="150" width="150" height="42" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="331" y="167" font-size="10.5" font-weight="600" fill="#7a5b00" text-anchor="middle">In Kafka we call it a</text>
  <text x="331" y="183" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">record  /  message</text>

  <!-- topic as table -->
  <rect x="420" y="86" width="430" height="250" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <rect x="420" y="86" width="430" height="42" rx="12" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
  <text x="635" y="113" font-size="13" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic:  order-event</text>

  <g font-size="10.5" fill="#1e7a44">
    <text x="440" y="148">offset</text>
    <text x="510" y="148">key</text>
    <text x="620" y="148">value (the record)</text>
  </g>
  <line x1="432" y1="156" x2="838" y2="156" stroke="#b6ddc4" stroke-width="1.4"/>

  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.12;0.16;1"/>
    <rect x="432" y="164" width="406" height="38" rx="6" fill="#e6f4ea"/>
    <text x="440" y="188" font-size="11" fill="#0f4d2a">0</text>
    <text x="510" y="188" font-size="11" fill="#0f4d2a">cust-91</text>
    <text x="620" y="188" font-size="11" fill="#0f4d2a">{ orderId: 101, amount: 2499 }</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.34;0.38;1"/>
    <rect x="432" y="208" width="406" height="38" rx="6" fill="#f2f9f4"/>
    <text x="440" y="232" font-size="11" fill="#0f4d2a">1</text>
    <text x="510" y="232" font-size="11" fill="#0f4d2a">cust-14</text>
    <text x="620" y="232" font-size="11" fill="#0f4d2a">{ orderId: 102, amount: 799 }</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.58;0.62;1"/>
    <rect x="432" y="252" width="406" height="38" rx="6" fill="#e6f4ea"/>
    <text x="440" y="276" font-size="11" fill="#0f4d2a">2</text>
    <text x="510" y="276" font-size="11" fill="#0f4d2a">cust-77</text>
    <text x="620" y="276" font-size="11" fill="#0f4d2a">{ orderId: 103, amount: 15999 }</text>
  </g>
  <text x="635" y="316" font-size="10" fill="#1e7a44" text-anchor="middle">rows keep appending &#8212; you can create N topics: order-event, user-clicks, likes-event &#8230;</text>

  <!-- flying record -->
  <circle r="8" fill="#f4b400" stroke="#8a6d00" stroke-width="1.4">
    <animate attributeName="cx" dur="9s" repeatCount="indefinite"
             values="135;500;135;500;135;500;135"
             keyTimes="0;0.14;0.24;0.36;0.46;0.60;1"/>
    <animate attributeName="cy" dur="9s" repeatCount="indefinite"
             values="134;183;202;227;270;271;271"
             keyTimes="0;0.14;0.24;0.36;0.46;0.60;1"/>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
             values="1;1;0;1;1;0;1;1;0;0"
             keyTimes="0;0.14;0.17;0.24;0.36;0.39;0.46;0.60;0.63;1"/>
  </circle>

  <rect x="24" y="352" width="826" height="34" rx="8" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.3"/>
  <text x="437" y="374" font-size="11.5" font-weight="600" fill="#1b2a3a" text-anchor="middle">Mental model: topic &#8776; table in a relational database. You insert a row &#8594; you publish a record.</text>
</svg>
