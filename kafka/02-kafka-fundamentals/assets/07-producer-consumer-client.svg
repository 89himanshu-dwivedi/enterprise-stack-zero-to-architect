<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Order service uses the Kafka client library as a producer, notification service uses it as a consumer or worker">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">7 · How applications actually talk to Kafka &#8212; the client library</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Same library on both sides. One side uses it as a producer, the other as a consumer (also called a worker).</text>

  <!-- producer app -->
  <rect x="24" y="80" width="240" height="130" rx="11" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="144" y="106" font-size="13" font-weight="600" fill="#12305e" text-anchor="middle">Order Service</text>
  <rect x="44" y="120" width="200" height="72" rx="9" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="144" y="144" font-size="11" font-weight="600" fill="#12305e" text-anchor="middle">Kafka client library</text>
  <text x="144" y="164" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">used as PRODUCER</text>
  <text x="144" y="181" font-size="9" fill="#2f5fa8" text-anchor="middle">send(record) &#8594; topic</text>

  <line x1="264" y1="145" x2="334" y2="145" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a7)"/>
  <text x="299" y="134" font-size="9" fill="#5b6b7f" text-anchor="middle">publish</text>

  <!-- broker -->
  <rect x="340" y="80" width="200" height="130" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="440" y="106" font-size="13" font-weight="600" fill="#0f4d2a" text-anchor="middle">Kafka broker</text>
  <rect x="358" y="120" width="164" height="72" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="440" y="144" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic: order-event</text>
  <text x="440" y="164" font-size="9.5" fill="#1e7a44" text-anchor="middle">records appended &amp; retained</text>
  <text x="440" y="181" font-size="9.5" fill="#1e7a44" text-anchor="middle">replicated to followers</text>

  <line x1="616" y1="145" x2="546" y2="145" stroke="#5b6b7f" stroke-width="2" marker-end="url(#a7)"/>
  <text x="581" y="134" font-size="9" fill="#5b6b7f" text-anchor="middle">poll</text>

  <!-- consumer app -->
  <rect x="616" y="80" width="240" height="130" rx="11" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="736" y="106" font-size="13" font-weight="600" fill="#12305e" text-anchor="middle">Notification Service</text>
  <rect x="636" y="120" width="200" height="72" rx="9" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="736" y="144" font-size="11" font-weight="600" fill="#12305e" text-anchor="middle">Kafka client library</text>
  <text x="736" y="164" font-size="11.5" font-weight="700" fill="#b8860b" text-anchor="middle">used as CONSUMER</text>
  <text x="736" y="181" font-size="9" fill="#2f5fa8" text-anchor="middle">a.k.a. the worker &#8212; sends email / SMS</text>

  <!-- animated records -->
  <circle cy="145" r="7" fill="#f4b400" stroke="#8a6d00" stroke-width="1.3">
    <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="144;440;440;736" keyTimes="0;0.35;0.55;0.95"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.93;0.97;1"/>
  </circle>
  <circle cy="145" r="7" fill="#f4b400" stroke="#8a6d00" stroke-width="1.3">
    <animate attributeName="cx" dur="4s" begin="1.6s" repeatCount="indefinite" values="144;440;440;736" keyTimes="0;0.35;0.55;0.95"/>
    <animate attributeName="opacity" dur="4s" begin="1.6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.93;0.97;1"/>
  </circle>

  <rect x="24" y="238" width="832" height="62" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.3"/>
  <text x="440" y="262" font-size="11.5" font-weight="600" fill="#1b2a3a" text-anchor="middle">Almost every language ships a Kafka client library &#8212; Java, Python, Node, Go, .NET, Spring Kafka&#8230;</text>
  <text x="440" y="284" font-size="11" fill="#5b6b7f" text-anchor="middle">Both sides need <tspan font-family="Consolas, monospace" fill="#7a5b00">bootstrap.servers</tspan> (to connect) and a <tspan font-family="Consolas, monospace" fill="#7a5b00">topic</tspan> (what to write to / read from).</text>
</svg>
