<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Walkthrough of the Dockerfile that builds the Kafka image, step by step">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">3 · The Dockerfile &#8212; the manual install, written down</text>

  <!-- code panel -->
  <rect x="24" y="52" width="530" height="344" rx="12" fill="#1b2a3a"/>
  <text x="42" y="76" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">Dockerfile</text>

  <rect x="34" y="86" width="510" height="34" rx="6" fill="#f4b400" opacity="0.18">
    <animate attributeName="y" dur="14s" repeatCount="indefinite"
             values="86;130;174;218;262;306;350;86"
             keyTimes="0;0.142;0.285;0.428;0.571;0.714;0.857;1"
             calcMode="discrete"/>
  </rect>

  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="46" y="108">FROM eclipse-temurin:17-jdk</text>
    <text x="46" y="152">RUN curl -o kafka.tgz https://&#8230;/kafka_2.13-3.8.1.tgz</text>
    <text x="46" y="196">RUN tar -xzf kafka.tgz</text>
    <text x="46" y="240">RUN mv kafka_2.13-3.8.1 kafka</text>
    <text x="46" y="284">ENV PATH="/opt/kafka/bin:$PATH"</text>
    <text x="46" y="328">WORKDIR /practice</text>
    <text x="46" y="372">CMD ["/opt/start.sh"]</text>
  </g>

  <!-- explanation panel -->
  <rect x="578" y="52" width="278" height="344" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="717" y="78" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">what this line does</text>
  <line x1="596" y1="90" x2="838" y2="90" stroke="#b6ddc4" stroke-width="1.3"/>

  <g font-size="11.5" fill="#0f4d2a" text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.13;0.145;1"/>
      <text x="717" y="200" font-weight="700">Step 1 &#8212; Java 17 base image</text>
      <text x="717" y="224" font-size="10.5">Kafka needs a JVM, so we start from an</text>
      <text x="717" y="240" font-size="10.5">existing JDK 17 image instead of</text>
      <text x="717" y="256" font-size="10.5">installing Java ourselves.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.14;0.15;0.275;0.29;1"/>
      <text x="717" y="200" font-weight="700">Step 2 &#8212; download the binary</text>
      <text x="717" y="224" font-size="10.5">The exact same link you would have</text>
      <text x="717" y="240" font-size="10.5">clicked on the downloads page &#8212;</text>
      <text x="717" y="256" font-size="10.5">just &#8220;copy link address&#8221; instead.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.285;0.295;0.42;0.435;1"/>
      <text x="717" y="200" font-weight="700">Step 3 &#8212; extract it</text>
      <text x="717" y="224" font-size="10.5">Same as unzipping it by hand.</text>
      <text x="717" y="240" font-size="10.5">Now bin/ config/ libs/ exist</text>
      <text x="717" y="256" font-size="10.5">inside the image.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.428;0.438;0.565;0.58;1"/>
      <text x="717" y="200" font-weight="700">Step 4 &#8212; rename the folder</text>
      <text x="717" y="224" font-size="10.5">The extracted folder is called</text>
      <text x="717" y="240" font-size="10.5">kafka_2.13-3.8.1. Rename it to</text>
      <text x="717" y="256" font-size="10.5">kafka so paths stay version-free.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.571;0.581;0.708;0.723;1"/>
      <text x="717" y="200" font-weight="700">Step 5 &#8212; PATH</text>
      <text x="717" y="224" font-size="10.5">Exactly the PATH trick from the</text>
      <text x="717" y="240" font-size="10.5">manual install, so kafka-topics.sh</text>
      <text x="717" y="256" font-size="10.5">works from any folder in the container.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.714;0.724;0.851;0.866;1"/>
      <text x="717" y="200" font-weight="700">Step 6 &#8212; a work directory</text>
      <text x="717" y="224" font-size="10.5">/practice is where you land when</text>
      <text x="717" y="240" font-size="10.5">you exec into the container, so you</text>
      <text x="717" y="256" font-size="10.5">have a clean place to try things.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.857;0.867;0.99;1"/>
      <text x="717" y="200" font-weight="700">Step 7 &#8212; CMD</text>
      <text x="717" y="224" font-size="10.5">This runs when docker run starts</text>
      <text x="717" y="240" font-size="10.5">the container. start.sh formats</text>
      <text x="717" y="256" font-size="10.5">storage and boots the broker.</text>
    </g>
  </g>
</svg>
