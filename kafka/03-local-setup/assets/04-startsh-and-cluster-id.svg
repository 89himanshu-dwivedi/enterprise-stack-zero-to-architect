<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="start.sh: cluster id, storage format, server start; and why a cluster id exists">
  <defs>
    <marker id="b4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">4 · What start.sh does, and why a cluster ID exists</text>

  <!-- 3 steps -->
  <rect x="24" y="48" width="248" height="112" rx="11" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="148" y="72" font-size="12.5" font-weight="700" fill="#7a5b00" text-anchor="middle">1 &#183; cluster ID</text>
  <text x="148" y="94" font-size="10" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">$KAFKA_CLUSTER_ID</text>
  <text x="148" y="116" font-size="10" fill="#8a6d00" text-anchor="middle">comes in as an environment</text>
  <text x="148" y="130" font-size="10" fill="#8a6d00" text-anchor="middle">variable &#8212; that is how real</text>
  <text x="148" y="144" font-size="10" fill="#8a6d00" text-anchor="middle">deployments hand it over</text>

  <line x1="272" y1="104" x2="308" y2="104" stroke="#5b6b7f" stroke-width="2" marker-end="url(#b4)"/>

  <rect x="314" y="48" width="252" height="112" rx="11" fill="#eef2f7" stroke="#5b6b7f" stroke-width="2"/>
  <text x="440" y="72" font-size="12.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">2 &#183; kafka-storage.sh format</text>
  <text x="440" y="92" font-size="9.5" fill="#5b6b7f" text-anchor="middle" font-family="Consolas, monospace">--cluster-id $ID --config server.properties</text>
  <text x="440" y="114" font-size="10" fill="#5b6b7f" text-anchor="middle">Like creating the schema/tables</text>
  <text x="440" y="128" font-size="10" fill="#5b6b7f" text-anchor="middle">before inserting rows. Kafka is stateful,</text>
  <text x="440" y="142" font-size="10" fill="#5b6b7f" text-anchor="middle">so it lays down its metadata &amp; checkpoints.</text>

  <line x1="566" y1="104" x2="602" y2="104" stroke="#5b6b7f" stroke-width="2" marker-end="url(#b4)"/>

  <rect x="608" y="48" width="248" height="112" rx="11" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
  <text x="732" y="72" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">3 &#183; kafka-server-start.sh</text>
  <text x="732" y="92" font-size="9.5" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">server.properties</text>
  <text x="732" y="114" font-size="10" fill="#1e7a44" text-anchor="middle">The broker comes up.</text>
  <text x="732" y="134" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">&#8220;Kafka Server started&#8221;</text>

  <circle cy="104" r="8" fill="#f4b400" stroke="#8a6d00" stroke-width="1.4">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" values="148;148;440;440;732;732" keyTimes="0;0.12;0.32;0.52;0.72;1"/>
  </circle>
  <text x="440" y="180" font-size="10" fill="#5b6b7f" text-anchor="middle">Already formatted? The format step is simply ignored &#8212; safe to re-run.</text>

  <line x1="24" y1="198" x2="856" y2="198" stroke="#c9d3e0" stroke-width="1.4"/>

  <!-- why cluster id -->
  <text x="440" y="224" font-size="14" font-weight="700" fill="#1b2a3a" text-anchor="middle">Why does Kafka need a cluster ID?</text>
  <text x="440" y="244" font-size="10.5" fill="#5b6b7f" text-anchor="middle">Today you run one server. Tomorrow three servers form a cluster &#8212; and a big org runs several clusters side by side.</text>

  <rect x="30" y="258" width="330" height="140" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="195" y="280" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Cluster A</text>
  <text x="195" y="296" font-size="9.5" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">cluster.id = MkU3&#8230;36Qk</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="46" y="308" width="94" height="46" rx="7"/>
    <rect x="148" y="308" width="94" height="46" rx="7"/>
    <rect x="250" y="308" width="94" height="46" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="93" y="336">broker 1</text>
    <text x="195" y="336">broker 2</text>
    <text x="297" y="336">broker 3</text>
  </g>
  <text x="195" y="376" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" opacity="0">
    &#10003; same cluster ID &#8212; accepted
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.34;0.38;0.95;1"/>
  </text>

  <rect x="520" y="258" width="330" height="140" rx="11" fill="#fff8f8" stroke="#c62828" stroke-width="2"/>
  <text x="685" y="280" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Cluster B</text>
  <text x="685" y="296" font-size="9.5" fill="#c0392b" text-anchor="middle" font-family="Consolas, monospace">cluster.id = 9pQz&#8230;Lm4A</text>
  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.4">
    <rect x="536" y="308" width="94" height="46" rx="7"/>
    <rect x="638" y="308" width="94" height="46" rx="7"/>
    <rect x="740" y="308" width="94" height="46" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#a01818" text-anchor="middle">
    <text x="583" y="336">broker 1</text>
    <text x="685" y="336">broker 2</text>
    <text x="787" y="336">broker 3</text>
  </g>
  <text x="685" y="376" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    &#10007; different cluster ID &#8212; rejected
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.95;1"/>
  </text>

  <rect x="382" y="292" width="116" height="56" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="440" y="312" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle">record</text>
  <text x="440" y="328" font-size="8.5" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">clusterId = MkU3&#8230;</text>
  <text x="440" y="342" font-size="8.5" fill="#8a6d00" text-anchor="middle">carried in the metadata</text>

  <circle r="7" fill="#1e7a44">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="382;382;250;250" keyTimes="0;0.20;0.34;1"/>
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="320;320;331;331" keyTimes="0;0.20;0.34;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.19;0.22;0.33;0.37;1"/>
  </circle>
  <circle r="7" fill="#c62828">
    <animate attributeName="cx" dur="8s" repeatCount="indefinite" values="498;498;630;630" keyTimes="0;0.48;0.62;1"/>
    <animate attributeName="cy" dur="8s" repeatCount="indefinite" values="320;320;331;331" keyTimes="0;0.48;0.62;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.47;0.50;0.61;0.65;1"/>
  </circle>

  <rect x="24" y="408" width="832" height="26" rx="7" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.3"/>
  <text x="440" y="425" font-size="10.5" font-weight="600" fill="#1b2a3a" text-anchor="middle">Every broker announces &#8220;I belong to this cluster ID&#8221; in its metadata &#8212; that is how a server tells its own cluster&#8217;s data from someone else&#8217;s.</text>
</svg>
