<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Rebuilding the image on every config change versus mounting the properties file with docker compose">
  <defs>
    <marker id="b5r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
    <marker id="b5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f4d2a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">5 · Why docker compose instead of plain docker run</text>

  <!-- Panel A -->
  <rect x="20" y="46" width="400" height="336" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="220" y="70" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">Plain image &#8212; config is baked in</text>

  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.5">
    <rect x="60" y="86" width="300" height="42" rx="8"/>
    <rect x="60" y="146" width="300" height="42" rx="8"/>
    <rect x="60" y="206" width="300" height="42" rx="8"/>
    <rect x="60" y="266" width="300" height="42" rx="8"/>
  </g>
  <g font-size="11" font-weight="600" fill="#a01818" text-anchor="middle">
    <text x="210" y="112">change one line in server.properties</text>
    <text x="210" y="166">docker build &#8212; rebuild the whole image</text>
    <text x="210" y="226">docker run the container again</text>
    <text x="210" y="286">&#8230; and repeat for every single tweak</text>
  </g>
  <path d="M370 107 C398 107 398 287 370 287" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#b5r)"/>
  <circle r="6" fill="#c62828">
    <animateMotion dur="5s" repeatCount="indefinite" path="M210 107 L210 146 L210 166 L210 206 L210 226 L210 266 L210 286"/>
  </circle>
  <text x="220" y="336" font-size="10.5" fill="#a01818" text-anchor="middle">Also: a multi-broker cluster means hand-typing many</text>
  <text x="220" y="352" font-size="10.5" fill="#a01818" text-anchor="middle">docker run commands &#8212; easy to reuse the same port</text>
  <text x="220" y="368" font-size="10.5" fill="#a01818" text-anchor="middle">for two containers and break everything.</text>

  <!-- Panel B -->
  <rect x="460" y="46" width="400" height="336" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="660" y="70" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">docker compose &#8212; config is mounted</text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="500" y="86" width="300" height="42" rx="8"/>
    <rect x="500" y="146" width="300" height="42" rx="8"/>
    <rect x="500" y="206" width="300" height="42" rx="8"/>
  </g>
  <g font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="650" y="112">edit ./properties/server.properties on the host</text>
    <text x="650" y="166">docker compose restart</text>
    <text x="650" y="226">done &#8212; no rebuild, ever</text>
  </g>
  <path d="M810 107 C838 107 838 227 810 227" fill="none" stroke="#0f4d2a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#b5g)"/>
  <circle r="6" fill="#0f4d2a">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M650 107 L650 166 L650 226"/>
  </circle>

  <rect x="500" y="262" width="300" height="104" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="650" y="284" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">Reason 2 &#8212; the cluster comes later</text>
  <text x="650" y="304" font-size="10" fill="#8a6d00" text-anchor="middle">One compose file can declare 3 or 5 brokers,</text>
  <text x="650" y="320" font-size="10" fill="#8a6d00" text-anchor="middle">each with its own node.id, port and volume.</text>
  <text x="650" y="336" font-size="10" fill="#8a6d00" text-anchor="middle">No hand-typed commands, no duplicate ports,</text>
  <text x="650" y="352" font-size="10" fill="#8a6d00" text-anchor="middle">and one <tspan font-family="Consolas, monospace">docker compose down</tspan> cleans it all up.</text>

  <!-- mount visual -->
  <path d="M500 107 L470 107" fill="none" stroke="#1e7a44" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="660" y="132" font-size="9" fill="#1e7a44" text-anchor="middle">volumes: ./properties/server.properties &#8594; /opt/kafka/config/kraft/server.properties</text>
</svg>
