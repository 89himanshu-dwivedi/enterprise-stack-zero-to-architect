<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="process.roles and node.id on a single node versus a multi node cluster">
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · server.properties &#8212; process.roles, node.id, log.dirs</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">The only three lines that matter right now. The rest gets explained when we build a real cluster.</text>

  <!-- Panel A single node -->
  <rect x="20" y="66" width="390" height="290" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="215" y="90" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Today &#8212; one node plays both parts</text>

  <rect x="60" y="106" width="310" height="130" rx="11" fill="#e6f4ea" stroke="#0f4d2a" stroke-width="2.4"/>
  <text x="215" y="130" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">a single Kafka node</text>
  <rect x="82" y="144" width="126" height="44" rx="9" fill="#ffffff" stroke="#1e7a44" stroke-width="1.8">
    <animate attributeName="stroke-width" dur="2.6s" repeatCount="indefinite" values="1.8;3.4;1.8"/>
  </rect>
  <text x="145" y="171" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">broker</text>
  <rect x="222" y="144" width="126" height="44" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8">
    <animate attributeName="stroke-width" dur="2.6s" begin="1.3s" repeatCount="indefinite" values="1.8;3.4;1.8"/>
  </rect>
  <text x="285" y="171" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">controller</text>
  <text x="215" y="212" font-size="10" fill="#1e7a44" text-anchor="middle">only one machine is running, so it wears both hats</text>
  <text x="215" y="228" font-size="10" fill="#1e7a44" text-anchor="middle">node.id is just 1, because there is nobody else</text>

  <rect x="46" y="250" width="338" height="90" rx="9" fill="#1b2a3a"/>
  <g font-size="10.5" font-family="Consolas, monospace">
    <text x="62" y="274" fill="#a8d5ba">process.roles=broker,controller</text>
    <text x="62" y="296" fill="#a8d5ba">node.id=1</text>
    <text x="62" y="318" fill="#f4b400">log.dirs=/tmp/kraft-combined-logs</text>
  </g>

  <!-- Panel B cluster -->
  <rect x="450" y="66" width="410" height="290" rx="12" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.8"/>
  <text x="655" y="90" font-size="12.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">Later &#8212; a real cluster, every node different</text>

  <g fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.6">
    <rect x="470" y="106" width="182" height="94" rx="9"/>
    <rect x="662" y="106" width="182" height="94" rx="9"/>
    <rect x="470" y="212" width="182" height="94" rx="9"/>
    <rect x="662" y="212" width="182" height="94" rx="9"/>
  </g>
  <g text-anchor="middle" font-family="Consolas, monospace">
    <text x="561" y="132" font-size="11" font-weight="700" fill="#1b2a3a">node.id=1</text>
    <text x="561" y="152" font-size="9.5" fill="#7a5b00">roles=controller</text>
    <text x="753" y="132" font-size="11" font-weight="700" fill="#1b2a3a">node.id=2</text>
    <text x="753" y="152" font-size="9.5" fill="#0f4d2a">roles=broker</text>
    <text x="561" y="238" font-size="11" font-weight="700" fill="#1b2a3a">node.id=3</text>
    <text x="561" y="258" font-size="9.5" fill="#0f4d2a">roles=broker</text>
    <text x="753" y="238" font-size="11" font-weight="700" fill="#1b2a3a">node.id=4</text>
    <text x="753" y="258" font-size="9.5" fill="#0f4d2a">roles=broker</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#5b6b7f">
    <text x="561" y="176">uses controller.properties</text>
    <text x="753" y="176">uses broker.properties</text>
    <text x="561" y="282">uses broker.properties</text>
    <text x="753" y="282">uses broker.properties</text>
  </g>
  <text x="655" y="330" font-size="10.5" fill="#5b6b7f" text-anchor="middle">Every node gets a <tspan font-family="Consolas, monospace" fill="#1b2a3a">different node.id</tspan> &#8212; that is how the cluster tells them apart.</text>
  <text x="655" y="346" font-size="10.5" fill="#5b6b7f" text-anchor="middle">server.properties = the generic config; broker/controller.properties kick in per role.</text>
</svg>
