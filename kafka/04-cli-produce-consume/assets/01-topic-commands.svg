<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="kafka-topics.sh create, delete and list commands running in a terminal">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">1 · Topic commands &#8212; create, delete, list</text>

  <rect x="24" y="48" width="530" height="364" rx="12" fill="#1b2a3a"/>
  <text x="40" y="70" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">root@kafka:/practice</text>

  <g font-size="10.5" font-family="Consolas, monospace">
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.02;0.04;1"/>
      <text x="40" y="96" fill="#a8d5ba">$ docker exec -it kafka bash</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.10;0.12;1"/>
      <text x="40" y="122" fill="#a8d5ba">$ kafka-topics.sh --bootstrap-server localhost:9092 \</text>
      <text x="40" y="138" fill="#a8d5ba">&#160;&#160;&#160;&#160;--topic hello-world --create</text>
      <text x="40" y="156" fill="#dbe4ee">Created topic hello-world.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.26;0.28;1"/>
      <text x="40" y="182" fill="#a8d5ba">$ kafka-topics.sh --bootstrap-server localhost:9092 \</text>
      <text x="40" y="198" fill="#a8d5ba">&#160;&#160;&#160;&#160;--topic test --create</text>
      <text x="40" y="216" fill="#dbe4ee">Created topic test.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.42;0.44;1"/>
      <text x="40" y="242" fill="#a8d5ba">$ kafka-topics.sh ... --topic order-events --create</text>
      <text x="40" y="260" fill="#dbe4ee">Created topic order-events.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.58;0.60;1"/>
      <text x="40" y="286" fill="#f4b400">$ kafka-topics.sh ... --topic order-events --delete</text>
      <text x="40" y="304" fill="#8ea3bb">(same command &#8212; just --delete instead of --create)</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.76;0.78;1"/>
      <text x="40" y="330" fill="#a8d5ba">$ kafka-topics.sh --bootstrap-server localhost:9092 --list</text>
      <text x="40" y="348" fill="#8ea3bb">(no --topic needed &#8212; we want them all)</text>
      <text x="40" y="368" fill="#dbe4ee">hello-world</text>
      <text x="40" y="386" fill="#dbe4ee">test</text>
    </g>
  </g>

  <!-- topics shelf -->
  <rect x="576" y="48" width="280" height="364" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="716" y="72" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">topics in the cluster</text>

  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.14;0.17;1"/>
    <rect x="600" y="94" width="232" height="52" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
    <text x="716" y="118" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">hello-world</text>
    <text x="716" y="135" font-size="9" fill="#1e7a44" text-anchor="middle">1 partition &#183; replication factor 1</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.30;0.33;1"/>
    <rect x="600" y="160" width="232" height="52" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
    <text x="716" y="184" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">test</text>
    <text x="716" y="201" font-size="9" fill="#1e7a44" text-anchor="middle">1 partition &#183; replication factor 1</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.46;0.49;0.60;0.64;1"/>
    <rect x="600" y="226" width="232" height="52" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
    <text x="716" y="250" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">order-events</text>
    <text x="716" y="267" font-size="9" fill="#8a6d00" text-anchor="middle">created &#8230; then deleted</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.74;1"/>
    <text x="716" y="256" font-size="11" font-weight="700" fill="#c62828" text-anchor="middle">&#10007; order-events deleted</text>
  </g>

  <rect x="600" y="330" width="232" height="64" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="716" y="352" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">--bootstrap-server</text>
  <text x="716" y="370" font-size="9.5" fill="#8a6d00" text-anchor="middle">how you connect to the cluster</text>
  <text x="716" y="385" font-size="9.5" fill="#8a6d00" text-anchor="middle">&#8212; needed in almost every command</text>
</svg>
