<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Reading the output of kafka-topics describe field by field">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">2 · Reading <tspan font-family="Consolas, monospace">--describe</tspan> field by field</text>

  <rect x="24" y="46" width="832" height="30" rx="7" fill="#1b2a3a"/>
  <text x="40" y="66" font-size="10.5" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic hello-world --describe</text>

  <rect x="24" y="86" width="832" height="102" rx="9" fill="#22354a"/>

  <!-- highlights -->
  <g fill="#f4b400" opacity="0.22">
    <rect x="204" y="112" width="250" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0;0" keyTimes="0;0.02;0.05;0.15;0.18;1"/></rect>
    <rect x="466" y="112" width="140" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0;0" keyTimes="0;0.18;0.21;0.31;0.34;1"/></rect>
    <rect x="618" y="112" width="170" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0;0" keyTimes="0;0.34;0.37;0.47;0.50;1"/></rect>
    <rect x="222" y="150" width="112" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0;0" keyTimes="0;0.50;0.53;0.63;0.66;1"/></rect>
    <rect x="346" y="150" width="94" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0;0" keyTimes="0;0.66;0.69;0.79;0.82;1"/></rect>
    <rect x="452" y="150" width="196" height="22" rx="4"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.22;0.22;0" keyTimes="0;0.82;0.85;0.97;1"/></rect>
  </g>

  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="128">Topic: hello-world</text>
    <text x="210" y="128" fill="#a8d5ba">TopicId: 5rD8j2QwR0abcXYZ12</text>
    <text x="470" y="128" fill="#a8d5ba">PartitionCount: 1</text>
    <text x="622" y="128" fill="#a8d5ba">ReplicationFactor: 1</text>
    <text x="56" y="166">Topic: hello-world</text>
    <text x="226" y="166" fill="#a8d5ba">Partition: 0</text>
    <text x="350" y="166" fill="#a8d5ba">Leader: 1</text>
    <text x="456" y="166" fill="#a8d5ba">Replicas: 1</text>
    <text x="572" y="166" fill="#a8d5ba">Isr: 1</text>
  </g>

  <!-- explanation card -->
  <rect x="24" y="206" width="832" height="112" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <g text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.16;0.18;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">TopicId</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">An internal identifier the Kafka cluster uses for this topic.</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">You never type it &#8212; Kafka does.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.18;0.20;0.32;0.34;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">PartitionCount: 1</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">You did not ask for partitions, so Kafka created <tspan font-weight="700">one</tspan> by default.</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">Partitions are covered properly in a later part.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.48;0.50;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">ReplicationFactor: 1</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">If you do not pass <tspan font-family="Consolas, monospace">--replication-factor</tspan>, the default is <tspan font-weight="700">1</tspan>.</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">One copy only &#8212; fine for a single-node local setup.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.64;0.66;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">Partition: 0</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">Partition numbers start at <tspan font-weight="700">0</tspan> and run up to (count &#8722; 1).</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">One partition &#8594; only partition 0 exists.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.68;0.80;0.82;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">Leader: 1</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">That <tspan font-weight="700">1</tspan> is the <tspan font-family="Consolas, monospace">node.id</tspan> from server.properties.</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">Only one server is running, so node 1 is the leader.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.82;0.84;0.97;1"/>
      <text x="440" y="240" font-size="14" font-weight="700" fill="#0f4d2a">Replicas / Isr</text>
      <text x="440" y="266" font-size="12" fill="#1e7a44">Both show 1 &#8212; the same single node.</text>
      <text x="440" y="288" font-size="12" fill="#1e7a44">ISR only becomes interesting once we build a real cluster.</text>
    </g>
  </g>

  <rect x="24" y="332" width="832" height="52" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="440" y="354" font-size="11.5" font-weight="600" fill="#7a5b00" text-anchor="middle">Defaults when you create a topic with nothing but a name:</text>
  <text x="440" y="374" font-size="11.5" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">partitions = 1&#160;&#160;&#160;&#183;&#160;&#160;&#160;replication-factor = 1&#160;&#160;&#160;&#183;&#160;&#160;&#160;partition ids start at 0</text>
</svg>
