<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The data directory on disk, one folder per topic partition, and the binary contents inside">
  <defs>
    <clipPath id="hexClip"><rect x="480" y="182" width="366" height="150"/></clipPath>
    <marker id="c3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">3 · On disk &#8212; one folder per topic-partition, and everything is binary</text>

  <!-- dir listing -->
  <rect x="24" y="48" width="418" height="300" rx="12" fill="#1b2a3a"/>
  <text x="40" y="70" font-size="10" fill="#f4b400" font-family="Consolas, monospace">$ ls /tmp/kraft-combined-logs</text>
  <g font-size="10.5" font-family="Consolas, monospace">
    <text x="40" y="102" fill="#a8d5ba">hello-world-0/</text>
    <text x="40" y="120" fill="#8ea3bb">&#160;&#160;topic name + partition id</text>
    <text x="40" y="150" fill="#a8d5ba">test-0/</text>
    <text x="40" y="168" fill="#8ea3bb">&#160;&#160;same pattern</text>
    <text x="40" y="198" fill="#f4b400">__cluster_metadata-0/</text>
    <text x="40" y="216" fill="#8ea3bb">&#160;&#160;also a Kafka topic. Used when</text>
    <text x="40" y="232" fill="#8ea3bb">&#160;&#160;brokers talk to each other:</text>
    <text x="40" y="248" fill="#8ea3bb">&#160;&#160;&#8220;I belong to this cluster&#8221;</text>
    <text x="40" y="278" fill="#f4b400">__consumer_offsets-0/ &#8230;</text>
    <text x="40" y="296" fill="#8ea3bb">&#160;&#160;also a topic &#8212; covered later</text>
    <text x="40" y="326" fill="#a8d5ba">meta.properties</text>
  </g>

  <path d="M442 200 L472 200" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#c3)"/>
  <text x="457" y="190" font-size="9" fill="#5b6b7f" text-anchor="middle">open</text>

  <!-- binary panel -->
  <rect x="476" y="48" width="380" height="300" rx="12" fill="#22354a"/>
  <text x="492" y="70" font-size="10" fill="#f4b400" font-family="Consolas, monospace">$ cat hello-world-0/000&#8230;0.log</text>
  <text x="492" y="92" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">(the append-only log segment)</text>
  <line x1="492" y1="102" x2="840" y2="102" stroke="#3d5570" stroke-width="1.2"/>

  <g clip-path="url(#hexClip)">
    <g font-size="10" font-family="Consolas, monospace" fill="#8ea3bb">
      <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" values="0 0;0 -180"/>
      <text x="492" y="196">00 00 00 00 00 00 00 00 00 00 00 4a 00</text>
      <text x="492" y="214">00 00 00 02 6f 8c 1d 3b 00 00 00 00 00</text>
      <text x="492" y="232">01 ff ff ff ff ff ff 00 00 01 92 3c a1</text>
      <text x="492" y="250">7e 00 00 01 92 3c a1 7e 00 ff ff ff ff</text>
      <text x="492" y="268">ff ff ff ff 00 00 00 01 26 00 00 00 01</text>
      <text x="492" y="286">1a 68 65 6c 6c 6f 2d 77 6f 72 6c 64 00</text>
      <text x="492" y="304">00 00 00 00 00 00 00 01 00 00 00 4a 00</text>
      <text x="492" y="322">00 00 02 3d 9b 21 07 00 00 00 00 00 00</text>
      <text x="492" y="340">00 00 00 00 00 00 00 00 00 00 00 4a 00</text>
      <text x="492" y="358">00 00 00 02 6f 8c 1d 3b 00 00 00 00 00</text>
      <text x="492" y="376">01 ff ff ff ff ff ff 00 00 01 92 3c a1</text>
      <text x="492" y="394">7e 00 00 01 92 3c a1 7e 00 ff ff ff ff</text>
      <text x="492" y="412">ff ff ff ff 00 00 00 01 26 00 00 00 01</text>
      <text x="492" y="430">1a 68 65 6c 6c 6f 2d 77 6f 72 6c 64 00</text>
      <text x="492" y="448">00 00 00 00 00 00 00 01 00 00 00 4a 00</text>
      <text x="492" y="466">00 00 02 3d 9b 21 07 00 00 00 00 00 00</text>
    </g>
  </g>
  <rect x="476" y="150" width="380" height="34" fill="#22354a"/>
  <text x="492" y="140" font-size="10" fill="#dbe4ee" font-family="Consolas, monospace">&#8230; unreadable, and that is expected</text>

  <rect x="24" y="360" width="832" height="48" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="440" y="381" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">Kafka always stores data in binary format</text>
  <text x="440" y="399" font-size="11" fill="#8a6d00" text-anchor="middle">It does not matter what you produced &#8212; String, XML, JSON, a Java object. On disk it is bytes. That is why serialization exists.</text>
</svg>
