<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The producer batches records for one second by default, and sends much faster when the timeout is lowered to fifty milliseconds">
  <defs>
    <marker id="d5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">5 · That lag you see is the producer batching on purpose</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">Type fast and messages arrive in bursts. The producer holds records for a window, then ships them together &#8212; more throughput per round trip.</text>

  <!-- lane 1 -->
  <rect x="24" y="72" width="832" height="128" rx="11" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.5"/>
  <text x="44" y="96" font-size="12" font-weight="700" fill="#a01818">Default &#8212; <tspan font-family="Consolas, monospace">--timeout 1000</tspan> (1 second)</text>

  <rect x="44" y="110" width="128" height="60" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="108" y="136" font-size="11.5" font-weight="600" fill="#a01818" text-anchor="middle">you type</text>
  <text x="108" y="154" font-size="9.5" fill="#c0392b" text-anchor="middle">a &#160; s &#160; d &#160; f</text>

  <rect x="330" y="106" width="150" height="68" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="405" y="130" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">batch buffer</text>
  <text x="405" y="148" font-size="9.5" fill="#c0392b" text-anchor="middle">holds records for</text>
  <text x="405" y="163" font-size="9.5" fill="#c0392b" text-anchor="middle">up to 1000 ms</text>

  <rect x="690" y="110" width="150" height="60" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="765" y="145" font-size="11.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">broker</text>

  <line x1="172" y1="140" x2="324" y2="140" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#d5)"/>
  <line x1="480" y1="140" x2="684" y2="140" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#d5)"/>

  <g fill="#c62828">
    <circle r="6" cy="140"><animate attributeName="cx" dur="4s" repeatCount="indefinite" values="108;405;405;765;765" keyTimes="0;0.12;0.62;0.78;1"/></circle>
    <circle r="6" cy="140"><animate attributeName="cx" dur="4s" begin="0.4s" repeatCount="indefinite" values="108;405;405;765;765" keyTimes="0;0.12;0.55;0.72;1"/></circle>
    <circle r="6" cy="140"><animate attributeName="cx" dur="4s" begin="0.8s" repeatCount="indefinite" values="108;405;405;765;765" keyTimes="0;0.12;0.48;0.66;1"/></circle>
  </g>
  <text x="585" y="188" font-size="10" fill="#a01818" text-anchor="middle">everything leaves in one burst, once a second &#8594; visible lag while typing</text>

  <!-- lane 2 -->
  <rect x="24" y="212" width="832" height="128" rx="11" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.5"/>
  <text x="44" y="236" font-size="12" font-weight="700" fill="#0f4d2a">Tuned &#8212; <tspan font-family="Consolas, monospace">--timeout 50</tspan> (50 ms)</text>

  <rect x="44" y="250" width="128" height="60" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="108" y="276" font-size="11.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">you type</text>
  <text x="108" y="294" font-size="9.5" fill="#1e7a44" text-anchor="middle">a &#160; s &#160; d &#160; f</text>

  <rect x="330" y="246" width="150" height="68" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="405" y="270" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">batch buffer</text>
  <text x="405" y="288" font-size="9.5" fill="#1e7a44" text-anchor="middle">flushed every 50 ms</text>
  <text x="405" y="303" font-size="9.5" fill="#1e7a44" text-anchor="middle">smaller batches</text>

  <rect x="690" y="250" width="150" height="60" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="765" y="285" font-size="11.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">broker</text>

  <line x1="172" y1="280" x2="324" y2="280" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#d5)"/>
  <line x1="480" y1="280" x2="684" y2="280" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#d5)"/>

  <g fill="#1e7a44">
    <circle r="6" cy="280"><animate attributeName="cx" dur="1.1s" repeatCount="indefinite" values="108;405;765" keyTimes="0;0.4;1"/></circle>
    <circle r="6" cy="280"><animate attributeName="cx" dur="1.1s" begin="0.28s" repeatCount="indefinite" values="108;405;765" keyTimes="0;0.4;1"/></circle>
    <circle r="6" cy="280"><animate attributeName="cx" dur="1.1s" begin="0.55s" repeatCount="indefinite" values="108;405;765" keyTimes="0;0.4;1"/></circle>
    <circle r="6" cy="280"><animate attributeName="cx" dur="1.1s" begin="0.82s" repeatCount="indefinite" values="108;405;765" keyTimes="0;0.4;1"/></circle>
  </g>
  <text x="585" y="328" font-size="10" fill="#0f4d2a" text-anchor="middle">records leave almost immediately &#8594; lower latency, but more round trips</text>

  <rect x="24" y="350" width="832" height="24" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.2"/>
  <text x="440" y="367" font-size="10.5" font-weight="600" fill="#7a5b00" text-anchor="middle">In an application this same knob is <tspan font-family="Consolas, monospace">linger.ms</tspan>. Architects tune it per business load &#8212; latency on one side, throughput on the other.</text>
</svg>
