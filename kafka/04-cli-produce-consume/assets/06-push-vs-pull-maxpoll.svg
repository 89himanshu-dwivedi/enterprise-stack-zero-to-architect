<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Why Kafka chose a pull based consumer and how max.poll.records batches the fetch">
  <defs>
    <marker id="e6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">6 · Push vs pull &#8212; and why Kafka picked pull</text>

  <!-- push panel -->
  <rect x="20" y="46" width="400" height="270" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="220" y="70" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">PUSH &#8212; broker hands records to every consumer</text>

  <rect x="44" y="88" width="110" height="52" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
  <text x="99" y="112" font-size="11" font-weight="600" fill="#a01818" text-anchor="middle">producers</text>
  <text x="99" y="128" font-size="9" fill="#c0392b" text-anchor="middle">thousands, millions</text>

  <rect x="185" y="88" width="100" height="52" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
  <text x="235" y="118" font-size="11" font-weight="600" fill="#a01818" text-anchor="middle">broker</text>

  <rect x="316" y="88" width="82" height="52" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
  <text x="357" y="112" font-size="11" font-weight="600" fill="#a01818" text-anchor="middle">consumer</text>
  <text x="357" y="128" font-size="9" fill="#c0392b" text-anchor="middle">overloaded</text>

  <line x1="154" y1="114" x2="179" y2="114" stroke="#c62828" stroke-width="1.6" marker-end="url(#e6)"/>
  <line x1="285" y1="114" x2="310" y2="114" stroke="#c62828" stroke-width="1.6" marker-end="url(#e6)"/>

  <g fill="#c62828">
    <circle r="5" cy="114"><animate attributeName="cx" dur="1s" repeatCount="indefinite" values="99;357"/></circle>
    <circle r="5" cy="114"><animate attributeName="cx" dur="1s" begin="0.25s" repeatCount="indefinite" values="99;357"/></circle>
    <circle r="5" cy="114"><animate attributeName="cx" dur="1s" begin="0.5s" repeatCount="indefinite" values="99;357"/></circle>
    <circle r="5" cy="114"><animate attributeName="cx" dur="1s" begin="0.75s" repeatCount="indefinite" values="99;357"/></circle>
  </g>

  <g font-size="11" fill="#a01818">
    <text x="44" y="176">The broker would have to track every consumer</text>
    <text x="44" y="198">and match the producer&#8217;s rate.</text>
    <text x="44" y="228">There is no guarantee the consumer can process</text>
    <text x="44" y="250">as fast as the producers are producing.</text>
    <text x="44" y="280" font-weight="700">Result: the broker&#8217;s speed dictates everyone&#8217;s speed.</text>
  </g>

  <!-- pull panel -->
  <rect x="460" y="46" width="400" height="270" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="660" y="70" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">PULL &#8212; consumer goes and fetches, at its own pace</text>

  <rect x="500" y="88" width="140" height="52" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="570" y="118" font-size="11.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">Kafka broker</text>
  <rect x="700" y="88" width="140" height="52" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="770" y="112" font-size="11.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">consumer</text>
  <text x="770" y="128" font-size="9" fill="#1e7a44" text-anchor="middle">calm, in control</text>

  <path d="M770 88 L770 72 L570 72 L570 88" fill="none" stroke="#1e7a44" stroke-width="1.5" marker-end="url(#e6)"/>
  <path d="M570 140 L570 160 L770 160 L770 140" fill="none" stroke="#1e7a44" stroke-width="1.5" marker-end="url(#e6)"/>
  <text x="670" y="178" font-size="9.5" fill="#1e7a44" text-anchor="middle">returns a batch, not one record</text>

  <circle r="6" fill="#f4b400" stroke="#8a6d00" stroke-width="1.2">
    <animateMotion dur="3s" repeatCount="indefinite" path="M770 88 L770 72 L570 72 L570 88" keyPoints="0;1;1" keyTimes="0;0.35;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.35;0.4;1"/>
  </circle>
  <circle r="6" fill="#1e7a44">
    <animateMotion dur="3s" repeatCount="indefinite" path="M570 140 L570 160 L770 160 L770 140" keyPoints="0;0;1;1" keyTimes="0;0.45;0.85;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.44;0.47;0.84;0.88;1"/>
  </circle>

  <rect x="484" y="196" width="352" height="100" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="660" y="218" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">max.poll.records = 50</text>
  <text x="660" y="240" font-size="10.5" fill="#8a6d00" text-anchor="middle">Pull does <tspan font-weight="700">not</tspan> mean one message at a time.</text>
  <text x="660" y="258" font-size="10.5" fill="#8a6d00" text-anchor="middle">Just as the producer batches, a single poll() can</text>
  <text x="660" y="276" font-size="10.5" fill="#8a6d00" text-anchor="middle">fetch 50 records in one shot &#8212; another knob architects tune.</text>

  <rect x="24" y="332" width="832" height="72" rx="10" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="440" y="356" font-size="12.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">Why pull won: workload isolation</text>
  <text x="440" y="378" font-size="11.5" fill="#5b6b7f" text-anchor="middle">Producers produce independently. Consumers process at their own speed. Neither side can drown the other,</text>
  <text x="440" y="396" font-size="11.5" fill="#5b6b7f" text-anchor="middle">and the broker never has to keep track of who has been notified.</text>
</svg>
