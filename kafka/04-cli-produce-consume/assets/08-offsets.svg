<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Offsets: a partition behaves like an array and the consumer offset advances as records are acknowledged">
  <defs>
    <marker id="g8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">8 · Offsets &#8212; how Kafka remembers where you stopped</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">A partition is an array-like structure that starts at index 0. The offset is simply a number: up to which point the consumer has consumed.</text>

  <!-- producer -->
  <rect x="24" y="72" width="150" height="52" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="99" y="94" font-size="11.5" font-weight="600" fill="#12305e" text-anchor="middle">Producer</text>
  <text x="99" y="111" font-size="9" fill="#2f5fa8" text-anchor="middle">writes continuously, in order</text>
  <path d="M174 98 L210 98 L210 142" fill="none" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#g8)"/>

  <text x="530" y="94" font-size="11" font-weight="600" fill="#0f4d2a">topic hello-world &#8212; partition 0 (the only one, created by default)</text>

  <!-- next-offset pointer -->
  <g>
    <polygon points="-9,138 9,138 0,124" fill="#b8860b">
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
        values="238 0;238 0;238 0;402 0;402 0;566 0;566 0;730 0;730 0"
        keyTimes="0;0.18;0.34;0.40;0.54;0.60;0.74;0.80;1"/>
    </polygon>
    <text y="118" font-size="9.5" font-weight="700" fill="#7a5b00" text-anchor="middle">
      <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite"
        values="238 0;238 0;238 0;402 0;402 0;566 0;566 0;730 0;730 0"
        keyTimes="0;0.18;0.34;0.40;0.54;0.60;0.74;0.80;1"/>
      next offset
    </text>
  </g>

  <!-- cells -->
  <g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.02;0.04;1"/>
      <rect x="200" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="238" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec A</text>
      <text x="238" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 0</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.04;0.06;1"/>
      <rect x="282" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="320" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec B</text>
      <text x="320" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 1</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.06;0.08;1"/>
      <rect x="364" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="402" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec C</text>
      <text x="402" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 2</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.08;0.10;1"/>
      <rect x="446" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="484" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec D</text>
      <text x="484" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 3</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.10;0.12;1"/>
      <rect x="528" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="566" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec E</text>
      <text x="566" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 4</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.12;0.14;1"/>
      <rect x="610" y="146" width="76" height="64" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
      <text x="648" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec F</text>
      <text x="648" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 5</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.14;0.16;1"/>
      <rect x="692" y="146" width="76" height="64" rx="8" fill="#f2f9f4" stroke="#b6ddc4" stroke-width="1.6"/>
      <text x="730" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec G</text>
      <text x="730" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 6</text></g>
    <g><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.16;0.18;1"/>
      <rect x="774" y="146" width="76" height="64" rx="8" fill="#f2f9f4" stroke="#b6ddc4" stroke-width="1.6"/>
      <text x="812" y="176" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">rec H</text>
      <text x="812" y="196" font-size="10" fill="#1e7a44" text-anchor="middle">offset 7</text></g>
  </g>

  <!-- consumed overlays -->
  <g fill="#0f4d2a" opacity="0">
    <rect x="200" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.22;0.26;1"/></rect>
    <rect x="282" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.24;0.28;1"/></rect>
    <rect x="364" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.42;0.46;1"/></rect>
    <rect x="446" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.44;0.48;1"/></rect>
    <rect x="528" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.62;0.66;1"/></rect>
    <rect x="610" y="146" width="76" height="64" rx="8" opacity="0.16"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;0.16;0.16" keyTimes="0;0.64;0.68;1"/></rect>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.2;0.22;0.96;1"/>
  </g>

  <!-- consumer -->
  <rect x="330" y="256" width="220" height="58" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="440" y="280" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">Consumer</text>
  <text x="440" y="298" font-size="9.5" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">max.poll.records = 2</text>

  <!-- fetch dots -->
  <g fill="#2f5fa8">
    <circle r="6"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="238;238;400;400" keyTimes="0;0.20;0.26;1"/><animate attributeName="cy" dur="14s" repeatCount="indefinite" values="210;210;256;256" keyTimes="0;0.20;0.26;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.19;0.22;0.27;1"/></circle>
    <circle r="6"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="402;402;440;440" keyTimes="0;0.40;0.46;1"/><animate attributeName="cy" dur="14s" repeatCount="indefinite" values="210;210;256;256" keyTimes="0;0.40;0.46;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.39;0.42;0.47;1"/></circle>
    <circle r="6"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="566;566;480;480" keyTimes="0;0.60;0.66;1"/><animate attributeName="cy" dur="14s" repeatCount="indefinite" values="210;210;256;256" keyTimes="0;0.60;0.66;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.59;0.62;0.67;1"/></circle>
  </g>
  <!-- ack dots -->
  <g fill="#b8860b">
    <circle r="6"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="440;440;280;280" keyTimes="0;0.30;0.36;1"/><animate attributeName="cy" dur="14s" repeatCount="indefinite" values="256;256;212;212" keyTimes="0;0.30;0.36;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.29;0.32;0.37;1"/></circle>
    <circle r="6"><animate attributeName="cx" dur="14s" repeatCount="indefinite" values="440;440;450;450" keyTimes="0;0.50;0.56;1"/><animate attributeName="cy" dur="14s" repeatCount="indefinite" values="256;256;212;212" keyTimes="0;0.50;0.56;1"/><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.49;0.52;0.57;1"/></circle>
  </g>

  <!-- caption -->
  <rect x="24" y="328" width="832" height="28" rx="7" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.3"/>
  <g text-anchor="middle" font-size="11.5" font-weight="600" fill="#1b2a3a">
    <text x="440" y="347" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.19;0.21;1"/>Producer appends records in order &#8212; offsets 0, 1, 2, 3 &#8230;</text>
    <text x="440" y="347" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.37;0.39;1"/>poll #1 &#8594; 2 records (offsets 0, 1) &#8594; consumer acknowledges &#8594; Kafka moves the offset to 2</text>
    <text x="440" y="347" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.39;0.41;0.57;0.59;1"/>poll #2 starts at offset 2 &#8594; reads C and D &#8594; offset moves to 4</text>
    <text x="440" y="347" opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.59;0.61;0.96;1"/>poll #3 starts at offset 4 &#8594; reads E and F &#8594; offset moves to 6. Order is never broken.</text>
  </g>

  <!-- console -->
  <rect x="24" y="366" width="500" height="94" rx="10" fill="#1b2a3a"/>
  <text x="40" y="386" font-size="9.5" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-console-consumer.sh ... --topic hello-world \</text>
  <text x="40" y="402" font-size="9.5" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;--property print.offset=true</text>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="424" opacity="0">Offset:41&#160;&#160;&#160;&#160;hello<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.15;0.2;1"/></text>
    <text x="40" y="442" opacity="0">Offset:42&#160;&#160;&#160;&#160;hi<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.45;0.5;1"/></text>
    <text x="300" y="424" opacity="0">Offset:43&#160;&#160;&#160;&#160;bye<animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.75;0.8;1"/></text>
  </g>

  <rect x="536" y="366" width="320" height="94" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="696" y="388" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">What the offset buys you</text>
  <text x="696" y="408" font-size="10.5" fill="#8a6d00" text-anchor="middle">Records sit in the exact order the producer</text>
  <text x="696" y="424" font-size="10.5" fill="#8a6d00" text-anchor="middle">wrote them, so the consumer is guaranteed</text>
  <text x="696" y="440" font-size="10.5" fill="#8a6d00" text-anchor="middle">to receive events in the order they occurred.</text>
  <text x="696" y="454" font-size="9.5" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">__consumer_offsets is where this is stored</text>
</svg>
