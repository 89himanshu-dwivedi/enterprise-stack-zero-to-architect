<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Splitting one partition across two instances breaks ordering: a withdrawal is processed before the deposit and gets rejected">
  <defs>
    <marker id="p4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">4 · &#8220;Just split the messages between the instances&#8221; &#8212; why that is worse</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">Banking example. Two records for the <tspan font-weight="700">same account</tspan>, handed to two instances of the transaction service.</text>

  <!-- records -->
  <rect x="24" y="74" width="210" height="120" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="129" y="96" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 0 &#8212; account A</text>
  <rect x="40" y="106" width="178" height="36" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
  <text x="129" y="129" font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">offset 0 &#183; deposit 100</text>
  <rect x="40" y="148" width="178" height="36" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
  <text x="129" y="171" font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">offset 1 &#183; withdraw 50</text>

  <path d="M234 124 L300 116" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#p4)"/>
  <path d="M234 166 L300 250" fill="none" stroke="#c62828" stroke-width="1.8" marker-end="url(#p4)"/>
  <text x="262" y="200" font-size="9" fill="#c62828" text-anchor="middle">round-robin</text>

  <!-- instance 1 fast -->
  <rect x="306" y="86" width="250" height="76" rx="10" fill="#fff8f8" stroke="#c62828" stroke-width="1.8"/>
  <text x="431" y="110" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">instance 1 &#8212; FAST</text>
  <text x="431" y="128" font-size="10.5" fill="#c0392b" text-anchor="middle">got: withdraw 50</text>
  <text x="431" y="148" font-size="9.5" fill="#c0392b" text-anchor="middle">finishes almost immediately</text>
  <rect x="322" y="166" width="218" height="12" rx="6" fill="#f8dede"/>
  <rect x="322" y="166" width="10" height="12" rx="6" fill="#c62828">
    <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;218;218;0" keyTimes="0;0.25;0.95;1"/>
  </rect>

  <!-- instance 2 slow -->
  <rect x="306" y="220" width="250" height="76" rx="10" fill="#fff8f8" stroke="#c62828" stroke-width="1.8"/>
  <text x="431" y="244" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">instance 2 &#8212; SLOW</text>
  <text x="431" y="262" font-size="10.5" fill="#c0392b" text-anchor="middle">got: deposit 100</text>
  <text x="431" y="282" font-size="9.5" fill="#c0392b" text-anchor="middle">GC pause, slow DB, whatever</text>
  <rect x="322" y="300" width="218" height="12" rx="6" fill="#f8dede"/>
  <rect x="322" y="300" width="10" height="12" rx="6" fill="#c62828">
    <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;218;218;0" keyTimes="0;0.72;0.95;1"/>
  </rect>

  <!-- db -->
  <rect x="600" y="120" width="256" height="150" rx="11" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="728" y="144" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">account A balance</text>
  <text x="728" y="184" font-size="26" font-weight="700" fill="#a01818" text-anchor="middle" opacity="1">
    0
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.70;0.74;0.97;1"/>
  </text>
  <text x="728" y="184" font-size="26" font-weight="700" fill="#0f4d2a" text-anchor="middle" opacity="0">
    100
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.72;0.76;0.97;1"/>
  </text>
  <text x="728" y="214" font-size="11" fill="#5b6b7f" text-anchor="middle" opacity="0">
    withdraw 50 arrives first &#8594;
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.26;0.30;0.95;1"/>
  </text>
  <text x="728" y="238" font-size="13" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    &#10007; TRANSACTION REJECTED
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.28;0.32;0.95;1"/>
  </text>
  <text x="728" y="256" font-size="9.5" fill="#a01818" text-anchor="middle" opacity="0">
    &#8220;insufficient balance&#8221;
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.28;0.32;0.95;1"/>
  </text>
  <text x="728" y="290" font-size="10" fill="#0f4d2a" text-anchor="middle" opacity="0">
    deposit lands afterwards &#8212; too late
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.73;0.77;0.95;1"/>
  </text>

  <rect x="24" y="330" width="832" height="86" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="440" y="354" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">The user deposited first and withdrew second. The system processed them the other way round.</text>
  <text x="440" y="376" font-size="11.5" fill="#a01818" text-anchor="middle">Blindly spraying records from one partition across instances destroys ordering, and ordering is exactly what Kafka is good at.</text>
  <text x="440" y="400" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Ordering is guaranteed <tspan text-decoration="underline">within a partition</tspan> &#8212; that is where offsets 0, 1, 2, 3 live.</text>
</svg>
