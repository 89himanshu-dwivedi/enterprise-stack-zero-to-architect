<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Two partitions assigned to two consumer instances gives parallelism, and it scales to fifty partitions and fifty instances">
  <defs>
    <marker id="p5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">5 · Partitions are the unit of parallelism</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">One partition goes to exactly one instance inside a group. Two partitions, two instances, work actually splits.</text>

  <rect x="180" y="72" width="330" height="196" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="345" y="94" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic: order-events &#8212; 2 partitions</text>

  <rect x="196" y="106" width="298" height="66" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="345" y="130" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 0</text>
  <text x="345" y="150" font-size="9.5" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">offsets 0 1 2 3 4 &#8230;</text>
  <text x="345" y="164" font-size="9" fill="#1e7a44" text-anchor="middle">ordered inside itself</text>

  <rect x="196" y="184" width="298" height="66" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="345" y="208" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 1</text>
  <text x="345" y="228" font-size="9.5" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">offsets 0 1 2 3 4 &#8230;</text>
  <text x="345" y="242" font-size="9" fill="#1e7a44" text-anchor="middle">ordered inside itself</text>

  <rect x="24" y="140" width="140" height="60" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="94" y="166" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">Order Service</text>
  <text x="94" y="184" font-size="9" fill="#2f5fa8" text-anchor="middle">produces with a key</text>
  <path d="M164 162 L192 139" fill="none" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#p5)"/>
  <path d="M164 178 L192 214" fill="none" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#p5)"/>

  <line x1="510" y1="139" x2="576" y2="139" stroke="#1e7a44" stroke-width="2" marker-end="url(#p5)"/>
  <line x1="510" y1="217" x2="576" y2="217" stroke="#1e7a44" stroke-width="2" marker-end="url(#p5)"/>

  <rect x="582" y="106" width="274" height="66" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="719" y="132" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">Payment Service &#8212; instance 1</text>
  <text x="719" y="152" font-size="9.5" fill="#2f5fa8" text-anchor="middle">reads partition 0 only</text>

  <rect x="582" y="184" width="274" height="66" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="719" y="210" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">Payment Service &#8212; instance 2</text>
  <text x="719" y="230" font-size="9.5" fill="#2f5fa8" text-anchor="middle">reads partition 1 only</text>

  <rect x="576" y="94" width="286" height="166" rx="12" fill="none" stroke="#b8860b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="719" y="88" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle">consumer group: payment-service</text>

  <g fill="#1e7a44">
    <circle r="6"><animate attributeName="cx" dur="2.4s" repeatCount="indefinite" values="94;345;719"/><animate attributeName="cy" dur="2.4s" repeatCount="indefinite" values="162;139;139"/></circle>
    <circle r="6"><animate attributeName="cx" dur="2.4s" begin="0.6s" repeatCount="indefinite" values="94;345;719"/><animate attributeName="cy" dur="2.4s" begin="0.6s" repeatCount="indefinite" values="178;217;217"/></circle>
    <circle r="6"><animate attributeName="cx" dur="2.4s" begin="1.2s" repeatCount="indefinite" values="94;345;719"/><animate attributeName="cy" dur="2.4s" begin="1.2s" repeatCount="indefinite" values="162;139;139"/></circle>
    <circle r="6"><animate attributeName="cx" dur="2.4s" begin="1.8s" repeatCount="indefinite" values="94;345;719"/><animate attributeName="cy" dur="2.4s" begin="1.8s" repeatCount="indefinite" values="178;217;217"/></circle>
  </g>

  <rect x="24" y="288" width="832" height="58" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="440" y="310" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">Now scale the picture up</text>
  <text x="440" y="332" font-size="11.5" fill="#1e7a44" text-anchor="middle">50 partitions and 50 instances &#8594; each instance reads a different partition. Ordering is kept inside each partition, and throughput multiplies.</text>

  <rect x="24" y="358" width="832" height="48" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="440" y="378" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Rule of thumb: instances beyond the partition count sit idle.</text>
  <text x="440" y="396" font-size="10.5" fill="#8a6d00" text-anchor="middle">3 partitions and 5 instances &#8594; 3 work, 2 do nothing. Partition count is the ceiling on parallelism within one group.</text>
</svg>
