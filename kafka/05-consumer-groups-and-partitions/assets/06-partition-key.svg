<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The partition key is hashed so the same key always lands on the same partition, keeping all events for one order in order">
  <defs>
    <marker id="p6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">6 · The partition key &#8212; same key, same partition, always</text>
  <text x="24" y="52" font-size="12.5" fill="#5b6b7f">The broker hashes the key (think Java <tspan font-family="Consolas, monospace">hashCode()</tspan>) and mods it by the partition count. Deterministic, so the routing never changes.</text>

  <!-- keys -->
  <rect x="24" y="82" width="150" height="52" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="99" y="104" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">key = account-A</text>
  <text x="99" y="122" font-size="9" fill="#2f5fa8" text-anchor="middle">deposit, withdraw, &#8230;</text>

  <rect x="24" y="150" width="150" height="52" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="99" y="172" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">key = account-B</text>
  <text x="99" y="190" font-size="9" fill="#2f5fa8" text-anchor="middle">a different user</text>

  <line x1="174" y1="108" x2="222" y2="130" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#p6)"/>
  <line x1="174" y1="176" x2="222" y2="152" stroke="#5b6b7f" stroke-width="1.6" marker-end="url(#p6)"/>

  <rect x="228" y="112" width="170" height="62" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="313" y="136" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">hash(key) % partitions</text>
  <text x="313" y="155" font-size="9.5" fill="#8a6d00" text-anchor="middle">the broker decides &#8212; not you</text>
  <text x="313" y="168" font-size="9" fill="#8a6d00" text-anchor="middle">same input &#8594; same output, forever</text>

  <path d="M398 128 L462 112" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#p6)"/>
  <path d="M398 158 L462 196" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#p6)"/>

  <rect x="468" y="82" width="388" height="66" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="662" y="106" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 0</text>
  <text x="662" y="126" font-size="10.5" fill="#1e7a44" text-anchor="middle">every account-A transaction lands here, in order</text>
  <text x="662" y="141" font-size="9" fill="#1e7a44" text-anchor="middle">deposit 100 (offset 0) &#8594; withdraw 50 (offset 1) &#8594; &#8230;</text>

  <rect x="468" y="166" width="388" height="66" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="662" y="190" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 1</text>
  <text x="662" y="210" font-size="10.5" fill="#1e7a44" text-anchor="middle">every account-B transaction lands here, in order</text>
  <text x="662" y="225" font-size="9" fill="#1e7a44" text-anchor="middle">two accounts, two partitions, two instances working in parallel</text>

  <g>
    <circle r="6" fill="#2f5fa8"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="99;313;600"/><animate attributeName="cy" dur="3s" repeatCount="indefinite" values="108;143;112"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/></circle>
    <circle r="6" fill="#2f5fa8"><animate attributeName="cx" dur="3s" begin="1.5s" repeatCount="indefinite" values="99;313;600"/><animate attributeName="cy" dur="3s" begin="1.5s" repeatCount="indefinite" values="176;143;196"/><animate attributeName="opacity" dur="3s" begin="1.5s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/></circle>
  </g>

  <line x1="24" y1="250" x2="856" y2="250" stroke="#c9d3e0" stroke-width="1.4"/>

  <!-- ecommerce row -->
  <text x="24" y="278" font-size="14" font-weight="700" fill="#1b2a3a">Same idea in the e-commerce system &#8212; key = <tspan font-family="Consolas, monospace">order-id</tspan></text>

  <g>
    <rect x="24" y="292" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
    <text x="114" y="311" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">order-1 : ORDER_BOOKED</text>
    <text x="114" y="328" font-size="9" fill="#2f5fa8" text-anchor="middle">t = 0</text>
    <rect x="24" y="346" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
    <text x="114" y="365" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">order-1 : ORDER_TIMEOUT</text>
    <text x="114" y="382" font-size="9" fill="#2f5fa8" text-anchor="middle">t = 1</text>
    <rect x="24" y="400" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
    <text x="114" y="419" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">order-1 : ORDER_CANCELLED</text>
    <text x="114" y="436" font-size="9" fill="#2f5fa8" text-anchor="middle">t = 2</text>
  </g>

  <path d="M204 315 L266 360" fill="none" stroke="#5b6b7f" stroke-width="1.5" marker-end="url(#p6)"/>
  <path d="M204 369 L266 369" fill="none" stroke="#5b6b7f" stroke-width="1.5" marker-end="url(#p6)"/>
  <path d="M204 423 L266 378" fill="none" stroke="#5b6b7f" stroke-width="1.5" marker-end="url(#p6)"/>
  <text x="235" y="404" font-size="9" fill="#5b6b7f" text-anchor="middle">same key</text>

  <rect x="272" y="330" width="280" height="80" rx="10" fill="#e6f4ea" stroke="#0f4d2a" stroke-width="2.4"/>
  <text x="412" y="354" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">one single partition</text>
  <text x="412" y="374" font-size="10" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">BOOKED &#8594; TIMEOUT &#8594; CANCELLED</text>
  <text x="412" y="392" font-size="9.5" fill="#1e7a44" text-anchor="middle">stored in exactly that order</text>

  <line x1="552" y1="370" x2="606" y2="370" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#p6)"/>

  <rect x="612" y="330" width="244" height="80" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="734" y="354" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">one consumer instance</text>
  <text x="734" y="374" font-size="10" fill="#2f5fa8" text-anchor="middle">reads them in the same order</text>
  <text x="734" y="392" font-size="9.5" fill="#2f5fa8" text-anchor="middle">never CANCELLED before BOOKED</text>

  <rect x="24" y="454" width="832" height="22" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="1.2"/>
  <text x="440" y="470" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Scaling comes from assigning one partition per instance. Ordering comes from the partition key. You need both.</text>
</svg>
