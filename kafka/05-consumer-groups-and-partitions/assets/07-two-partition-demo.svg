<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="CLI demo with a two partition topic: keyed records land on alternating consumers and the same key always returns to the same consumer">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="600" fill="#1b2a3a">7 · The demo &#8212; 2 partitions, keyed records</text>

  <!-- setup box -->
  <rect x="24" y="44" width="832" height="86" rx="10" fill="#1b2a3a"/>
  <g font-size="10" font-family="Consolas, monospace">
    <text x="40" y="66" fill="#f4b400">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic order-events --delete</text>
    <text x="40" y="84" fill="#a8d5ba">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic order-events --partitions 2 --create</text>
    <text x="40" y="102" fill="#a8d5ba">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic order-events --describe</text>
    <text x="40" y="120" fill="#dbe4ee">Topic: order-events&#160;&#160;&#160;PartitionCount: <tspan fill="#f4b400" font-weight="700">2</tspan>&#160;&#160;&#160;ReplicationFactor: 1</text>
  </g>

  <!-- producer -->
  <rect x="24" y="142" width="392" height="222" rx="11" fill="#1b2a3a"/>
  <text x="40" y="164" font-size="10.5" font-weight="700" fill="#f4b400" font-family="Consolas, monospace">PRODUCER &#8212; keys enabled</text>
  <g font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">
    <text x="40" y="182">$ kafka-console-producer.sh --topic order-events \</text>
    <text x="40" y="196">&#160;&#160;&#160;--bootstrap-server localhost:9092 \</text>
    <text x="40" y="210">&#160;&#160;&#160;--property parse.key=true \</text>
    <text x="40" y="224">&#160;&#160;&#160;--property key.separator=:</text>
    <text x="40" y="240" fill="#c96a6a">(no --group on a producer)</text>
  </g>
  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="266" opacity="0">&gt; order-1:booked<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.04;0.06;1"/></text>
    <text x="40" y="288" opacity="0">&gt; order-2:booked<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.16;0.18;1"/></text>
    <text x="40" y="310" opacity="0">&gt; order-3:booked<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.28;0.30;1"/></text>
    <text x="40" y="332" opacity="0" fill="#f4b400">&gt; order-1:updated<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.52;0.54;1"/></text>
    <text x="40" y="354" opacity="0" fill="#f4b400">&gt; order-2:updated<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.72;0.74;1"/></text>
  </g>

  <!-- consumer 1 -->
  <rect x="428" y="142" width="428" height="104" rx="11" fill="#1b2a3a"/>
  <text x="444" y="164" font-size="10.5" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">CONSUMER 1 &#8212; group payment-service</text>
  <text x="444" y="180" font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">assigned partition 1</text>
  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="444" y="204" opacity="0">booked&#160;&#160;&#160;(order-2)<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.18;0.20;1"/></text>
    <text x="444" y="226" opacity="0" fill="#f4b400">updated&#160;&#160;(order-2)&#160;&#160;&#8592; same key, same place<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.74;0.76;1"/></text>
  </g>

  <!-- consumer 2 -->
  <rect x="428" y="260" width="428" height="104" rx="11" fill="#1b2a3a"/>
  <text x="444" y="282" font-size="10.5" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">CONSUMER 2 &#8212; group payment-service</text>
  <text x="444" y="298" font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">assigned partition 0</text>
  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="444" y="322" opacity="0">booked&#160;&#160;&#160;(order-1)<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.06;0.08;1"/></text>
    <text x="444" y="344" opacity="0">booked&#160;&#160;&#160;(order-3)<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.30;0.32;1"/></text>
    <text x="670" y="322" opacity="0" font-size="9.5" fill="#f4b400">updated (order-1) lands here too<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.54;0.56;1"/></text>
  </g>

  <!-- routing dots -->
  <g>
    <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="16s" repeatCount="indefinite" values="230;230;600;600" keyTimes="0;0.05;0.075;1"/><animate attributeName="cy" dur="16s" repeatCount="indefinite" values="266;266;322;322" keyTimes="0;0.05;0.075;1"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.045;0.06;0.08;1"/></circle>
    <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="16s" repeatCount="indefinite" values="230;230;600;600" keyTimes="0;0.17;0.195;1"/><animate attributeName="cy" dur="16s" repeatCount="indefinite" values="288;288;204;204" keyTimes="0;0.17;0.195;1"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.165;0.18;0.20;1"/></circle>
    <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="16s" repeatCount="indefinite" values="230;230;600;600" keyTimes="0;0.29;0.315;1"/><animate attributeName="cy" dur="16s" repeatCount="indefinite" values="310;310;344;344" keyTimes="0;0.29;0.315;1"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.285;0.30;0.32;1"/></circle>
    <circle r="6" fill="#b8860b"><animate attributeName="cx" dur="16s" repeatCount="indefinite" values="230;230;600;600" keyTimes="0;0.53;0.555;1"/><animate attributeName="cy" dur="16s" repeatCount="indefinite" values="332;332;322;322" keyTimes="0;0.53;0.555;1"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.525;0.54;0.56;1"/></circle>
    <circle r="6" fill="#b8860b"><animate attributeName="cx" dur="16s" repeatCount="indefinite" values="230;230;600;600" keyTimes="0;0.73;0.755;1"/><animate attributeName="cy" dur="16s" repeatCount="indefinite" values="354;354;226;226" keyTimes="0;0.73;0.755;1"/><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.725;0.74;0.76;1"/></circle>
  </g>

  <rect x="24" y="378" width="832" height="80" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="440" y="400" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Both problems solved at once</text>
  <text x="440" y="422" font-size="11.5" fill="#1e7a44" text-anchor="middle"><tspan font-weight="700">Scaling</tspan> &#8212; different keys spread across partitions, and both instances are now busy.</text>
  <text x="440" y="444" font-size="11.5" fill="#1e7a44" text-anchor="middle"><tspan font-weight="700">Ordering</tspan> &#8212; republish with key <tspan font-family="Consolas, monospace">order-1</tspan> and it returns to the very same instance, every single time.</text>
</svg>
