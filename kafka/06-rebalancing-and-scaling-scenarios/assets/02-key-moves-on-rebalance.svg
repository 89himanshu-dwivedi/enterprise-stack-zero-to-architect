<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A key can land on a different consumer after a rebalance, but stays sticky once the assignment settles">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · A key can move during a rebalance &#8212; and is sticky again afterwards</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Same producer, same keys. Only the group membership changed in between.</text>

  <!-- table header -->
  <rect x="24" y="66" width="832" height="34" rx="8" fill="#1b2a3a"/>
  <g font-size="11" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">
    <text x="48" y="88">published</text>
    <text x="230" y="88">before rebalance</text>
    <text x="470" y="88">after 2nd consumer joins</text>
    <text x="700" y="88">after consumer 1 stops</text>
  </g>

  <g font-size="11.5" font-family="Consolas, monospace">
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.05;0.08;1"/>
      <rect x="24" y="106" width="832" height="34" rx="6" fill="#f4f7fb"/>
      <text x="48" y="128" fill="#1b2a3a" font-weight="700">1:order-1</text>
      <text x="230" y="128" fill="#2f5fa8">consumer 1</text>
      <text x="470" y="128" fill="#2f5fa8">consumer 1</text>
      <text x="700" y="128" fill="#a01818">consumer 2</text>
    </g>
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.14;0.17;1"/>
      <rect x="24" y="144" width="832" height="34" rx="6" fill="#ffffff"/>
      <text x="48" y="166" fill="#1b2a3a" font-weight="700">2:order-2</text>
      <text x="230" y="166" fill="#2f5fa8">consumer 1</text>
      <text x="470" y="166" fill="#a01818">consumer 2 &#8592; moved</text>
      <text x="700" y="166" fill="#a01818">consumer 2</text>
    </g>
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.23;0.26;1"/>
      <rect x="24" y="182" width="832" height="34" rx="6" fill="#f4f7fb"/>
      <text x="48" y="204" fill="#1b2a3a" font-weight="700">4:order-4</text>
      <text x="230" y="204" fill="#2f5fa8">consumer 1</text>
      <text x="470" y="204" fill="#2f5fa8">consumer 1</text>
      <text x="700" y="204" fill="#a01818">consumer 2</text>
    </g>
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.32;0.35;1"/>
      <rect x="24" y="220" width="832" height="34" rx="6" fill="#ffffff"/>
      <text x="48" y="242" fill="#1b2a3a" font-weight="700">5:order-5</text>
      <text x="230" y="242" fill="#8ea3bb">&#8212;</text>
      <text x="470" y="242" fill="#2f5fa8">consumer 2</text>
      <text x="700" y="242" fill="#a01818">consumer 2</text>
    </g>
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.41;0.44;1"/>
      <rect x="24" y="258" width="832" height="34" rx="6" fill="#f4f7fb"/>
      <text x="48" y="280" fill="#1b2a3a" font-weight="700">6:order-6</text>
      <text x="230" y="280" fill="#8ea3bb">&#8212;</text>
      <text x="470" y="280" fill="#2f5fa8">consumer 2 &#160;(always)</text>
      <text x="700" y="280" fill="#a01818">consumer 2</text>
    </g>
    <g><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.50;0.53;1"/>
      <rect x="24" y="296" width="832" height="34" rx="6" fill="#ffffff"/>
      <text x="48" y="318" fill="#1b2a3a" font-weight="700">7:order-7</text>
      <text x="230" y="318" fill="#8ea3bb">&#8212;</text>
      <text x="470" y="318" fill="#2f5fa8">consumer 1 &#160;(always)</text>
      <text x="700" y="318" fill="#a01818">consumer 2</text>
    </g>
  </g>

  <!-- rebalance banners -->
  <rect x="400" y="66" width="6" height="264" fill="#b8860b" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.28;0.31;1"/>
  </rect>
  <text x="403" y="346" font-size="9.5" font-weight="700" fill="#7a5b00" text-anchor="middle" opacity="0">
    REBALANCE
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.28;0.31;1"/>
  </text>
  <rect x="654" y="66" width="6" height="264" fill="#c62828" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.58;0.61;1"/>
  </rect>
  <text x="657" y="346" font-size="9.5" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    REBALANCE
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.58;0.61;1"/>
  </text>

  <rect x="24" y="360" width="410" height="80" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="229" y="382" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">During a rebalance, a key can switch consumer</text>
  <text x="229" y="402" font-size="10.5" fill="#8a6d00" text-anchor="middle">Key <tspan font-family="Consolas, monospace">2</tspan> went to consumer 1 before, and to consumer 2 after.</text>
  <text x="229" y="420" font-size="10.5" fill="#8a6d00" text-anchor="middle">The partition did not move &#8212; its <tspan font-style="italic">owner</tspan> did.</text>

  <rect x="446" y="360" width="410" height="80" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="651" y="382" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Once it settles, it is sticky again</text>
  <text x="651" y="402" font-size="10.5" fill="#1e7a44" text-anchor="middle">From then on key <tspan font-family="Consolas, monospace">7</tspan> always goes to consumer 1,</text>
  <text x="651" y="420" font-size="10.5" fill="#1e7a44" text-anchor="middle">key <tspan font-family="Consolas, monospace">6</tspan> always to consumer 2. Ordering per key is safe.</text>
</svg>
