<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Throughput stops growing once consumers exceed the partition count, and a partition can never be shared by two consumers">
  <defs>
    <marker id="q4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c62828"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">4 · The rule &#8212; max useful consumers = number of partitions</text>

  <!-- chart -->
  <rect x="20" y="46" width="424" height="290" rx="12" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="232" y="70" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">topic with 3 partitions &#8212; throughput vs consumers</text>

  <line x1="70" y1="290" x2="420" y2="290" stroke="#5b6b7f" stroke-width="1.6"/>
  <line x1="70" y1="90" x2="70" y2="290" stroke="#5b6b7f" stroke-width="1.6"/>
  <text x="46" y="96" font-size="9" fill="#5b6b7f">3x</text>
  <text x="46" y="290" font-size="9" fill="#5b6b7f">0</text>

  <rect x="90" y="230" width="46" height="60" rx="4" fill="#1e7a44"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;60;60" keyTimes="0;0.2;1"/><animate attributeName="y" dur="4s" repeatCount="indefinite" values="290;230;230" keyTimes="0;0.2;1"/></rect>
  <rect x="156" y="170" width="46" height="120" rx="4" fill="#1e7a44"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;120;120" keyTimes="0;0.35;1"/><animate attributeName="y" dur="4s" repeatCount="indefinite" values="290;170;170" keyTimes="0;0.35;1"/></rect>
  <rect x="222" y="110" width="46" height="180" rx="4" fill="#1e7a44"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;180;180" keyTimes="0;0.5;1"/><animate attributeName="y" dur="4s" repeatCount="indefinite" values="290;110;110" keyTimes="0;0.5;1"/></rect>
  <rect x="288" y="110" width="46" height="180" rx="4" fill="#c9d3e0"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;180;180" keyTimes="0;0.65;1"/><animate attributeName="y" dur="4s" repeatCount="indefinite" values="290;110;110" keyTimes="0;0.65;1"/></rect>
  <rect x="354" y="110" width="46" height="180" rx="4" fill="#c9d3e0"><animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;180;180" keyTimes="0;0.8;1"/><animate attributeName="y" dur="4s" repeatCount="indefinite" values="290;110;110" keyTimes="0;0.8;1"/></rect>

  <g font-size="10" fill="#5b6b7f" text-anchor="middle">
    <text x="113" y="306">1</text><text x="179" y="306">2</text><text x="245" y="306">3</text>
    <text x="311" y="306" fill="#a01818">4</text><text x="377" y="306" fill="#a01818">5</text>
    <text x="245" y="324">consumers in the group</text>
  </g>
  <line x1="278" y1="90" x2="278" y2="300" stroke="#c62828" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="345" y="98" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle">flat &#8212; pure waste</text>

  <!-- why not share -->
  <rect x="460" y="46" width="396" height="290" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="658" y="70" font-size="12" font-weight="700" fill="#a01818" text-anchor="middle">Why can&#8217;t two consumers share one partition?</text>

  <rect x="482" y="88" width="150" height="112" rx="9" fill="#fdf1f1" stroke="#c62828" stroke-width="1.6"/>
  <text x="557" y="110" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">partition 0</text>
  <rect x="494" y="120" width="126" height="30" rx="6" fill="#f8dede"/>
  <text x="557" y="140" font-size="10" fill="#a01818" text-anchor="middle">offset 0 &#183; deposit 100</text>
  <rect x="494" y="156" width="126" height="30" rx="6" fill="#f8dede"/>
  <text x="557" y="176" font-size="10" fill="#a01818" text-anchor="middle">offset 1 &#183; withdraw 50</text>

  <path d="M632 130 L692 112" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#q4)"/>
  <path d="M632 170 L692 190" fill="none" stroke="#c62828" stroke-width="1.6" marker-end="url(#q4)"/>

  <rect x="698" y="88" width="140" height="48" rx="8" fill="#f8dede" stroke="#c62828" stroke-width="1.5"/>
  <text x="768" y="108" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">consumer A</text>
  <text x="768" y="124" font-size="9" fill="#c0392b" text-anchor="middle">slow</text>
  <rect x="698" y="164" width="140" height="48" rx="8" fill="#f8dede" stroke="#c62828" stroke-width="1.5"/>
  <text x="768" y="184" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">consumer B</text>
  <text x="768" y="200" font-size="9" fill="#c0392b" text-anchor="middle">fast &#8594; withdraw first</text>

  <rect x="482" y="216" width="356" height="102" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="660" y="238" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">&#8594; withdraw processed before the deposit</text>
  <text x="660" y="258" font-size="10.5" fill="#a01818" text-anchor="middle">The DB still shows no money, so the withdrawal is rejected &#8212;</text>
  <text x="660" y="274" font-size="10.5" fill="#a01818" text-anchor="middle">even though the user deposited first. Stale, out-of-order data.</text>
  <text x="660" y="298" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">That is why Kafka never gives one partition to two consumers in a group.</text>

  <rect x="24" y="348" width="832" height="42" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="440" y="368" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">5 partitions &#8594; at most 5 useful consumers. Spin up a sixth and it just burns resources.</text>
  <text x="440" y="384" font-size="10.5" fill="#8a6d00" text-anchor="middle">The other direction is completely normal though &#8212; depending on load, 2, 3 or even 10 partitions can be assigned to a single consumer.</text>
</svg>
