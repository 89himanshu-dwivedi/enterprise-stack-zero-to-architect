<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="ORDER_CANCELLED on the new partition is consumed before ORDER_CREATED which is still queued on the old partition">
  <defs>
    <marker id="q6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · And here is the bug it causes &#8212; same order ID, two partitions</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Both records have key <tspan font-family="Consolas, monospace" font-weight="700">4</tspan>. They are no longer in the same log, so nothing keeps them in order.</text>

  <!-- old partition -->
  <rect x="24" y="72" width="330" height="112" rx="11" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.8"/>
  <text x="189" y="94" font-size="11.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">partition 2 &#8212; the OLD home of key 4</text>
  <rect x="44" y="104" width="290" height="34" rx="7" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="189" y="126" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle" font-family="Consolas, monospace">4 : ORDER_CREATED</text>
  <text x="189" y="156" font-size="10" fill="#a01818" text-anchor="middle">still queued &#8212; <tspan font-weight="700">not consumed yet</tspan></text>
  <text x="189" y="172" font-size="9" fill="#5b6b7f" text-anchor="middle">consumer 3 is behind, backlog, slow processing &#8230;</text>

  <!-- new partition -->
  <rect x="24" y="200" width="330" height="112" rx="11" fill="#fffdf5" stroke="#b8860b" stroke-width="1.8"/>
  <text x="189" y="222" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">partition 3 &#8212; the NEW home of key 4</text>
  <rect x="44" y="232" width="290" height="34" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="189" y="254" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">4 : ORDER_CANCELLED</text>
  <text x="189" y="284" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">consumer 4 is fresh and idle &#8594; picks it up immediately</text>
  <text x="189" y="300" font-size="9" fill="#8a6d00" text-anchor="middle">produced later, consumed first</text>

  <path d="M354 128 L410 128" fill="none" stroke="#5b6b7f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#q6)"/>
  <path d="M354 250 L410 250" fill="none" stroke="#b8860b" stroke-width="2" marker-end="url(#q6)"/>

  <!-- consumers -->
  <rect x="416" y="102" width="180" height="52" rx="9" fill="#f4f7fb" stroke="#8ea3bb" stroke-width="1.6"/>
  <text x="506" y="124" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="middle">consumer 3</text>
  <text x="506" y="141" font-size="9" fill="#8ea3bb" text-anchor="middle">will get there&#8230; eventually</text>

  <rect x="416" y="224" width="180" height="52" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="506" y="246" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">consumer 4</text>
  <text x="506" y="263" font-size="9" fill="#2f5fa8" text-anchor="middle">processes the cancel now</text>

  <path d="M596 250 L654 224" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#q6)"/>
  <path d="M596 128 L654 176" fill="none" stroke="#8ea3bb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#q6)"/>

  <!-- database -->
  <rect x="660" y="102" width="196" height="182" rx="11" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="758" y="126" font-size="11.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">orders table</text>
  <text x="758" y="158" font-size="10.5" fill="#5b6b7f" text-anchor="middle">&#8220;cancel order 4&#8221;</text>
  <text x="758" y="182" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">SELECT * WHERE id = 4</text>
  <text x="758" y="206" font-size="13" font-weight="700" fill="#a01818" text-anchor="middle">0 rows</text>
  <rect x="676" y="220" width="164" height="46" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8">
    <animate attributeName="stroke-width" dur="2.2s" repeatCount="indefinite" values="1.8;3.4;1.8"/>
  </rect>
  <text x="758" y="240" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">&#10007; order does not exist</text>
  <text x="758" y="256" font-size="9" fill="#a01818" text-anchor="middle">cancel fails / poison message</text>

  <!-- travelling record -->
  <circle r="7" fill="#b8860b">
    <animate attributeName="cx" dur="5s" repeatCount="indefinite" values="189;506;758" keyTimes="0;0.45;1"/>
    <animate attributeName="cy" dur="5s" repeatCount="indefinite" values="250;250;200" keyTimes="0;0.45;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/>
  </circle>
  <circle r="7" fill="#8ea3bb">
    <animate attributeName="cx" dur="5s" begin="3.4s" repeatCount="indefinite" values="189;506;758" keyTimes="0;0.45;1"/>
    <animate attributeName="cy" dur="5s" begin="3.4s" repeatCount="indefinite" values="128;128;180" keyTimes="0;0.45;1"/>
    <animate attributeName="opacity" dur="5s" begin="3.4s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/>
  </circle>

  <rect x="24" y="330" width="832" height="86" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="440" y="354" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">The cancel is processed before the create ever existed</text>
  <text x="440" y="376" font-size="11.5" fill="#a01818" text-anchor="middle">Exactly the out-of-order class of bug we spent the last part avoiding &#8212; only now it is caused by an innocent-looking <tspan font-family="Consolas, monospace">--alter --partitions</tspan>.</text>
  <text x="440" y="400" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Adding partitions is safe for <tspan text-decoration="underline">future</tspan> keys. It is not safe for keys that still have unprocessed records in flight.</text>
</svg>
