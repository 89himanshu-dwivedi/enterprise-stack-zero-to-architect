<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The pull loop: consumer polls, broker returns records, the offset is committed and advances">
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">1 · What actually happens when a consumer consumes</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">The broker never notifies anybody. Consumers <tspan font-weight="700">pull at a periodic interval</tspan>, and then the offset has to be committed.</text>

  <!-- consumer -->
  <rect x="30" y="176" width="200" height="96" rx="11" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="130" y="204" font-size="12.5" font-weight="700" fill="#12305e" text-anchor="middle">Consumer</text>
  <text x="130" y="226" font-size="10" fill="#2f5fa8" text-anchor="middle">group: test-cg</text>
  <text x="130" y="244" font-size="10" fill="#2f5fa8" text-anchor="middle">topic: test</text>
  <text x="130" y="262" font-size="9" fill="#2f5fa8" text-anchor="middle">polls on a loop, forever</text>

  <!-- broker -->
  <rect x="316" y="86" width="538" height="234" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="585" y="110" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka broker &#8212; topic <tspan font-family="Consolas, monospace">test</tspan>, partition 0</text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="340" y="172" width="54" height="56" rx="7"/>
    <rect x="402" y="172" width="54" height="56" rx="7"/>
    <rect x="464" y="172" width="54" height="56" rx="7"/>
    <rect x="526" y="172" width="54" height="56" rx="7"/>
    <rect x="588" y="172" width="54" height="56" rx="7"/>
    <rect x="650" y="172" width="54" height="56" rx="7"/>
    <rect x="712" y="172" width="54" height="56" rx="7"/>
    <rect x="774" y="172" width="54" height="56" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="367" y="205">0</text><text x="429" y="205">1</text><text x="491" y="205">2</text><text x="553" y="205">3</text>
    <text x="615" y="205">4</text><text x="677" y="205">5</text><text x="739" y="205">6</text><text x="801" y="205">7</text>
  </g>

  <!-- consumed shading -->
  <g fill="#0f4d2a" opacity="0.14">
    <rect x="340" y="172" width="54" height="56" rx="7"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.14;0.14;0" keyTimes="0;0.30;0.34;0.97;1"/></rect>
    <rect x="402" y="172" width="54" height="56" rx="7"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.14;0.14;0" keyTimes="0;0.31;0.35;0.97;1"/></rect>
    <rect x="464" y="172" width="54" height="56" rx="7"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.14;0.14;0" keyTimes="0;0.32;0.36;0.97;1"/></rect>
    <rect x="526" y="172" width="54" height="56" rx="7"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.14;0.14;0" keyTimes="0;0.33;0.37;0.97;1"/></rect>
  </g>

  <!-- offset pointer -->
  <g>
    <polygon points="-9,164 9,164 0,150" fill="#b8860b">
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="367 0;367 0;367 0;615 0;615 0;367 0" keyTimes="0;0.60;0.66;0.72;0.97;1"/>
    </polygon>
    <text y="142" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle">
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="367 0;367 0;367 0;615 0;615 0;367 0" keyTimes="0;0.60;0.66;0.72;0.97;1"/>
      committed offset
    </text>
  </g>

  <!-- arrows -->
  <path d="M130 176 L130 132 L580 132" fill="none" stroke="#2f5fa8" stroke-width="1.8" marker-end="url(#r1)"/>
  <text x="330" y="126" font-size="10" font-weight="600" fill="#2f5fa8">1 &#183; poll() &#8212; &#8220;give me up to 10 records&#8221; (group + topic)</text>
  <circle r="6" fill="#2f5fa8">
    <animateMotion dur="10s" repeatCount="indefinite" path="M130 176 L130 132 L580 132" keyPoints="0;0;1;1" keyTimes="0;0.04;0.18;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.03;0.06;0.17;0.20;1"/>
  </circle>

  <path d="M336 200 L236 216" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#r1)"/>
  <text x="250" y="176" font-size="10" font-weight="600" fill="#0f4d2a">2 &#183; 10 records</text>
  <circle r="6" fill="#1e7a44">
    <animateMotion dur="10s" repeatCount="indefinite" path="M336 200 L236 216" keyPoints="0;0;1;1" keyTimes="0;0.22;0.30;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.24;0.29;0.32;1"/>
  </circle>

  <path d="M130 272 L130 364 L585 364 L585 324" fill="none" stroke="#b8860b" stroke-width="1.8" marker-end="url(#r1)"/>
  <text x="300" y="380" font-size="10" font-weight="600" fill="#7a5b00">3 &#183; commit &#8212; &#8220;I am done up to here&#8221;</text>
  <circle r="6" fill="#b8860b">
    <animateMotion dur="10s" repeatCount="indefinite" path="M130 272 L130 364 L585 364 L585 324" keyPoints="0;0;1;1" keyTimes="0;0.46;0.62;1" calcMode="linear"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.61;0.64;1"/>
  </circle>

  <text x="130" y="300" font-size="10" fill="#5b6b7f" text-anchor="middle" opacity="0">
    processing&#8230;
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.35;0.45;0.48;1"/>
  </text>

  <rect x="24" y="392" width="832" height="30" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="440" y="412" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">The commit is what moves the offset. Until it happens, Kafka still believes those records are unread.</text>
</svg>
