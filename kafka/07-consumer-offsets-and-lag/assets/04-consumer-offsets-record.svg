<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Reading the __consumer_offsets topic with a formatter and decoding the record field by field">
  <defs>
    <marker id="r4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">4 · Reading <tspan font-family="Consolas, monospace">__consumer_offsets</tspan> for real</text>

  <!-- raw -->
  <rect x="24" y="44" width="410" height="104" rx="10" fill="#1b2a3a"/>
  <text x="40" y="64" font-size="9.5" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-console-consumer.sh --bootstrap-server localhost:9092 \</text>
  <text x="40" y="78" font-size="9.5" fill="#a8d5ba" font-family="Consolas, monospace">&#160;&#160;&#160;--topic __consumer_offsets --from-beginning</text>
  <text x="40" y="104" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">&#9618;&#9600;&#9612;&#9604;&#9617; &#65533;&#65533;&#65533; &#9618;&#9600;&#9612; &#65533;&#65533; &#9617;&#9604;&#9618;&#9600; &#65533;&#65533;&#65533;&#65533;</text>
  <text x="40" y="120" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">&#9604;&#9612;&#9617; &#65533;&#65533; &#9600;&#9618;&#9612;&#9604; &#65533;&#65533;&#65533; &#9617;&#9600;&#9618; &#65533;&#65533;</text>
  <text x="40" y="140" font-size="9.5" fill="#c96a6a" font-family="Consolas, monospace">unreadable &#8212; Kafka stores everything in binary</text>

  <path d="M436 96 L468 96" fill="none" stroke="#b8860b" stroke-width="2.4" marker-end="url(#r4)"/>
  <text x="452" y="86" font-size="9" font-weight="700" fill="#7a5b00" text-anchor="middle">add a formatter</text>

  <!-- formatted -->
  <rect x="472" y="44" width="384" height="104" rx="10" fill="#1b2a3a"/>
  <text x="488" y="64" font-size="9" fill="#f4b400" font-family="Consolas, monospace">$ kafka-console-consumer.sh ... \</text>
  <text x="488" y="78" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;--topic __consumer_offsets \</text>
  <text x="488" y="92" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;--formatter \</text>
  <text x="488" y="106" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;"org.apache.kafka.tools.consumer. \</text>
  <text x="488" y="120" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;&#160;OffsetsMessageFormatter"</text>
  <text x="488" y="140" font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">(older builds: GroupMetadataManager$OffsetsMessageFormatter)</text>

  <!-- decoded line -->
  <rect x="24" y="164" width="832" height="72" rx="10" fill="#22354a"/>
  <g font-size="11.5" font-family="Consolas, monospace">
    <text x="44" y="192" fill="#dbe4ee">[</text>
    <text x="56" y="192" fill="#a8d5ba">test-cg</text>
    <text x="128" y="192" fill="#dbe4ee">,</text>
    <text x="140" y="192" fill="#f4b400">test</text>
    <text x="188" y="192" fill="#dbe4ee">,</text>
    <text x="200" y="192" fill="#7fd1ff">0</text>
    <text x="212" y="192" fill="#dbe4ee">]::OffsetAndMetadata(</text>
    <text x="452" y="192" fill="#ffa8a8">offset=5</text>
    <text x="540" y="192" fill="#dbe4ee">, leaderEpoch=Optional[0],</text>
    <text x="44" y="216" fill="#dbe4ee">metadata=, </text>
    <text x="176" y="216" fill="#c8a8ff">commitTimestamp=1756612345678</text>
    <text x="516" y="216" fill="#dbe4ee">, expireTimestamp=None)</text>
  </g>

  <!-- highlights -->
  <g opacity="0.22">
    <rect x="52" y="178" width="78" height="20" rx="4" fill="#a8d5ba"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.35;0.35;0;0" keyTimes="0;0.02;0.05;0.19;0.22;1"/></rect>
    <rect x="136" y="178" width="54" height="20" rx="4" fill="#f4b400"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.35;0.35;0;0" keyTimes="0;0.22;0.25;0.39;0.42;1"/></rect>
    <rect x="194" y="178" width="22" height="20" rx="4" fill="#7fd1ff"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.35;0.35;0;0" keyTimes="0;0.42;0.45;0.59;0.62;1"/></rect>
    <rect x="448" y="178" width="90" height="20" rx="4" fill="#ffa8a8"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.35;0.35;0;0" keyTimes="0;0.62;0.65;0.79;0.82;1"/></rect>
    <rect x="172" y="202" width="342" height="20" rx="4" fill="#c8a8ff"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.35;0.35;0" keyTimes="0;0.82;0.85;0.97;1"/></rect>
  </g>

  <!-- explanation -->
  <rect x="24" y="252" width="832" height="96" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <g text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.20;0.22;1"/>
      <text x="440" y="282" font-size="14" font-weight="700" fill="#0f4d2a"><tspan font-family="Consolas, monospace">test-cg</tspan> &#8212; the consumer group</text>
      <text x="440" y="308" font-size="11.5" fill="#1e7a44">Exactly the <tspan font-family="Consolas, monospace">--group</tspan> you passed on the console consumer.</text>
      <text x="440" y="330" font-size="11.5" fill="#1e7a44">Part one of the key we designed ourselves.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.22;0.24;0.40;0.42;1"/>
      <text x="440" y="282" font-size="14" font-weight="700" fill="#0f4d2a"><tspan font-family="Consolas, monospace">test</tspan> &#8212; the topic</text>
      <text x="440" y="308" font-size="11.5" fill="#1e7a44">Part two of the key.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.42;0.44;0.60;0.62;1"/>
      <text x="440" y="282" font-size="14" font-weight="700" fill="#0f4d2a"><tspan font-family="Consolas, monospace">0</tspan> &#8212; the partition</text>
      <text x="440" y="308" font-size="11.5" fill="#1e7a44">Part three. group + topic + partition &#8212; the exact offsetKey from our design.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.62;0.64;0.80;0.82;1"/>
      <text x="440" y="282" font-size="14" font-weight="700" fill="#0f4d2a"><tspan font-family="Consolas, monospace">offset=5</tspan></text>
      <text x="440" y="308" font-size="11.5" fill="#1e7a44">The current index in that partition &#8212; how many records this group has already retrieved.</text>
      <text x="440" y="330" font-size="11.5" fill="#1e7a44">Serve from here onwards, and the consumer only ever sees new records.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.82;0.84;0.97;1"/>
      <text x="440" y="282" font-size="14" font-weight="700" fill="#0f4d2a"><tspan font-family="Consolas, monospace">commitTimestamp</tspan> and <tspan font-family="Consolas, monospace">leaderEpoch</tspan></text>
      <text x="440" y="308" font-size="11.5" fill="#1e7a44">The timestamp is simply when it was last committed.</text>
      <text x="440" y="330" font-size="11.5" fill="#1e7a44">The epoch is used around leader election and rebalancing &#8212; who owns this partition after a consumer joins or leaves.</text>
    </g>
  </g>

  <!-- mapping back -->
  <rect x="24" y="364" width="410" height="90" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="229" y="386" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">our design</text>
  <text x="229" y="410" font-size="11" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">key = (group, topic, partition)</text>
  <text x="229" y="434" font-size="11" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">value = (offset, timestamp)</text>

  <path d="M436 410 L468 410" fill="none" stroke="#1e7a44" stroke-width="2.4" marker-end="url(#r4)"/>
  <text x="452" y="400" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">=</text>

  <rect x="472" y="364" width="384" height="90" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="664" y="386" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">what Kafka actually stores</text>
  <text x="664" y="410" font-size="11" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">[test-cg, test, 0]</text>
  <text x="664" y="434" font-size="11" fill="#8a6d00" text-anchor="middle" font-family="Consolas, monospace">OffsetAndMetadata(offset=5, commitTimestamp=&#8230;)</text>
</svg>
