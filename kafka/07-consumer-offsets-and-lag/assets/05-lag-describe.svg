<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="kafka-consumer-groups describe showing current offset, log end offset and lag, and lag dropping to zero when the consumer restarts">
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">5 · Measuring it &#8212; <tspan font-family="Consolas, monospace">kafka-consumer-groups.sh --describe</tspan></text>

  <rect x="24" y="44" width="832" height="30" rx="7" fill="#1b2a3a"/>
  <text x="40" y="64" font-size="10.5" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group test-cg --describe</text>

  <!-- table -->
  <rect x="24" y="86" width="832" height="34" rx="7" fill="#22354a"/>
  <g font-size="10.5" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">
    <text x="44" y="108">GROUP</text>
    <text x="164" y="108">TOPIC</text>
    <text x="264" y="108">PARTITION</text>
    <text x="386" y="108">CURRENT-OFFSET</text>
    <text x="560" y="108">LOG-END-OFFSET</text>
    <text x="736" y="108">LAG</text>
  </g>

  <rect x="24" y="124" width="832" height="40" rx="7" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.4"/>
  <g font-size="12" font-family="Consolas, monospace" fill="#1b2a3a">
    <text x="44" y="150">test-cg</text>
    <text x="164" y="150">test</text>
    <text x="264" y="150">0</text>
  </g>
  <!-- lagging state -->
  <g font-size="13" font-weight="700" font-family="Consolas, monospace">
    <text x="386" y="150" fill="#2f5fa8" opacity="0">5<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.60;0.64;1"/></text>
    <text x="560" y="150" fill="#0f4d2a" opacity="0">10<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.60;0.64;1"/></text>
    <text x="736" y="150" fill="#a01818" opacity="0">5<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.60;0.64;1"/></text>
    <text x="386" y="150" fill="#2f5fa8" opacity="0">10<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.97;1"/></text>
    <text x="560" y="150" fill="#0f4d2a" opacity="0">10<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.97;1"/></text>
    <text x="736" y="150" fill="#0f4d2a" opacity="0">0<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.97;1"/></text>
  </g>

  <!-- explanation cards -->
  <rect x="24" y="184" width="266" height="96" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="157" y="208" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">CURRENT-OFFSET</text>
  <text x="157" y="232" font-size="10.5" fill="#2f5fa8" text-anchor="middle">How far this group has consumed.</text>
  <text x="157" y="250" font-size="10.5" fill="#2f5fa8" text-anchor="middle">The exact same number you just read</text>
  <text x="157" y="268" font-size="10.5" fill="#2f5fa8" text-anchor="middle">out of <tspan font-family="Consolas, monospace">__consumer_offsets</tspan>.</text>

  <rect x="306" y="184" width="266" height="96" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="439" y="208" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">LOG-END-OFFSET</text>
  <text x="439" y="232" font-size="10.5" fill="#1e7a44" text-anchor="middle">How many records the <tspan font-weight="700">producer</tspan></text>
  <text x="439" y="250" font-size="10.5" fill="#1e7a44" text-anchor="middle">has already written to this partition.</text>
  <text x="439" y="268" font-size="10.5" fill="#1e7a44" text-anchor="middle">Nothing to do with consumers.</text>

  <rect x="588" y="184" width="268" height="96" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="722" y="208" font-size="12" font-weight="700" fill="#a01818" text-anchor="middle">LAG = 10 &#8722; 5 = 5</text>
  <text x="722" y="232" font-size="10.5" fill="#a01818" text-anchor="middle">Records still <tspan font-weight="700">pending</tspan> for this group.</text>
  <text x="722" y="250" font-size="10.5" fill="#a01818" text-anchor="middle">This one number tells you whether</text>
  <text x="722" y="268" font-size="10.5" fill="#a01818" text-anchor="middle">your consumers are keeping up.</text>

  <!-- bar -->
  <text x="24" y="312" font-size="11.5" font-weight="700" fill="#1b2a3a">partition 0</text>
  <rect x="120" y="298" width="736" height="30" rx="7" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.4"/>
  <rect x="120" y="298" width="368" height="30" rx="7" fill="#2f5fa8" opacity="0.7">
    <animate attributeName="width" dur="12s" repeatCount="indefinite" values="368;368;736;736;368" keyTimes="0;0.62;0.72;0.97;1"/>
  </rect>
  <text x="304" y="318" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">consumed &#8212; offsets 0..4</text>
  <text x="672" y="318" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    LAG &#8212; offsets 5..9 waiting
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.62;0.68;0.97;1"/>
  </text>

  <!-- narrative -->
  <rect x="24" y="348" width="410" height="76" rx="10" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="229" y="370" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Consumer stopped, producer kept going</text>
  <text x="229" y="392" font-size="10.5" fill="#a01818" text-anchor="middle">Publish <tspan font-family="Consolas, monospace">hello, bye, test, class</tspan> with nobody</text>
  <text x="229" y="410" font-size="10.5" fill="#a01818" text-anchor="middle">consuming and the lag climbs with every record.</text>

  <rect x="446" y="348" width="410" height="76" rx="10" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="651" y="370" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Start the consumer again</text>
  <text x="651" y="392" font-size="10.5" fill="#1e7a44" text-anchor="middle">It picks up every pending message it missed,</text>
  <text x="651" y="410" font-size="10.5" fill="#1e7a44" text-anchor="middle">and the very next <tspan font-family="Consolas, monospace">--describe</tspan> shows <tspan font-weight="700">LAG = 0</tspan>.</text>
</svg>
