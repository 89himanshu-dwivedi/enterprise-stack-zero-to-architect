<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Lag grows when the production rate exceeds the consumption rate, and drains after scaling consumers or partitions">
  <defs>
    <marker id="r6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · Why lag is the number you actually watch in production</text>

  <!-- before -->
  <rect x="20" y="46" width="400" height="290" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="220" y="70" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">High lag &#8212; production rate &gt; consumption rate</text>

  <text x="44" y="98" font-size="10.5" font-weight="700" fill="#a01818">producer rate</text>
  <rect x="44" y="106" width="352" height="20" rx="6" fill="#f8dede"/>
  <rect x="44" y="106" width="320" height="20" rx="6" fill="#c62828"/>
  <text x="380" y="121" font-size="9.5" font-weight="700" fill="#a01818" text-anchor="end">high</text>

  <text x="44" y="152" font-size="10.5" font-weight="700" fill="#a01818">consumer rate</text>
  <rect x="44" y="160" width="352" height="20" rx="6" fill="#f8dede"/>
  <rect x="44" y="160" width="110" height="20" rx="6" fill="#c96a6a"/>
  <text x="380" y="175" font-size="9.5" font-weight="700" fill="#c96a6a" text-anchor="end">low &#8212; only 1 consumer</text>

  <text x="44" y="212" font-size="10.5" font-weight="700" fill="#a01818">resulting LAG</text>
  <rect x="44" y="220" width="352" height="34" rx="7" fill="#f8dede" stroke="#c62828" stroke-width="1.4"/>
  <rect x="44" y="220" width="20" height="34" rx="7" fill="#c62828">
    <animate attributeName="width" dur="5s" repeatCount="indefinite" values="20;352;352" keyTimes="0;0.85;1"/>
  </rect>
  <text x="220" y="242" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">climbing</text>

  <text x="220" y="284" font-size="10.5" fill="#a01818" text-anchor="middle">Your backend or your Kafka consumers cannot keep up.</text>
  <text x="220" y="302" font-size="10.5" fill="#a01818" text-anchor="middle">Messages pile up, freshness dies, SLAs break.</text>
  <text x="220" y="322" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">This is your signal to scale.</text>

  <path d="M424 190 L456 190" fill="none" stroke="#b8860b" stroke-width="3" marker-end="url(#r6)"/>

  <!-- after -->
  <rect x="460" y="46" width="400" height="290" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="660" y="70" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Scale consumers and/or partitions</text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="484" y="88" width="176" height="40" rx="8"/>
    <rect x="484" y="136" width="176" height="40" rx="8"/>
  </g>
  <text x="572" y="113" font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">add consumers</text>
  <text x="572" y="161" font-size="11" font-weight="600" fill="#0f4d2a" text-anchor="middle">add partitions</text>
  <text x="684" y="108" font-size="9.5" fill="#1e7a44">up to the partition count</text>
  <text x="684" y="124" font-size="9.5" fill="#1e7a44">(part 06 rule)</text>
  <text x="684" y="156" font-size="9.5" fill="#1e7a44">carefully &#8212; it remaps keys</text>
  <text x="684" y="172" font-size="9.5" fill="#1e7a44">(part 06 edge case)</text>

  <text x="484" y="212" font-size="10.5" font-weight="700" fill="#0f4d2a">LAG after scaling</text>
  <rect x="484" y="220" width="352" height="34" rx="7" fill="#dbeee2" stroke="#1e7a44" stroke-width="1.4"/>
  <rect x="484" y="220" width="352" height="34" rx="7" fill="#1e7a44">
    <animate attributeName="width" dur="5s" repeatCount="indefinite" values="352;12;12" keyTimes="0;0.7;1"/>
  </rect>
  <text x="660" y="242" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle" opacity="0">
    drained &#8212; LAG 0
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6;0.75;1"/>
  </text>

  <text x="660" y="284" font-size="10.5" fill="#0f4d2a" text-anchor="middle">The extra consumers pick up their own partitions and</text>
  <text x="660" y="302" font-size="10.5" fill="#0f4d2a" text-anchor="middle">process in parallel, so the backlog clears quickly.</text>
  <text x="660" y="322" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Same offsets, same ordering &#8212; just more hands.</text>

  <rect x="24" y="350" width="832" height="38" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="440" y="368" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Lag is the one metric that tells you how your Kafka setup is really behaving.</text>
  <text x="440" y="383" font-size="10.5" fill="#8a6d00" text-anchor="middle">Sustained lag &#8594; scale. Lag spiking then draining &#8594; a burst you absorbed. Lag at zero and consumers idle &#8594; you over-provisioned.</text>
</svg>
