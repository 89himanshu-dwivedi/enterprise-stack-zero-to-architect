<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Lag is tracked per consumer group, so three groups reading the same topic can have completely different lags">
  <defs>
    <marker id="r7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">7 · Lag is per consumer group &#8212; the groups are completely isolated</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">One <tspan font-family="Consolas, monospace">order-events</tspan> topic, three services reading it. Their lags have nothing to do with each other.</text>

  <!-- topic -->
  <rect x="24" y="120" width="200" height="200" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="124" y="144" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">order-events</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="44" y="158" width="160" height="44" rx="8"/>
    <rect x="44" y="212" width="160" height="44" rx="8"/>
    <rect x="44" y="266" width="160" height="44" rx="8"/>
  </g>
  <g font-size="10.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="124" y="185">partition 0</text><text x="124" y="239">partition 1</text><text x="124" y="293">partition 2</text>
  </g>

  <g stroke="#5b6b7f" stroke-width="1.5" fill="none" marker-end="url(#r7)">
    <path d="M224 180 L286 128"/>
    <path d="M224 220 L286 236"/>
    <path d="M224 288 L286 348"/>
  </g>

  <!-- group 1 -->
  <rect x="292" y="74" width="564" height="100" rx="11" fill="#fff8f8" stroke="#c62828" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="312" y="96" font-size="11.5" font-weight="700" fill="#a01818">group: product-service</text>
  <rect x="312" y="106" width="180" height="50" rx="8" fill="#f8dede" stroke="#c62828" stroke-width="1.5"/>
  <text x="402" y="128" font-size="10.5" font-weight="600" fill="#a01818" text-anchor="middle">consumer 1</text>
  <text x="402" y="145" font-size="9" fill="#c0392b" text-anchor="middle">alone, owns all 3 partitions</text>
  <rect x="700" y="102" width="140" height="58" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="770" y="126" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">LAG</text>
  <text x="770" y="150" font-size="20" font-weight="700" fill="#a01818" text-anchor="middle">10</text>
  <rect x="512" y="122" width="170" height="18" rx="6" fill="#f8dede"/>
  <rect x="512" y="122" width="20" height="18" rx="6" fill="#c62828"><animate attributeName="width" dur="4s" repeatCount="indefinite" values="20;170;170" keyTimes="0;0.85;1"/></rect>
  <text x="597" y="156" font-size="9" fill="#a01818" text-anchor="middle">backlog building up</text>

  <!-- group 2 -->
  <rect x="292" y="186" width="564" height="100" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="312" y="208" font-size="11.5" font-weight="700" fill="#0f4d2a">group: inventory-service</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="312" y="218" width="112" height="50" rx="8"/>
    <rect x="432" y="218" width="112" height="50" rx="8"/>
    <rect x="552" y="218" width="112" height="50" rx="8"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="368" y="240">consumer 1</text><text x="488" y="240">consumer 2</text><text x="608" y="240">consumer 3</text>
  </g>
  <g font-size="8.5" fill="#1e7a44" text-anchor="middle">
    <text x="368" y="256">partition 0</text><text x="488" y="256">partition 1</text><text x="608" y="256">partition 2</text>
  </g>
  <rect x="700" y="214" width="140" height="58" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
  <text x="770" y="238" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">LAG</text>
  <text x="770" y="262" font-size="20" font-weight="700" fill="#0f4d2a" text-anchor="middle">0</text>

  <!-- group 3 -->
  <rect x="292" y="298" width="564" height="100" rx="11" fill="#fffdf5" stroke="#b8860b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="312" y="320" font-size="11.5" font-weight="700" fill="#7a5b00">group: shipping-service</text>
  <g fill="#fff3cd" stroke="#b8860b" stroke-width="1.5">
    <rect x="312" y="330" width="172" height="50" rx="8"/>
    <rect x="492" y="330" width="172" height="50" rx="8"/>
  </g>
  <g font-size="10" font-weight="600" fill="#7a5b00" text-anchor="middle">
    <text x="398" y="352">consumer 1</text><text x="578" y="352">consumer 2</text>
  </g>
  <g font-size="8.5" fill="#8a6d00" text-anchor="middle">
    <text x="398" y="368">partitions 0 + 1</text><text x="578" y="368">partition 2</text>
  </g>
  <rect x="700" y="326" width="140" height="58" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="770" y="350" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">LAG</text>
  <text x="770" y="374" font-size="20" font-weight="700" fill="#7a5b00" text-anchor="middle">2</text>

  <rect x="24" y="410" width="832" height="32" rx="8" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="440" y="431" font-size="11.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">Kafka maintains the lag <tspan text-decoration="underline">per consumer group</tspan>. One group being far behind says nothing about the others &#8212; they run completely independently.</text>
</svg>
