<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="JMH benchmark results: traditional IO 27 operations per second versus zero-copy 256 operations per second">
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">5 · The benchmark &#8212; JMH, 10 MB file, copied every iteration</text>

  <!-- setup -->
  <rect x="24" y="46" width="300" height="150" rx="10" fill="#1b2a3a"/>
  <text x="40" y="68" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">setup</text>
  <g font-size="10" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="40" y="90">@BenchmarkMode(Throughput)</text>
    <text x="40" y="108">@OutputTimeUnit(SECONDS)</text>
    <text x="40" y="126">@Warmup(iterations = 5)</text>
    <text x="40" y="144">@Measurement(iterations = 5)</text>
    <text x="40" y="162">@Threads(5)</text>
  </g>
  <text x="40" y="184" font-size="9.5" fill="#f4b400" font-family="Consolas, monospace">createInputFile() &#8594; 10 MB, fresh each run</text>

  <rect x="336" y="46" width="520" height="72" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
  <text x="352" y="66" font-size="10.5" font-weight="700" fill="#a01818">traditional I/O</text>
  <text x="352" y="86" font-size="9.5" fill="#a01818" font-family="Consolas, monospace">while (src.read(buffer) &gt; 0) { buffer.flip(); dst.write(buffer); buffer.clear(); }</text>
  <text x="352" y="104" font-size="9" fill="#c0392b">read into a heap buffer &#183; write it back out &#183; clear &#183; repeat</text>

  <rect x="336" y="126" width="520" height="70" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="352" y="146" font-size="10.5" font-weight="700" fill="#0f4d2a">zero-copy I/O</text>
  <text x="352" y="166" font-size="9.5" fill="#0f4d2a" font-family="Consolas, monospace">dst.transferFrom(src, 0, src.size());</text>
  <text x="352" y="184" font-size="9" fill="#1e7a44">source channel straight to destination channel &#183; nothing enters the heap</text>

  <!-- chart -->
  <line x1="120" y1="360" x2="840" y2="360" stroke="#5b6b7f" stroke-width="1.6"/>

  <rect x="200" y="340" width="150" height="20" rx="5" fill="#c62828">
    <animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;20;20" keyTimes="0;0.35;1"/>
    <animate attributeName="y" dur="4s" repeatCount="indefinite" values="360;340;340" keyTimes="0;0.35;1"/>
  </rect>
  <text x="275" y="330" font-size="13" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    27 ops/sec
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.35;0.42;1"/>
  </text>
  <text x="275" y="382" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">traditional I/O</text>

  <rect x="560" y="230" width="150" height="130" rx="5" fill="#1e7a44">
    <animate attributeName="height" dur="4s" repeatCount="indefinite" values="0;130;130" keyTimes="0;0.75;1"/>
    <animate attributeName="y" dur="4s" repeatCount="indefinite" values="360;230;230" keyTimes="0;0.75;1"/>
  </rect>
  <text x="635" y="220" font-size="15" font-weight="700" fill="#0f4d2a" text-anchor="middle" opacity="0">
    256 ops/sec
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.75;0.82;1"/>
  </text>
  <text x="635" y="382" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">zero-copy I/O</text>

  <rect x="740" y="248" width="116" height="52" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8;0.88;1"/>
  </rect>
  <text x="798" y="270" font-size="15" font-weight="700" fill="#7a5b00" text-anchor="middle" opacity="0">
    ~9.5&#215;
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8;0.88;1"/>
  </text>
  <text x="798" y="288" font-size="9" fill="#8a6d00" text-anchor="middle" opacity="0">
    on a laptop
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8;0.88;1"/>
  </text>

  <text x="132" y="266" font-size="10" fill="#5b6b7f">ops/sec</text>

  <rect x="24" y="392" width="832" height="22" rx="6" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.3"/>
  <text x="440" y="408" font-size="10.5" font-weight="600" fill="#1b2a3a" text-anchor="middle">Measured on a local machine with 5 threads. On a real cluster under real request volume, the gap is wider still.</text>
</svg>
