<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Four more design decisions: partitioning, pull based consumers, binary protocol and leader follower replication">
  <defs>
    <marker id="s7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">7 · Decisions four to seven</text>

  <!-- 4 partitioning -->
  <rect x="20" y="44" width="416" height="200" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="40" y="68" font-size="12.5" font-weight="700" fill="#0f4d2a">4 &#183; Partitioning</text>
  <text x="40" y="86" font-size="10" fill="#1e7a44">a topic is split into partitions, and each one can sit on a separate broker</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="44" y="98" width="130" height="38" rx="7"/>
    <rect x="44" y="144" width="130" height="38" rx="7"/>
    <rect x="44" y="190" width="130" height="38" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="109" y="122">partition 0</text><text x="109" y="168">partition 1</text><text x="109" y="214">partition 2</text>
  </g>
  <g fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5">
    <rect x="262" y="98" width="150" height="38" rx="7"/>
    <rect x="262" y="144" width="150" height="38" rx="7"/>
    <rect x="262" y="190" width="150" height="38" rx="7"/>
  </g>
  <g font-size="10" font-weight="600" fill="#12305e" text-anchor="middle">
    <text x="337" y="122">broker / instance 1</text><text x="337" y="168">broker / instance 2</text><text x="337" y="214">broker / instance 3</text>
  </g>
  <g stroke="#1e7a44" stroke-width="1.6" fill="none" marker-end="url(#s7)">
    <path d="M174 117 L256 117"/><path d="M174 163 L256 163"/><path d="M174 209 L256 209"/>
  </g>
  <g fill="#1e7a44">
    <circle r="5"><animate attributeName="cx" dur="2s" repeatCount="indefinite" values="174;256"/><animate attributeName="cy" dur="2s" repeatCount="indefinite" values="117;117"/></circle>
    <circle r="5"><animate attributeName="cx" dur="2s" begin="0.3s" repeatCount="indefinite" values="174;256"/><animate attributeName="cy" dur="2s" begin="0.3s" repeatCount="indefinite" values="163;163"/></circle>
    <circle r="5"><animate attributeName="cx" dur="2s" begin="0.6s" repeatCount="indefinite" values="174;256"/><animate attributeName="cy" dur="2s" begin="0.6s" repeatCount="indefinite" values="209;209"/></circle>
  </g>
  <text x="228" y="238" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">100 or 200 partitions &#8594; 50 instances running in parallel. Real parallel processing across nodes.</text>

  <!-- 5 pull -->
  <rect x="452" y="44" width="404" height="200" rx="12" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="472" y="68" font-size="12.5" font-weight="700" fill="#12305e">5 &#183; Pull-based consumers</text>
  <text x="472" y="86" font-size="10" fill="#5b6b7f">consumers fetch at their own optimal pace instead of being pushed to</text>

  <rect x="472" y="98" width="150" height="52" rx="8" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
  <text x="547" y="118" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">if the broker pushed</text>
  <text x="547" y="136" font-size="9" fill="#c0392b" text-anchor="middle">500 consumers = 500 network calls</text>
  <text x="547" y="148" font-size="9" fill="#c0392b" text-anchor="middle">for every single message</text>

  <rect x="646" y="98" width="190" height="52" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
  <text x="741" y="118" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka pulls instead</text>
  <text x="741" y="136" font-size="9" fill="#1e7a44" text-anchor="middle">consumers ask when they are ready</text>
  <text x="741" y="148" font-size="9" fill="#1e7a44" text-anchor="middle">over a persistent connection</text>

  <g fill="#c62828">
    <circle cy="176" r="5"><animate attributeName="cx" dur="1s" repeatCount="indefinite" values="480;614"/></circle>
    <circle cy="176" r="5"><animate attributeName="cx" dur="1s" begin="0.2s" repeatCount="indefinite" values="480;614"/></circle>
    <circle cy="176" r="5"><animate attributeName="cx" dur="1s" begin="0.4s" repeatCount="indefinite" values="480;614"/></circle>
    <circle cy="176" r="5"><animate attributeName="cx" dur="1s" begin="0.6s" repeatCount="indefinite" values="480;614"/></circle>
  </g>
  <text x="547" y="196" font-size="9" fill="#a01818" text-anchor="middle">consumers get flooded, throughput drops</text>
  <circle cy="176" r="6" fill="#1e7a44"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="820;660;820" keyTimes="0;0.4;1"/></circle>
  <text x="741" y="196" font-size="9" fill="#0f4d2a" text-anchor="middle">no overwhelming, throughput optimised</text>
  <text x="654" y="228" font-size="9.5" font-weight="700" fill="#0f4d2a">Already proved in parts 01 and 04 &#8212; this is the same decision, seen from the performance angle.</text>

  <!-- 6 binary -->
  <rect x="20" y="256" width="416" height="196" rx="12" fill="#fffdf5" stroke="#b8860b" stroke-width="1.6"/>
  <text x="40" y="280" font-size="12.5" font-weight="700" fill="#7a5b00">6 &#183; Binary protocol</text>
  <text x="40" y="298" font-size="10" fill="#8a6d00">everything is transmitted and stored as bytes &#8212; computers do not understand text</text>

  <rect x="44" y="310" width="112" height="56" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="100" y="332" font-size="10" font-weight="700" fill="#12305e" text-anchor="middle">producer</text>
  <text x="100" y="350" font-size="8.5" fill="#2f5fa8" text-anchor="middle">serializer runs HERE</text>

  <rect x="180" y="310" width="112" height="56" rx="8" fill="#1b2a3a"/>
  <text x="236" y="332" font-size="10" font-weight="700" fill="#f4b400" text-anchor="middle">broker</text>
  <text x="236" y="350" font-size="8.5" fill="#8ea3bb" text-anchor="middle">just moves bytes</text>

  <rect x="316" y="310" width="112" height="56" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="372" y="332" font-size="10" font-weight="700" fill="#12305e" text-anchor="middle">consumer</text>
  <text x="372" y="350" font-size="8.5" fill="#2f5fa8" text-anchor="middle">deserializer runs HERE</text>

  <g stroke="#b8860b" stroke-width="1.6" fill="none" marker-end="url(#s7)">
    <path d="M156 338 L174 338"/><path d="M292 338 L310 338"/>
  </g>
  <circle cy="338" r="5" fill="#b8860b"><animate attributeName="cx" dur="2.4s" repeatCount="indefinite" values="100;236;372"/><animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/></circle>

  <text x="228" y="392" font-size="10" fill="#8a6d00" text-anchor="middle">If the broker had to serialise and deserialise, its throughput would collapse.</text>
  <text x="228" y="410" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle">So that cost is deliberately offloaded to the clients.</text>
  <text x="228" y="434" font-size="9.5" fill="#8a6d00" text-anchor="middle">Same reason the log file looked like garbage back in part 04.</text>

  <!-- 7 replication -->
  <rect x="452" y="256" width="404" height="196" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
  <text x="472" y="280" font-size="12.5" font-weight="700" fill="#0f4d2a">7 &#183; Replication with a leader / follower model</text>
  <text x="472" y="298" font-size="10" fill="#1e7a44">redundancy without paying for it on the write path</text>

  <rect x="472" y="312" width="150" height="52" rx="8" fill="#e6f4ea" stroke="#0f4d2a" stroke-width="2.4"/>
  <text x="547" y="332" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">LEADER partition</text>
  <text x="547" y="350" font-size="9" fill="#1e7a44" text-anchor="middle">handles every write</text>

  <rect x="676" y="298" width="160" height="42" rx="8" fill="#eef4fd" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="756" y="316" font-size="10" font-weight="700" fill="#12305e" text-anchor="middle">follower</text>
  <text x="756" y="331" font-size="8.5" fill="#2f5fa8" text-anchor="middle">fetches asynchronously</text>
  <rect x="676" y="348" width="160" height="42" rx="8" fill="#eef4fd" stroke="#2f5fa8" stroke-width="1.5"/>
  <text x="756" y="366" font-size="10" font-weight="700" fill="#12305e" text-anchor="middle">follower</text>
  <text x="756" y="381" font-size="8.5" fill="#2f5fa8" text-anchor="middle">fetches asynchronously</text>

  <g stroke="#2f5fa8" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#s7)">
    <path d="M622 330 L670 320"/><path d="M622 348 L670 362"/>
  </g>
  <g fill="#2f5fa8">
    <circle r="5"><animateMotion dur="2.6s" repeatCount="indefinite" path="M622 330 L670 320"/><animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/></circle>
    <circle r="5"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M622 348 L670 362"/><animate attributeName="opacity" dur="2.6s" begin="1.3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.8;1"/></circle>
  </g>
  <text x="654" y="416" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">The write never waits on the followers.</text>
  <text x="654" y="434" font-size="10" fill="#1e7a44" text-anchor="middle">Data lives on multiple brokers, and write performance is untouched.</text>

  <rect x="24" y="460" width="832" height="0" fill="none"/>
</svg>
