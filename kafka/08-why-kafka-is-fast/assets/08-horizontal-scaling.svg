<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Kafka scales horizontally across brokers, partitions and consumers with no centralized bottleneck">
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">8 · Put together &#8212; horizontal scaling across every layer</text>

  <!-- three axes -->
  <rect x="24" y="50" width="268" height="180" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="158" y="74" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">more brokers</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="48" y="88" width="52" height="44" rx="7"/>
    <rect x="108" y="88" width="52" height="44" rx="7"/>
    <rect x="168" y="88" width="52" height="44" rx="7"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3;0.4;1"/></rect>
    <rect x="228" y="88" width="52" height="44" rx="7"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5;0.6;1"/></rect>
  </g>
  <text x="158" y="156" font-size="10" fill="#1e7a44" text-anchor="middle">spread storage and network load</text>
  <text x="158" y="176" font-size="10" fill="#1e7a44" text-anchor="middle">across more machines</text>
  <text x="158" y="204" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">capacity + fault tolerance</text>

  <rect x="306" y="50" width="268" height="180" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="440" y="74" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">more partitions</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="330" y="88" width="220" height="20" rx="5"/>
    <rect x="330" y="112" width="220" height="20" rx="5"/>
    <rect x="330" y="136" width="220" height="20" rx="5"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.35;0.45;1"/></rect>
  </g>
  <text x="440" y="176" font-size="10" fill="#1e7a44" text-anchor="middle">raise the ceiling on parallelism</text>
  <text x="440" y="204" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">but carefully &#8212; see part 06</text>

  <rect x="588" y="50" width="268" height="180" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="722" y="74" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">more consumers</text>
  <g fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5">
    <rect x="612" y="88" width="104" height="30" rx="6"/>
    <rect x="728" y="88" width="104" height="30" rx="6"/>
    <rect x="612" y="126" width="104" height="30" rx="6"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4;0.5;1"/></rect>
    <rect x="728" y="126" width="104" height="30" rx="6"><animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6;0.7;1"/></rect>
  </g>
  <text x="722" y="176" font-size="10" fill="#1e7a44" text-anchor="middle">producers outrunning consumers?</text>
  <text x="722" y="192" font-size="10" fill="#1e7a44" text-anchor="middle">add consumers, drain the lag</text>
  <text x="722" y="214" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">up to the partition count</text>

  <!-- no bottleneck -->
  <rect x="24" y="248" width="416" height="66" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="232" y="272" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">No centralised bottleneck</text>
  <text x="232" y="294" font-size="11" fill="#1e7a44" text-anchor="middle">The workload is distributed across nodes. There is no single</text>
  <text x="232" y="308" font-size="11" fill="#1e7a44" text-anchor="middle">component every message has to squeeze through.</text>

  <rect x="452" y="248" width="404" height="66" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="654" y="272" font-size="12.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Millions of messages per second, at low latency</text>
  <text x="654" y="294" font-size="11" fill="#8a6d00" text-anchor="middle">Not one clever trick &#8212; seven ordinary decisions,</text>
  <text x="654" y="308" font-size="11" fill="#8a6d00" text-anchor="middle">each one refusing to do unnecessary work.</text>

  <rect x="24" y="330" width="832" height="56" rx="10" fill="#1b2a3a"/>
  <text x="440" y="354" font-size="12.5" font-weight="700" fill="#f4b400" text-anchor="middle">And the next time somebody tells you Java is slow &#8212;</text>
  <text x="440" y="376" font-size="12" fill="#a8d5ba" text-anchor="middle">Kafka is written in Java. Every language has its pros and cons, but that is a rather good counter-example.</text>
</svg>
