<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Consumer lag recap: lag is log end offset minus current offset, summed across partitions">
  <defs>
    <marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">1 · Refresher &#8212; consumer lag, per partition</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Producers keep publishing whether or not your consumer is alive. That gap is the lag, and it is tracked <tspan font-weight="700">per partition, per group</tspan>.</text>

  <rect x="24" y="72" width="150" height="60" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="99" y="96" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">Order Service</text>
  <text x="99" y="114" font-size="9" fill="#2f5fa8" text-anchor="middle">keeps producing</text>
  <path d="M174 102 L212 102" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#t1)"/>

  <!-- topic -->
  <rect x="218" y="66" width="410" height="176" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="423" y="88" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic: order-events &#8212; 2 partitions</text>

  <text x="238" y="112" font-size="10" font-weight="700" fill="#0f4d2a">partition 1</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="238" y="118" width="52" height="40" rx="6"/>
    <rect x="296" y="118" width="52" height="40" rx="6"/>
    <rect x="354" y="118" width="52" height="40" rx="6"/>
    <rect x="412" y="118" width="52" height="40" rx="6"/>
  </g>
  <g fill="#fff3cd" stroke="#b8860b" stroke-width="1.6">
    <rect x="470" y="118" width="52" height="40" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.42;0.46;1"/></rect>
    <rect x="528" y="118" width="52" height="40" rx="6"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.50;0.54;1"/></rect>
  </g>
  <g font-size="9.5" font-weight="600" text-anchor="middle">
    <text x="264" y="143" fill="#0f4d2a">0</text><text x="322" y="143" fill="#0f4d2a">1</text>
    <text x="380" y="143" fill="#0f4d2a">2</text><text x="438" y="143" fill="#0f4d2a">3</text>
    <text x="496" y="143" fill="#7a5b00">4</text><text x="554" y="143" fill="#7a5b00">5</text>
  </g>

  <text x="238" y="184" font-size="10" font-weight="700" fill="#0f4d2a">partition 0</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="238" y="190" width="52" height="40" rx="6"/>
    <rect x="296" y="190" width="52" height="40" rx="6"/>
    <rect x="354" y="190" width="52" height="40" rx="6"/>
  </g>
  <rect x="412" y="190" width="52" height="40" rx="6" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.58;0.62;1"/>
  </rect>
  <g font-size="9.5" font-weight="600" text-anchor="middle">
    <text x="264" y="215" fill="#0f4d2a">0</text><text x="322" y="215" fill="#0f4d2a">1</text>
    <text x="380" y="215" fill="#0f4d2a">2</text>
    <text x="438" y="215" fill="#7a5b00">3</text>
  </g>

  <path d="M628 154 L666 154" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#t1)"/>

  <!-- consumer group -->
  <rect x="672" y="66" width="184" height="176" rx="12" fill="#fffdf5" stroke="#b8860b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="764" y="88" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">group: payment-service</text>
  <g>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0.25;0.25;1" keyTimes="0;0.36;0.42;0.96;1"/>
    <rect x="690" y="102" width="148" height="52" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5"/>
    <text x="764" y="124" font-size="10.5" font-weight="600" fill="#12305e" text-anchor="middle">consumer 1</text>
    <text x="764" y="140" font-size="8.5" fill="#2f5fa8" text-anchor="middle">partition 1</text>
    <rect x="690" y="164" width="148" height="52" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.5"/>
    <text x="764" y="186" font-size="10.5" font-weight="600" fill="#12305e" text-anchor="middle">consumer 2</text>
    <text x="764" y="202" font-size="8.5" fill="#2f5fa8" text-anchor="middle">partition 0</text>
  </g>
  <text x="764" y="232" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    consumers are DOWN
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.38;0.44;0.96;1"/>
  </text>

  <!-- describe table -->
  <rect x="24" y="262" width="832" height="30" rx="7" fill="#1b2a3a"/>
  <text x="40" y="282" font-size="10" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group payment-service --describe</text>

  <rect x="24" y="300" width="832" height="30" rx="6" fill="#22354a"/>
  <g font-size="10" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">
    <text x="44" y="320">TOPIC</text><text x="200" y="320">PARTITION</text><text x="330" y="320">CURRENT-OFFSET</text>
    <text x="500" y="320">LOG-END-OFFSET</text><text x="676" y="320">LAG</text>
  </g>
  <g font-size="11.5" font-family="Consolas, monospace" fill="#1b2a3a">
    <rect x="24" y="334" width="832" height="30" rx="6" fill="#f4f7fb"/>
    <text x="44" y="354">order-events</text><text x="200" y="354">1</text><text x="330" y="354">4</text>
    <text x="500" y="354" fill="#0f4d2a">4<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.44;0.48;1"/></text>
    <text x="500" y="354" fill="#7a5b00" opacity="0">6<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.54;0.97;1"/></text>
    <text x="676" y="354" fill="#0f4d2a">0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.44;0.48;1"/></text>
    <text x="676" y="354" font-weight="700" fill="#a01818" opacity="0">2<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.46;0.56;0.97;1"/></text>

    <rect x="24" y="368" width="832" height="30" rx="6" fill="#ffffff"/>
    <text x="44" y="388">order-events</text><text x="200" y="388">0</text><text x="330" y="388">3</text>
    <text x="500" y="388" fill="#0f4d2a">3<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.60;0.64;1"/></text>
    <text x="500" y="388" fill="#7a5b00" opacity="0">4<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.66;0.97;1"/></text>
    <text x="676" y="388" fill="#0f4d2a">0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.60;0.64;1"/></text>
    <text x="676" y="388" font-weight="700" fill="#a01818" opacity="0">1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.62;0.68;0.97;1"/></text>
  </g>

  <rect x="24" y="410" width="410" height="48" rx="9" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="229" y="430" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle" font-family="Consolas, monospace">LAG = LOG-END-OFFSET &#8722; CURRENT-OFFSET</text>
  <text x="229" y="448" font-size="10" fill="#5b6b7f" text-anchor="middle">7 records already retrieved &#8212; 4 from partition 1, 3 from partition 0</text>

  <rect x="446" y="410" width="410" height="48" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="651" y="430" font-size="12" font-weight="700" fill="#a01818" text-anchor="middle">Total pending = sum of every partition&#8217;s lag</text>
  <text x="651" y="448" font-size="10.5" fill="#a01818" text-anchor="middle">2 + 1 = <tspan font-weight="700">3 messages</tspan> published while the consumer was down</text>
</svg>
