<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="from-beginning does nothing with an existing group but replays everything without one, because Kafka silently creates a group for you">
  <rect width="880" height="460" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · The <tspan font-family="Consolas, monospace">--from-beginning</tspan> gotcha</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Same flag, same topic, completely different result &#8212; and the reason explains something important about how Kafka works.</text>

  <!-- with group -->
  <rect x="24" y="66" width="410" height="176" rx="11" fill="#1b2a3a"/>
  <text x="40" y="88" font-size="10.5" font-weight="700" fill="#c96a6a" font-family="Consolas, monospace">WITH a group</text>
  <text x="40" y="110" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-console-consumer.sh ... --topic order-events \</text>
  <text x="40" y="124" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">&#160;&#160;&#160;--group payment-service --from-beginning</text>
  <text x="40" y="164" font-size="13" font-weight="700" fill="#c96a6a" font-family="Consolas, monospace" opacity="0">
    (nothing. not a single message.)
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.12;0.16;1"/>
  </text>
  <text x="40" y="200" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">the group already has a committed offset,</text>
  <text x="40" y="216" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">so &#8220;beginning&#8221; is ignored &#8212; it resumes where it stopped</text>

  <!-- without group -->
  <rect x="446" y="66" width="410" height="176" rx="11" fill="#1b2a3a"/>
  <text x="462" y="88" font-size="10.5" font-weight="700" fill="#a8d5ba" font-family="Consolas, monospace">WITHOUT a group</text>
  <text x="462" y="110" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">$ kafka-console-consumer.sh ... --topic order-events \</text>
  <text x="462" y="124" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">&#160;&#160;&#160;--from-beginning</text>
  <g font-size="11" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="462" y="152" opacity="0">order-1<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.24;0.27;1"/></text>
    <text x="462" y="170" opacity="0">order-2<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.27;0.30;1"/></text>
    <text x="462" y="188" opacity="0">order-3<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.30;0.33;1"/></text>
    <text x="462" y="206" opacity="0">order-4&#160;&#160;&#8230;&#160;everything, from offset 0<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.33;0.36;1"/></text>
    <text x="620" y="152" font-size="9" fill="#f4b400" opacity="0">&#8592; why?<animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.36;0.40;1"/></text>
  </g>

  <!-- explanation -->
  <rect x="24" y="258" width="832" height="30" rx="7" fill="#22354a"/>
  <text x="40" y="278" font-size="10" fill="#f4b400" font-family="Consolas, monospace">$ kafka-consumer-groups.sh --bootstrap-server localhost:9092 --list</text>

  <rect x="24" y="294" width="410" height="60" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="229" y="316" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle" font-family="Consolas, monospace">payment-service</text>
  <text x="229" y="336" font-size="10" fill="#2f5fa8" text-anchor="middle">the group you created, with a tracked offset</text>

  <rect x="446" y="294" width="410" height="60" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8">
    <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" values="1.8;1.8;3.4;1.8;1.8" keyTimes="0;0.4;0.46;0.52;1"/>
  </rect>
  <text x="651" y="316" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">console-consumer-49032</text>
  <text x="651" y="336" font-size="10" fill="#8a6d00" text-anchor="middle">you never created this &#8212; <tspan font-weight="700">Kafka made it for you</tspan></text>

  <rect x="24" y="370" width="410" height="76" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="229" y="392" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka&#8217;s whole mechanism runs on consumer groups</text>
  <text x="229" y="412" font-size="10.5" fill="#1e7a44" text-anchor="middle">So even when you do not specify one, it silently</text>
  <text x="229" y="428" font-size="10.5" fill="#1e7a44" text-anchor="middle">creates a throwaway group with no stored offset.</text>

  <rect x="446" y="370" width="410" height="76" rx="10" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.6"/>
  <text x="651" y="392" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Which is why you see rebalancing in production</text>
  <text x="651" y="412" font-size="10.5" fill="#a01818" text-anchor="middle">Peeking at a live topic &#8220;from beginning&#8221; adds a new</text>
  <text x="651" y="428" font-size="10.5" fill="#a01818" text-anchor="middle">consumer to the cluster &#8212; and joining triggers a rebalance.</text>
</svg>
