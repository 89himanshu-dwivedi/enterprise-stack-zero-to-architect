<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A bug corrupts data in the database, the fix is deployed and the offset is reset so the messages replay">
  <defs>
    <marker id="t3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">3 · Case 1 &#8212; data got lost or corrupted. Replay it.</text>

  <rect x="24" y="42" width="832" height="30" rx="8" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.4"/>
  <g text-anchor="middle" font-size="12" font-weight="700">
    <text x="440" y="62" fill="#a01818" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.28;0.31;1"/>A NullPointerException / a wrong calculation quietly writes bad rows &#8212; or writes nothing at all</text>
    <text x="440" y="62" fill="#7a5b00" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.31;0.34;0.60;0.63;1"/>Fix the bug and redeploy &#8212; but now, from which offset do you reprocess?</text>
    <text x="440" y="62" fill="#0f4d2a" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.63;0.66;0.97;1"/>Reset the offset backwards &#8594; the lag reappears &#8594; the fixed service reprocesses those exact records</text>
  </g>

  <!-- topic -->
  <rect x="24" y="90" width="200" height="140" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="124" y="112" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic: order-events</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="44" y="124" width="160" height="28" rx="6"/>
    <rect x="44" y="156" width="160" height="28" rx="6"/>
    <rect x="44" y="188" width="160" height="28" rx="6"/>
  </g>
  <g font-size="10" font-family="Consolas, monospace" fill="#0f4d2a" text-anchor="middle">
    <text x="124" y="143">offset 3 : order-3</text>
    <text x="124" y="175">offset 4 : order-4</text>
    <text x="124" y="207">offset 5 : order-5</text>
  </g>

  <path d="M224 160 L268 160" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#t3)"/>

  <!-- consumer -->
  <rect x="274" y="90" width="200" height="140" rx="11" fill="#fff8f8" stroke="#c62828" stroke-width="1.8">
    <animate attributeName="stroke" dur="16s" repeatCount="indefinite" values="#c62828;#c62828;#1e7a44;#1e7a44;#c62828" keyTimes="0;0.31;0.36;0.97;1"/>
  </rect>
  <text x="374" y="112" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">Payment Service</text>
  <text x="374" y="140" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    v1 &#8212; buggy
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.31;0.34;1"/>
  </text>
  <text x="374" y="140" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle" opacity="0">
    v1.1 &#8212; bug fixed
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.33;0.37;0.97;1"/>
  </text>
  <g font-size="9" fill="#c0392b" text-anchor="middle">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.31;0.34;1"/>
    <text x="374" y="164">NullPointerException</text>
    <text x="374" y="180">or a calculation mismatch</text>
    <text x="374" y="196">or the write silently fails</text>
  </g>
  <text x="374" y="176" font-size="9" fill="#1e7a44" text-anchor="middle" opacity="0">
    processes correctly now
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.33;0.37;0.97;1"/>
  </text>

  <path d="M474 160 L518 160" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#t3)"/>

  <!-- database -->
  <rect x="524" y="90" width="332" height="140" rx="11" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.8"/>
  <text x="690" y="112" font-size="11" font-weight="700" fill="#1b2a3a" text-anchor="middle">database</text>
  <g font-size="9.5" font-weight="700" fill="#5b6b7f">
    <text x="544" y="132">order_id</text><text x="640" y="132">amount</text><text x="740" y="132">kafka_offset</text>
  </g>
  <g font-size="10" font-family="Consolas, monospace">
    <rect x="540" y="138" width="300" height="26" rx="5" fill="#ffebee"><animate attributeName="fill" dur="16s" repeatCount="indefinite" values="#ffebee;#ffebee;#e6f4ea;#e6f4ea;#ffebee" keyTimes="0;0.66;0.72;0.97;1"/></rect>
    <text x="548" y="156" fill="#1b2a3a">order-3</text>
    <text x="644" y="156" fill="#a01818">NULL<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.70;0.74;1"/></text>
    <text x="644" y="156" fill="#0f4d2a" opacity="0">2499<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.72;0.76;0.97;1"/></text>
    <text x="756" y="156" fill="#7a5b00">3</text>

    <rect x="540" y="170" width="300" height="26" rx="5" fill="#ffebee"><animate attributeName="fill" dur="16s" repeatCount="indefinite" values="#ffebee;#ffebee;#e6f4ea;#e6f4ea;#ffebee" keyTimes="0;0.70;0.76;0.97;1"/></rect>
    <text x="548" y="188" fill="#1b2a3a">order-4</text>
    <text x="644" y="188" fill="#a01818">-99<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.74;0.78;1"/></text>
    <text x="644" y="188" fill="#0f4d2a" opacity="0">799<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.76;0.80;0.97;1"/></text>
    <text x="756" y="188" fill="#7a5b00">4</text>

    <rect x="540" y="202" width="300" height="26" rx="5" fill="#e6f4ea"/>
    <text x="548" y="220" fill="#1b2a3a">order-5</text>
    <text x="644" y="220" fill="#0f4d2a">15999</text>
    <text x="756" y="220" fill="#7a5b00">5</text>
  </g>

  <rect x="736" y="126" width="106" height="106" rx="8" fill="none" stroke="#b8860b" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="789" y="248" font-size="9.5" font-weight="700" fill="#7a5b00" text-anchor="middle">store the offset alongside the row</text>

  <!-- how you know the offset -->
  <rect x="24" y="258" width="410" height="106" rx="10" fill="#1b2a3a"/>
  <text x="40" y="280" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">every consumed record carries metadata &#8212; ask for it</text>
  <text x="40" y="302" font-size="9" fill="#f4b400" font-family="Consolas, monospace">--property print.key=true --property print.offset=true</text>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="326">Offset:3&#160;&#160;&#160;1&#160;&#160;&#160;order-3</text>
    <text x="40" y="344">Offset:4&#160;&#160;&#160;2&#160;&#160;&#160;order-4</text>
    <text x="250" y="326" font-size="9" fill="#8ea3bb">so the service can persist</text>
    <text x="250" y="344" font-size="9" fill="#8ea3bb">the offset with the record</text>
  </g>

  <!-- reset -->
  <rect x="446" y="258" width="410" height="106" rx="10" fill="#1b2a3a"/>
  <text x="462" y="280" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">now rewind the group to that offset</text>
  <text x="462" y="304" font-size="9" fill="#f4b400" font-family="Consolas, monospace">$ kafka-consumer-groups.sh --bootstrap-server localhost:9092 \</text>
  <text x="462" y="318" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;--group payment-service --topic order-events \</text>
  <text x="462" y="332" font-size="9" fill="#f4b400" font-family="Consolas, monospace">&#160;&#160;&#160;--reset-offsets --shift-by -2 --dry-run</text>
  <text x="462" y="352" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">happy with it? swap --dry-run for --execute</text>

  <!-- offset ruler -->
  <rect x="24" y="380" width="832" height="86" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="44" y="402" font-size="11" font-weight="700" fill="#0f4d2a">partition 1</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3">
    <rect x="140" y="414" width="80" height="34" rx="6"/><rect x="228" y="414" width="80" height="34" rx="6"/>
    <rect x="316" y="414" width="80" height="34" rx="6"/><rect x="404" y="414" width="80" height="34" rx="6"/>
    <rect x="492" y="414" width="80" height="34" rx="6"/><rect x="580" y="414" width="80" height="34" rx="6"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="180" y="436">0</text><text x="268" y="436">1</text><text x="356" y="436">2</text>
    <text x="444" y="436">3</text><text x="532" y="436">4</text><text x="620" y="436">5</text>
  </g>
  <polygon points="-8,410 8,410 0,398" fill="#b8860b">
    <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
      values="664 0;664 0;664 0;444 0;444 0;664 0" keyTimes="0;0.60;0.66;0.72;0.94;1"/>
  </polygon>
  <text x="700" y="404" font-size="9.5" font-weight="700" fill="#7a5b00">current offset</text>
  <rect x="404" y="414" width="256" height="34" rx="6" fill="#c62828" opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;0.18;0.18;0" keyTimes="0;0.70;0.75;0.94;1"/>
  </rect>
  <text x="532" y="462" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle" opacity="0">
    these get replayed by the fixed service
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.72;0.77;0.94;1"/>
  </text>
</svg>
