<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="All the reset-offsets options and the dry-run versus execute safety switch">
  <rect width="880" height="480" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">4 · Every way to move the offset</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">The current offset is just a number. Move it and you decide exactly which records the group will see next.</text>

  <!-- ruler -->
  <rect x="24" y="66" width="832" height="92" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3">
    <rect x="60" y="102" width="70" height="38" rx="6"/><rect x="138" y="102" width="70" height="38" rx="6"/>
    <rect x="216" y="102" width="70" height="38" rx="6"/><rect x="294" y="102" width="70" height="38" rx="6"/>
    <rect x="372" y="102" width="70" height="38" rx="6"/><rect x="450" y="102" width="70" height="38" rx="6"/>
    <rect x="528" y="102" width="70" height="38" rx="6"/><rect x="606" y="102" width="70" height="38" rx="6"/>
    <rect x="684" y="102" width="70" height="38" rx="6"/><rect x="762" y="102" width="70" height="38" rx="6"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="95" y="126">0</text><text x="173" y="126">1</text><text x="251" y="126">2</text><text x="329" y="126">3</text>
    <text x="407" y="126">4</text><text x="485" y="126">5</text><text x="563" y="126">6</text><text x="641" y="126">7</text>
    <text x="719" y="126">8</text><text x="797" y="126">9</text>
  </g>
  <polygon points="-9,98 9,98 0,86" fill="#b8860b">
    <animateTransform attributeName="transform" type="translate" dur="18s" repeatCount="indefinite"
      values="563 0;563 0;485 0;485 0;719 0;719 0;95 0;95 0;836 0;836 0;407 0;407 0;251 0;251 0;563 0"
      keyTimes="0;0.08;0.13;0.24;0.29;0.40;0.45;0.56;0.61;0.72;0.77;0.86;0.91;0.97;1"/>
  </polygon>
  <text x="24" y="94" font-size="10" font-weight="700" fill="#7a5b00">current offset</text>

  <!-- option cards -->
  <g>
    <rect x="24" y="172" width="270" height="82" rx="10" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
    <rect x="24" y="172" width="270" height="82" rx="10" fill="none" stroke="#2f5fa8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.10;0.13;0.24;0.27;1"/>
    </rect>
    <text x="44" y="194" font-size="11.5" font-weight="700" fill="#1b2a3a" font-family="Consolas, monospace">--shift-by -1</text>
    <text x="44" y="214" font-size="10.5" fill="#5b6b7f">move backwards by N offsets.</text>
    <text x="44" y="232" font-size="10.5" fill="#5b6b7f">Negative goes back, positive goes forward.</text>
    <text x="44" y="248" font-size="9.5" fill="#7a5b00">the surgical option &#8212; replay exactly N records</text>
  </g>

  <g>
    <rect x="305" y="172" width="270" height="82" rx="10" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
    <rect x="305" y="172" width="270" height="82" rx="10" fill="none" stroke="#2f5fa8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.29;0.40;0.43;1"/>
    </rect>
    <text x="325" y="194" font-size="11.5" font-weight="700" fill="#1b2a3a" font-family="Consolas, monospace">--shift-by +2</text>
    <text x="325" y="214" font-size="10.5" fill="#5b6b7f">skip forward past records you</text>
    <text x="325" y="232" font-size="10.5" fill="#5b6b7f">deliberately do not want processed.</text>
    <text x="325" y="248" font-size="9.5" fill="#a01818">those records are simply never consumed</text>
  </g>

  <g>
    <rect x="586" y="172" width="270" height="82" rx="10" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
    <rect x="586" y="172" width="270" height="82" rx="10" fill="none" stroke="#2f5fa8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.42;0.45;0.56;0.59;1"/>
    </rect>
    <text x="606" y="194" font-size="11.5" font-weight="700" fill="#1b2a3a" font-family="Consolas, monospace">--to-earliest</text>
    <text x="606" y="214" font-size="10.5" fill="#5b6b7f">jump to offset 0 &#8212; the whole topic,</text>
    <text x="606" y="232" font-size="10.5" fill="#5b6b7f">as far back as retention still holds it.</text>
    <text x="606" y="248" font-size="9.5" fill="#7a5b00">full rebuild of a downstream store</text>
  </g>

  <g>
    <rect x="24" y="266" width="270" height="82" rx="10" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.6"/>
    <rect x="24" y="266" width="270" height="82" rx="10" fill="none" stroke="#0f4d2a" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.61;0.72;0.75;1"/>
    </rect>
    <text x="44" y="288" font-size="11.5" font-weight="700" fill="#0f4d2a" font-family="Consolas, monospace">--to-latest</text>
    <text x="44" y="308" font-size="10.5" fill="#1e7a44">jump to the log-end offset.</text>
    <text x="44" y="326" font-size="10.5" fill="#1e7a44">Lag instantly becomes zero.</text>
    <text x="44" y="342" font-size="9.5" font-weight="700" fill="#0f4d2a">this is the one that saves you after downtime</text>
  </g>

  <g>
    <rect x="305" y="266" width="270" height="82" rx="10" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
    <rect x="305" y="266" width="270" height="82" rx="10" fill="none" stroke="#2f5fa8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.74;0.77;0.86;0.89;1"/>
    </rect>
    <text x="325" y="288" font-size="11.5" font-weight="700" fill="#1b2a3a" font-family="Consolas, monospace">--by-duration PT1H</text>
    <text x="325" y="308" font-size="10.5" fill="#5b6b7f">move back by a period &#8212;</text>
    <text x="325" y="326" font-size="10.5" fill="#5b6b7f">5 minutes, 5 hours, whatever.</text>
    <text x="325" y="342" font-size="9.5" fill="#7a5b00">&#8220;replay the last hour&#8221; without hunting for offsets</text>
  </g>

  <g>
    <rect x="586" y="266" width="270" height="82" rx="10" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.6"/>
    <rect x="586" y="266" width="270" height="82" rx="10" fill="none" stroke="#2f5fa8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.90;0.93;0.98;1"/>
    </rect>
    <text x="606" y="288" font-size="11.5" font-weight="700" fill="#1b2a3a" font-family="Consolas, monospace">--to-datetime</text>
    <text x="606" y="308" font-size="10.5" fill="#5b6b7f">reset to an exact date and time,</text>
    <text x="606" y="326" font-size="10.5" fill="#5b6b7f">e.g. just before the bad deploy went out.</text>
    <text x="606" y="342" font-size="9.5" fill="#7a5b00">2026-08-31T09:00:00.000</text>
  </g>

  <!-- dry run vs execute -->
  <rect x="24" y="366" width="410" height="102" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="229" y="388" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">Step 1 &#8212; <tspan font-family="Consolas, monospace">--dry-run</tspan></text>
  <text x="229" y="408" font-size="10.5" fill="#8a6d00" text-anchor="middle">Nothing changes. Kafka just prints what the new</text>
  <text x="229" y="424" font-size="10.5" fill="#8a6d00" text-anchor="middle">offsets <tspan font-style="italic">would</tspan> be, per partition.</text>
  <rect x="44" y="434" width="370" height="24" rx="5" fill="#1b2a3a"/>
  <text x="56" y="450" font-size="9" fill="#a8d5ba" font-family="Consolas, monospace">order-events&#160;&#160;1&#160;&#160;&#8594;&#160;1&#160;&#160;&#160;&#160;&#160;order-events&#160;&#160;0&#160;&#160;&#8594;&#160;3</text>

  <rect x="446" y="366" width="410" height="102" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="651" y="388" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">Step 2 &#8212; <tspan font-family="Consolas, monospace">--execute</tspan></text>
  <text x="651" y="408" font-size="10.5" fill="#1e7a44" text-anchor="middle">Now it is applied. Run <tspan font-family="Consolas, monospace">--describe</tspan> again and</text>
  <text x="651" y="424" font-size="10.5" fill="#1e7a44" text-anchor="middle">watch the lag change to exactly what you expected.</text>
  <rect x="466" y="434" width="370" height="24" rx="5" fill="#ffebee"/>
  <text x="651" y="450" font-size="9.5" font-weight="700" fill="#a01818" text-anchor="middle">The group must have <tspan text-decoration="underline">no active members</tspan> &#8212; stop the consumers first.</text>
</svg>
