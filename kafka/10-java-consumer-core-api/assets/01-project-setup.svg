<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Spring Initializr setup with web, Kafka and Lombok dependencies">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">1 · The project &#8212; <tspan font-family="Consolas, monospace">start.spring.io</tspan></text>

  <!-- left column -->
  <rect x="24" y="46" width="400" height="290" rx="12" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <g font-size="11" font-weight="700" fill="#5b6b7f">
    <text x="44" y="72">Project</text>
    <text x="44" y="122">Language</text>
    <text x="44" y="172">Spring Boot</text>
    <text x="44" y="222">Project Metadata</text>
  </g>
  <g>
    <rect x="44" y="80" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
    <text x="104" y="99" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">Maven</text>
    <rect x="176" y="80" width="120" height="28" rx="14" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4"/>
    <text x="236" y="99" font-size="11" fill="#8ea3bb" text-anchor="middle">Gradle</text>
  </g>
  <g>
    <rect x="44" y="130" width="90" height="28" rx="14" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
    <text x="89" y="149" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">Java</text>
    <rect x="146" y="130" width="90" height="28" rx="14" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4"/>
    <text x="191" y="149" font-size="11" fill="#8ea3bb" text-anchor="middle">Kotlin</text>
  </g>
  <rect x="44" y="180" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="104" y="199" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">4.0.2</text>

  <g font-size="10.5" fill="#5b6b7f">
    <text x="44" y="246">Group</text>
    <rect x="140" y="232" width="260" height="22" rx="5" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.3"/>
    <text x="150" y="248" font-family="Consolas, monospace" fill="#1b2a3a">com.suel</text>

    <text x="44" y="278">Artifact</text>
    <rect x="140" y="264" width="260" height="22" rx="5" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.3"/>
    <text x="150" y="280" font-family="Consolas, monospace" fill="#1b2a3a">kafka-playground</text>

    <text x="44" y="310">Java</text>
    <rect x="140" y="296" width="80" height="22" rx="5" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
    <text x="180" y="312" font-family="Consolas, monospace" font-weight="700" fill="#0f4d2a" text-anchor="middle">17</text>
  </g>

  <!-- right column -->
  <rect x="440" y="46" width="416" height="290" rx="12" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="460" y="72" font-size="11" font-weight="700" fill="#5b6b7f">Dependencies</text>

  <g>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.08;0.14;1"/>
    <rect x="460" y="84" width="376" height="56" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
    <text x="476" y="106" font-size="12" font-weight="700" fill="#12305e">Spring Web</text>
    <text x="476" y="126" font-size="9.5" fill="#2f5fa8">Build web, including RESTful, applications using Spring MVC</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.26;0.32;1"/>
    <rect x="460" y="152" width="376" height="56" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
    <text x="476" y="174" font-size="12" font-weight="700" fill="#0f4d2a">Spring for Apache Kafka</text>
    <text x="476" y="194" font-size="9.5" fill="#1e7a44">brings in <tspan font-family="Consolas, monospace">org.apache.kafka:kafka-clients</tspan> &#8212; the part we actually use today</text>
  </g>
  <g>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.44;0.50;1"/>
    <rect x="460" y="220" width="376" height="56" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
    <text x="476" y="242" font-size="12" font-weight="700" fill="#7a5b00">Lombok</text>
    <text x="476" y="262" font-size="9.5" fill="#8a6d00">less boilerplate later on</text>
  </g>
  <g opacity="0.35">
    <rect x="460" y="288" width="376" height="34" rx="9" fill="#ffffff" stroke="#c9d3e0" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="476" y="309" font-size="10.5" fill="#8ea3bb">Spring for Apache Kafka Streams &#8212; skipped, that is its own course</text>
  </g>

  <rect x="330" y="352" width="220" height="38" rx="19" fill="#0f4d2a">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0.4;0.4;1;1" keyTimes="0;0.6;0.68;1"/>
  </rect>
  <text x="440" y="377" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">GENERATE</text>

  <rect x="24" y="400" width="832" height="22" rx="6" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.2"/>
  <text x="440" y="416" font-size="10.5" font-weight="600" fill="#1b2a3a" text-anchor="middle">Import into any IDE. We use Spring Boot only as a convenient shell &#8212; today&#8217;s code is plain <tspan font-family="Consolas, monospace">main()</tspan> and the raw Kafka client.</text>
</svg>
