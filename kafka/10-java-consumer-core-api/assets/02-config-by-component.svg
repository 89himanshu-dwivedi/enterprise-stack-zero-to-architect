<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Three components each with their own configuration class: ProducerConfig, broker properties and ConsumerConfig, with serializers on one side and deserializers on the other">
  <defs>
    <marker id="u2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · Three components, three separate config sets</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Producer, broker and consumer each have their own properties. Mixing them up is the most common first-day mistake.</text>

  <!-- producer -->
  <rect x="24" y="70" width="262" height="230" rx="12" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="155" y="94" font-size="12.5" font-weight="700" fill="#12305e" text-anchor="middle">Producer</text>
  <text x="155" y="112" font-size="10.5" font-weight="700" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">ProducerConfig</text>
  <rect x="44" y="122" width="222" height="112" rx="8" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.3"/>
  <g font-size="9.5" font-family="Consolas, monospace" fill="#12305e">
    <text x="56" y="142">bootstrap.servers</text>
    <text x="56" y="160">key.serializer</text>
    <text x="56" y="178">value.serializer</text>
    <text x="56" y="196">linger.ms</text>
    <text x="56" y="214">buffer.memory</text>
    <text x="56" y="228" fill="#8ea3bb">acks, retries, compression.type &#8230;</text>
  </g>
  <rect x="44" y="244" width="222" height="42" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="155" y="262" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">SERIALIZER lives here</text>
  <text x="155" y="278" font-size="9" fill="#8a6d00" text-anchor="middle">your object &#8594; bytes, before it leaves</text>

  <path d="M286 186 L318 186" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#u2)"/>

  <!-- broker -->
  <rect x="324" y="70" width="232" height="230" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="440" y="94" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka broker</text>
  <text x="440" y="112" font-size="10.5" font-weight="700" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">server.properties</text>
  <rect x="344" y="122" width="192" height="112" rx="8" fill="#1b2a3a"/>
  <g font-size="9.5" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="356" y="142">process.roles</text>
    <text x="356" y="160">node.id</text>
    <text x="356" y="178">log.dirs</text>
    <text x="356" y="196">log.retention.hours</text>
    <text x="356" y="214">num.partitions</text>
    <text x="356" y="228" fill="#8ea3bb">broker-level, set by whoever runs it</text>
  </g>
  <rect x="344" y="244" width="192" height="42" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="440" y="262" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">just moves bytes</text>
  <text x="440" y="278" font-size="9" fill="#1e7a44" text-anchor="middle">no serialization work here &#8212; part 08</text>

  <path d="M556 186 L588 186" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#u2)"/>

  <!-- consumer -->
  <rect x="594" y="70" width="262" height="230" rx="12" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="725" y="94" font-size="12.5" font-weight="700" fill="#12305e" text-anchor="middle">Consumer</text>
  <text x="725" y="112" font-size="10.5" font-weight="700" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">ConsumerConfig</text>
  <rect x="614" y="122" width="222" height="112" rx="8" fill="#ffffff" stroke="#2f5fa8" stroke-width="1.3"/>
  <g font-size="9.5" font-family="Consolas, monospace" fill="#12305e">
    <text x="626" y="142">bootstrap.servers</text>
    <text x="626" y="160">group.id</text>
    <text x="626" y="178">key.deserializer</text>
    <text x="626" y="196">value.deserializer</text>
    <text x="626" y="214">enable.auto.commit</text>
    <text x="626" y="228" fill="#8ea3bb">max.poll.records, auto.offset.reset &#8230;</text>
  </g>
  <rect x="614" y="244" width="222" height="42" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="725" y="262" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">DESERIALIZER lives here</text>
  <text x="725" y="278" font-size="9" fill="#8a6d00" text-anchor="middle">bytes &#8594; your object, after it arrives</text>

  <circle r="7" fill="#f4b400" stroke="#8a6d00" stroke-width="1.3">
    <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="155;440;725"/>
    <animate attributeName="cy" dur="4s" repeatCount="indefinite" values="186;186;186"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.88;1"/>
  </circle>

  <!-- deserializer detail -->
  <rect x="24" y="316" width="410" height="106" rx="10" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="229" y="338" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">Two deserializers, not one</text>
  <rect x="44" y="348" width="176" height="30" rx="6" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3"/>
  <text x="132" y="368" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">key.deserializer</text>
  <text x="132" y="392" font-size="9.5" fill="#1e7a44" text-anchor="middle">the type of the <tspan font-weight="700">partition key</tspan></text>
  <text x="132" y="408" font-size="9.5" fill="#1e7a44" text-anchor="middle">you published with</text>
  <rect x="238" y="348" width="176" height="30" rx="6" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3"/>
  <text x="326" y="368" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">value.deserializer</text>
  <text x="326" y="392" font-size="9.5" fill="#1e7a44" text-anchor="middle">the type of the <tspan font-weight="700">payload</tspan></text>
  <text x="326" y="408" font-size="9.5" fill="#1e7a44" text-anchor="middle">&#8212; the actual data</text>

  <rect x="446" y="316" width="410" height="106" rx="10" fill="#1b2a3a"/>
  <g font-size="10" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="466" y="340">props.put(ConsumerConfig.BOOTSTRAP_SERVERS_CONFIG,</text>
    <text x="466" y="356">&#160;&#160;&#160;&#160;&#160;&#160;"localhost:9092");&#160;&#160;<tspan fill="#8ea3bb">// or 9092,9093,9094</tspan></text>
    <text x="466" y="378">props.put(ConsumerConfig.GROUP_ID_CONFIG, "play-group");</text>
    <text x="466" y="400">props.put(ConsumerConfig.KEY_DESERIALIZER_CLASS_CONFIG,</text>
    <text x="466" y="414">&#160;&#160;&#160;&#160;&#160;&#160;StringDeserializer.class);</text>
  </g>
</svg>
