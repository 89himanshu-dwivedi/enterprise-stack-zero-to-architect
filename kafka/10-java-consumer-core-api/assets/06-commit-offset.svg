<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Without a commit the current offset stays at zero so every restart redelivers the same messages">
  <defs>
    <marker id="u6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · &#8220;Why do I keep getting the same messages on every restart?&#8221;</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Because we set <tspan font-family="Consolas, monospace">enable.auto.commit=false</tspan> and never acknowledged. Reading is not the same as committing.</text>

  <!-- without commit -->
  <rect x="20" y="66" width="400" height="212" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="220" y="90" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">No commit</text>

  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.3">
    <rect x="44" y="120" width="52" height="40" rx="6"/><rect x="102" y="120" width="52" height="40" rx="6"/>
    <rect x="160" y="120" width="52" height="40" rx="6"/><rect x="218" y="120" width="52" height="40" rx="6"/>
    <rect x="276" y="120" width="52" height="40" rx="6"/><rect x="334" y="120" width="52" height="40" rx="6"/>
  </g>
  <g font-size="9.5" font-weight="600" fill="#a01818" text-anchor="middle">
    <text x="70" y="145">0</text><text x="128" y="145">1</text><text x="186" y="145">2</text>
    <text x="244" y="145">3</text><text x="302" y="145">4</text><text x="360" y="145">5</text>
  </g>
  <polygon points="-8,116 8,116 0,104" fill="#c62828">
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite" values="70 0;70 0" keyTimes="0;1"/>
  </polygon>
  <text x="70" y="98" font-size="9.5" font-weight="700" fill="#a01818" text-anchor="middle">current offset = 0</text>
  <text x="380" y="112" font-size="9" font-weight="700" fill="#a01818" text-anchor="end">log-end = 6</text>

  <g fill="#c62828">
    <circle r="6" cy="180"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="70;360"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/></circle>
    <circle r="6" cy="180"><animate attributeName="cx" dur="3s" begin="1.5s" repeatCount="indefinite" values="70;360"/><animate attributeName="opacity" dur="3s" begin="1.5s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.85;1"/></circle>
  </g>
  <text x="220" y="212" font-size="11" fill="#a01818" text-anchor="middle">The consumer read all six &#8212; but never said so.</text>
  <text x="220" y="234" font-size="11" fill="#a01818" text-anchor="middle">The stored offset is still <tspan font-weight="700">0</tspan>, so on the next start</text>
  <text x="220" y="250" font-size="11" fill="#a01818" text-anchor="middle">Kafka honestly believes nothing has been consumed.</text>
  <text x="220" y="270" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">Same six messages, every single restart.</text>

  <!-- with commit -->
  <rect x="460" y="66" width="400" height="212" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.8"/>
  <text x="660" y="90" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">With <tspan font-family="Consolas, monospace">commitSync()</tspan></text>

  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3">
    <rect x="484" y="120" width="52" height="40" rx="6"/><rect x="542" y="120" width="52" height="40" rx="6"/>
    <rect x="600" y="120" width="52" height="40" rx="6"/><rect x="658" y="120" width="52" height="40" rx="6"/>
    <rect x="716" y="120" width="52" height="40" rx="6"/><rect x="774" y="120" width="52" height="40" rx="6"/>
  </g>
  <g font-size="9.5" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="510" y="145">0</text><text x="568" y="145">1</text><text x="626" y="145">2</text>
    <text x="684" y="145">3</text><text x="742" y="145">4</text><text x="800" y="145">5</text>
  </g>
  <rect x="484" y="120" width="342" height="40" rx="6" fill="#1e7a44" opacity="0">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0;0.16;0.16" keyTimes="0;0.5;1"/>
  </rect>
  <polygon points="-8,116 8,116 0,104" fill="#0f4d2a">
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite" values="510 0;510 0;826 0;826 0" keyTimes="0;0.35;0.55;1"/>
  </polygon>
  <text x="660" y="98" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">current offset moves with the commit</text>

  <text x="660" y="196" font-size="11" fill="#0f4d2a" text-anchor="middle">Acknowledging <tspan font-weight="700">is</tspan> committing the offset of what</text>
  <text x="660" y="212" font-size="11" fill="#0f4d2a" text-anchor="middle">you consumed. Current offset = 6, lag = 0.</text>
  <text x="660" y="240" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">Restart now and nothing is redelivered.</text>
  <text x="660" y="262" font-size="10" fill="#1e7a44" text-anchor="middle">With the console consumer this was happening for you behind the scenes.</text>

  <!-- code -->
  <rect x="24" y="296" width="410" height="126" rx="11" fill="#1b2a3a"/>
  <text x="40" y="318" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">inside the poll loop</text>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="40" y="344">if (!records.isEmpty()) {</text>
    <text x="40" y="362">&#160;&#160;&#160;&#160;consumer.commitSync();</text>
    <text x="40" y="380">}</text>
  </g>
  <text x="40" y="404" font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">the emptiness check matters &#8212; poll() times out every</text>
  <text x="40" y="416" font-size="9" fill="#8ea3bb" font-family="Consolas, monospace">second and frequently returns no records at all</text>

  <rect x="446" y="296" width="410" height="126" rx="11" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="651" y="320" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">Two flavours</text>
  <rect x="466" y="330" width="180" height="34" rx="7" fill="#fff8e1" stroke="#b8860b" stroke-width="1.3"/>
  <text x="556" y="352" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">commitSync()</text>
  <rect x="656" y="330" width="180" height="34" rx="7" fill="#fff8e1" stroke="#b8860b" stroke-width="1.3"/>
  <text x="746" y="352" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">commitAsync()</text>
  <text x="556" y="382" font-size="9.5" fill="#8a6d00" text-anchor="middle">blocks and retries</text>
  <text x="556" y="396" font-size="9.5" fill="#8a6d00" text-anchor="middle">safest, slowest</text>
  <text x="746" y="382" font-size="9.5" fill="#8a6d00" text-anchor="middle">fire and forget</text>
  <text x="746" y="396" font-size="9.5" fill="#8a6d00" text-anchor="middle">faster, no retry</text>
  <text x="651" y="414" font-size="9.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Verify with <tspan font-family="Consolas, monospace">kafka-consumer-groups.sh --describe</tspan></text>
</svg>
