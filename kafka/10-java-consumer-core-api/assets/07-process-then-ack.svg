<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Acknowledge after processing so a crash mid-processing replays the event, and how auto commit interval works">
  <defs>
    <marker id="u7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">7 · When should you acknowledge? After processing.</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Say the event is an order and you are the payment or inventory service, and processing takes a minute. Order matters.</text>

  <!-- wrong -->
  <rect x="20" y="66" width="400" height="176" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="220" y="90" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">Acknowledge first, then process</text>
  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.5">
    <rect x="44" y="102" width="104" height="42" rx="8"/>
    <rect x="164" y="102" width="104" height="42" rx="8"/>
    <rect x="284" y="102" width="112" height="42" rx="8"/>
  </g>
  <g font-size="10" font-weight="600" fill="#a01818" text-anchor="middle">
    <text x="96" y="128">receive</text><text x="216" y="128">commit</text><text x="340" y="122">process</text>
    <text x="340" y="136">&#8230; CRASH</text>
  </g>
  <g stroke="#c62828" stroke-width="1.6" fill="none" marker-end="url(#u7)">
    <path d="M148 123 L158 123"/><path d="M268 123 L278 123"/>
  </g>
  <line x1="292" y1="106" x2="392" y2="140" stroke="#c62828" stroke-width="2"/>
  <line x1="392" y1="106" x2="292" y2="140" stroke="#c62828" stroke-width="2"/>
  <text x="220" y="172" font-size="11" fill="#a01818" text-anchor="middle">The offset already moved, so on restart Kafka</text>
  <text x="220" y="190" font-size="11" fill="#a01818" text-anchor="middle">will never hand you that event again.</text>
  <text x="220" y="214" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">The payment is silently lost.</text>
  <text x="220" y="232" font-size="10" fill="#a01818" text-anchor="middle">at-most-once delivery</text>

  <!-- right -->
  <rect x="460" y="66" width="400" height="176" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.8"/>
  <text x="660" y="90" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Process first, then acknowledge &#160;&#9733;</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5">
    <rect x="484" y="102" width="104" height="42" rx="8"/>
    <rect x="604" y="102" width="112" height="42" rx="8"/>
    <rect x="732" y="102" width="104" height="42" rx="8"/>
  </g>
  <g font-size="10" font-weight="600" fill="#0f4d2a" text-anchor="middle">
    <text x="536" y="128">receive</text>
    <text x="660" y="122">process</text><text x="660" y="136">~1 minute</text>
    <text x="784" y="128">commit</text>
  </g>
  <g stroke="#1e7a44" stroke-width="1.6" fill="none" marker-end="url(#u7)">
    <path d="M588 123 L598 123"/><path d="M716 123 L726 123"/>
  </g>
  <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="536;660;784"/><animate attributeName="cy" dur="3s" repeatCount="indefinite" values="123;123;123"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.88;1"/></circle>
  <text x="660" y="172" font-size="11" fill="#0f4d2a" text-anchor="middle">Crash mid-processing &#8212; OutOfMemoryError, a restart,</text>
  <text x="660" y="190" font-size="11" fill="#0f4d2a" text-anchor="middle">anything &#8212; and the offset never moved.</text>
  <text x="660" y="214" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka hands you the same event again.</text>
  <text x="660" y="232" font-size="10" fill="#0f4d2a" text-anchor="middle">at-least-once delivery &#8212; so make your handler idempotent</text>

  <!-- auto commit -->
  <text x="24" y="278" font-size="14" font-weight="700" fill="#1b2a3a">The other option &#8212; let Kafka do it</text>

  <rect x="24" y="292" width="410" height="164" rx="11" fill="#1b2a3a"/>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="40" y="318">enable.auto.commit = true&#160;&#160;&#160;&#160;&#160;&#160;<tspan fill="#f4b400">// the default</tspan></text>
    <text x="40" y="340">auto.commit.interval.ms = 5000&#160;&#160;<tspan fill="#f4b400">// 5 seconds</tspan></text>
  </g>
  <text x="40" y="372" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">Why an interval at all? For a very high throughput app</text>
  <text x="40" y="388" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">processing thousands of events per second, the consumer</text>
  <text x="40" y="404" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">cannot make a network call over the TCP connection for</text>
  <text x="40" y="420" font-size="10" fill="#8ea3bb" font-family="Consolas, monospace">every single acknowledgement. So they batched it.</text>
  <text x="40" y="444" font-size="10" fill="#f4b400" font-family="Consolas, monospace">Commits happen periodically, as messages are delivered.</text>

  <rect x="446" y="292" width="410" height="164" rx="11" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="651" y="316" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">The gap that 5 seconds creates</text>
  <text x="651" y="338" font-size="10.5" fill="#8a6d00" text-anchor="middle">Publish <tspan font-family="Consolas, monospace">order-14</tspan>, then kill the consumer immediately.</text>
  <text x="651" y="354" font-size="10.5" fill="#8a6d00" text-anchor="middle">Sometimes you see it again on restart, sometimes not &#8212;</text>
  <text x="651" y="370" font-size="10.5" fill="#8a6d00" text-anchor="middle">it depends entirely on whether the interval had elapsed.</text>
  <line x1="470" y1="386" x2="832" y2="386" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="651" y="408" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Best practice: acknowledge manually.</text>
  <text x="651" y="428" font-size="10.5" fill="#8a6d00" text-anchor="middle">Only the application knows which message it actually</text>
  <text x="651" y="444" font-size="10.5" fill="#8a6d00" text-anchor="middle">finished processing, and which it did not.</text>
</svg>
