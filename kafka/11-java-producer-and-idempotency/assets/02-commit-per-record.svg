<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Committing per record with a map of TopicPartition to OffsetAndMetadata instead of the no-argument commitSync">
  <defs>
    <marker id="v2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · Acknowledging one record at a time</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Offsets are maintained <tspan font-weight="700">per partition</tspan> &#8212; so an acknowledgement has to be expressed per partition too.</text>

  <!-- coarse -->
  <rect x="20" y="66" width="400" height="118" rx="11" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="220" y="90" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">coarse &#8212; the whole batch</text>
  <rect x="44" y="102" width="352" height="30" rx="6" fill="#1b2a3a"/>
  <text x="56" y="122" font-size="10.5" fill="#a8d5ba" font-family="Consolas, monospace">consumer.commitSync();</text>
  <text x="220" y="152" font-size="10.5" fill="#5b6b7f" text-anchor="middle">Commits the last offset of everything just polled.</text>
  <text x="220" y="170" font-size="10.5" fill="#5b6b7f" text-anchor="middle">Simple, fast, and all-or-nothing.</text>

  <!-- fine -->
  <rect x="460" y="66" width="400" height="118" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="660" y="90" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">fine-grained &#8212; one record</text>
  <rect x="484" y="102" width="352" height="30" rx="6" fill="#1b2a3a"/>
  <text x="496" y="122" font-size="10" fill="#a8d5ba" font-family="Consolas, monospace">consumer.commitSync(Map.of(tp, offsetAndMetadata));</text>
  <text x="660" y="152" font-size="10.5" fill="#1e7a44" text-anchor="middle">You say exactly which partition moved, and to where.</text>
  <text x="660" y="170" font-size="10.5" fill="#1e7a44" text-anchor="middle">Progress survives a crash mid-batch.</text>

  <!-- build up -->
  <rect x="24" y="200" width="500" height="164" rx="11" fill="#1b2a3a"/>
  <text x="40" y="222" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">for each record in the batch</text>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="248">TopicPartition tp = new TopicPartition(</text>
    <text x="40" y="264">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;record.topic(), record.partition());</text>
    <text x="40" y="292">OffsetAndMetadata next = new OffsetAndMetadata(</text>
    <text x="40" y="308">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;record.offset() + 1);</text>
    <text x="40" y="336">consumer.commitSync(Map.of(tp, next));</text>
  </g>
  <rect x="34" y="234" width="480" height="34" rx="5" fill="#f4b400" opacity="0.16">
    <animate attributeName="y" dur="9s" repeatCount="indefinite" values="234;278;326;234" keyTimes="0;0.33;0.66;1" calcMode="discrete"/>
    <animate attributeName="height" dur="9s" repeatCount="indefinite" values="34;34;18;34" keyTimes="0;0.33;0.66;1" calcMode="discrete"/>
  </rect>

  <rect x="540" y="200" width="316" height="164" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <g text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.31;0.34;1"/>
      <text x="698" y="240" font-size="13" font-weight="700" fill="#0f4d2a">TopicPartition</text>
      <text x="698" y="266" font-size="11" fill="#1e7a44">Which log are we talking about?</text>
      <text x="698" y="288" font-size="11" fill="#1e7a44">The record already carries both</text>
      <text x="698" y="304" font-size="11" fill="#1e7a44">its topic and its partition.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.37;0.64;0.67;1"/>
      <text x="698" y="234" font-size="13" font-weight="700" fill="#0f4d2a">OffsetAndMetadata</text>
      <text x="698" y="258" font-size="11" fill="#1e7a44">Note the <tspan font-family="Consolas, monospace" font-weight="700">+ 1</tspan>.</text>
      <text x="698" y="280" font-size="11" fill="#1e7a44">You commit the offset you want to</text>
      <text x="698" y="296" font-size="11" fill="#1e7a44">read <tspan font-style="italic">next</tspan>, not the one you just read &#8212;</text>
      <text x="698" y="312" font-size="11" fill="#1e7a44">the offset is an array index, so move it on.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.67;0.70;0.97;1"/>
      <text x="698" y="240" font-size="13" font-weight="700" fill="#0f4d2a">Why a Map?</text>
      <text x="698" y="266" font-size="11" fill="#1e7a44">Key = TopicPartition, value = offset.</text>
      <text x="698" y="290" font-size="11" fill="#1e7a44">With three partitions you can commit</text>
      <text x="698" y="306" font-size="11" fill="#1e7a44">all of them in <tspan font-weight="700">one network call</tspan>.</text>
    </g>
  </g>

  <!-- map picture -->
  <rect x="24" y="380" width="832" height="58" rx="10" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <g>
    <rect x="48" y="392" width="230" height="34" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
    <text x="163" y="413" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">order-events &#183; partition 0</text>
    <path d="M282 409 L306 409" stroke="#5b6b7f" stroke-width="1.5" marker-end="url(#v2)"/>
    <rect x="310" y="392" width="110" height="34" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.4"/>
    <text x="365" y="413" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">offset 12</text>

    <rect x="460" y="392" width="230" height="34" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
    <text x="575" y="413" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">order-events &#183; partition 1</text>
    <path d="M694 409 L718 409" stroke="#5b6b7f" stroke-width="1.5" marker-end="url(#v2)"/>
    <rect x="722" y="392" width="110" height="34" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.4"/>
    <text x="777" y="413" font-size="10" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">offset 47</text>
  </g>
</svg>
