<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A lost acknowledgement causes credit card events to be redelivered and the customer charged twice">
  <defs>
    <marker id="v3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="440" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">3 · What happens when the acknowledgement is skipped</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">A consumer that processes credit-card events. It polls, gets messages, processes them all &#8212; and charges the customers.</text>

  <rect x="24" y="70" width="150" height="70" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="99" y="98" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka broker</text>
  <text x="99" y="118" font-size="9" fill="#1e7a44" text-anchor="middle">card-events</text>

  <path d="M174 92 L246 92" fill="none" stroke="#1e7a44" stroke-width="2" marker-end="url(#v3)"/>
  <text x="210" y="82" font-size="9" fill="#1e7a44" text-anchor="middle">deliver</text>

  <rect x="252" y="70" width="230" height="70" rx="10" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="367" y="94" font-size="11.5" font-weight="700" fill="#12305e" text-anchor="middle">Card Processing Service</text>
  <text x="367" y="114" font-size="9.5" fill="#2f5fa8" text-anchor="middle">processes every record</text>
  <text x="367" y="130" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">customers charged &#10003;</text>

  <path d="M482 92 L554 92" fill="none" stroke="#2f5fa8" stroke-width="2" marker-end="url(#v3)"/>
  <rect x="560" y="70" width="296" height="70" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="708" y="94" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">about to acknowledge&#8230;</text>
  <text x="708" y="114" font-size="10" fill="#a01818" text-anchor="middle">a network blip &#8212; or somebody restarted the server</text>
  <text x="708" y="130" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">the ack never reaches the broker</text>
  <line x1="576" y1="78" x2="840" y2="132" stroke="#c62828" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3;0.36;0.94;1"/>
  </line>
  <line x1="840" y1="78" x2="576" y2="132" stroke="#c62828" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3;0.36;0.94;1"/>
  </line>

  <!-- second round -->
  <text x="24" y="180" font-size="13" font-weight="700" fill="#1b2a3a">after the restart</text>

  <rect x="24" y="192" width="150" height="70" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="99" y="220" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka broker</text>
  <text x="99" y="240" font-size="9" fill="#1e7a44" text-anchor="middle">offset never moved</text>

  <path d="M174 214 L246 214" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#v3)"/>
  <text x="210" y="204" font-size="9" font-weight="700" fill="#a01818" text-anchor="middle">redeliver</text>
  <circle r="6" fill="#c62828">
    <animate attributeName="cx" dur="6s" repeatCount="indefinite" values="174;246;246" keyTimes="0;0.55;1"/>
    <animate attributeName="cy" dur="6s" repeatCount="indefinite" values="214;214;214" keyTimes="0;0.55;1"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.44;0.5;0.58;1"/>
  </circle>

  <rect x="252" y="192" width="230" height="70" rx="10" fill="#fff8f8" stroke="#c62828" stroke-width="1.8"/>
  <text x="367" y="216" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">the same records again</text>
  <text x="367" y="238" font-size="10" fill="#a01818" text-anchor="middle">the service has no idea it saw them before</text>

  <path d="M482 214 L554 214" fill="none" stroke="#c62828" stroke-width="2" marker-end="url(#v3)"/>

  <rect x="560" y="192" width="296" height="70" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.4"/>
  <text x="708" y="220" font-size="13" font-weight="700" fill="#a01818" text-anchor="middle">the customer is charged twice</text>
  <text x="708" y="242" font-size="10.5" fill="#a01818" text-anchor="middle">and that is a support ticket, a refund and a bad review</text>

  <!-- timeline -->
  <rect x="24" y="286" width="832" height="66" rx="10" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="44" y="308" font-size="11" font-weight="700" fill="#1b2a3a">the offset, throughout</text>
  <rect x="200" y="316" width="620" height="22" rx="7" fill="#f4f7fb" stroke="#c9d3e0" stroke-width="1.2"/>
  <rect x="200" y="316" width="16" height="22" rx="7" fill="#c62828"/>
  <text x="520" y="332" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">never moved &#8212; because processing is not the same thing as committing</text>

  <rect x="24" y="366" width="832" height="58" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="440" y="388" font-size="12.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Kafka gives you <tspan font-style="italic">at-least-once</tspan> delivery. Duplicates are not a bug &#8212; they are the contract.</text>
  <text x="440" y="410" font-size="11.5" fill="#8a6d00" text-anchor="middle">There is no broker setting that fixes this for you. Handling it is the consumer application&#8217;s job &#8212; which is the next diagram.</text>
</svg>
