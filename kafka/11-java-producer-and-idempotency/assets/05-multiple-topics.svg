<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="One consumer group subscribing to several topics with a regex pattern">
  <defs>
    <marker id="v5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">5 · One consumer group, several topics</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Why would you want this? Because sometimes the topics differ but the <tspan font-weight="700">processing is the same</tspan>.</text>

  <!-- topics -->
  <rect x="24" y="76" width="250" height="82" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="149" y="102" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">order-events</text>
  <text x="149" y="124" font-size="10" fill="#1e7a44" text-anchor="middle">an order is placed</text>
  <text x="149" y="142" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">&#8594; deduct the inventory</text>

  <rect x="24" y="176" width="250" height="82" rx="10" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="149" y="202" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">order-returns</text>
  <text x="149" y="224" font-size="10" fill="#1e7a44" text-anchor="middle">the customer sends it back</text>
  <text x="149" y="242" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">&#8594; increase the inventory</text>

  <path d="M274 117 L346 152" fill="none" stroke="#1e7a44" stroke-width="2" marker-end="url(#v5)"/>
  <path d="M274 217 L346 182" fill="none" stroke="#1e7a44" stroke-width="2" marker-end="url(#v5)"/>

  <rect x="352" y="132" width="230" height="70" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="467" y="158" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">Pattern.compile("order.*")</text>
  <text x="467" y="178" font-size="9.5" fill="#8a6d00" text-anchor="middle">subscribe() takes a list of topics</text>
  <text x="467" y="192" font-size="9.5" fill="#8a6d00" text-anchor="middle">or a regex pattern</text>

  <path d="M582 167 L642 167" fill="none" stroke="#b8860b" stroke-width="2" marker-end="url(#v5)"/>

  <rect x="648" y="112" width="208" height="110" rx="11" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="2"/>
  <text x="752" y="138" font-size="12" font-weight="700" fill="#12305e" text-anchor="middle">Inventory Service</text>
  <text x="752" y="158" font-size="9.5" fill="#2f5fa8" text-anchor="middle" font-family="Consolas, monospace">group.id = inventory-service</text>
  <text x="752" y="182" font-size="10" fill="#2f5fa8" text-anchor="middle">one codebase, one group,</text>
  <text x="752" y="198" font-size="10" fill="#2f5fa8" text-anchor="middle">both streams</text>

  <g>
    <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="149;467;752"/><animate attributeName="cy" dur="3s" repeatCount="indefinite" values="117;167;167"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.88;1"/></circle>
    <circle r="6" fill="#1e7a44"><animate attributeName="cx" dur="3s" begin="1.5s" repeatCount="indefinite" values="149;467;752"/><animate attributeName="cy" dur="3s" begin="1.5s" repeatCount="indefinite" values="217;167;167"/><animate attributeName="opacity" dur="3s" begin="1.5s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.88;1"/></circle>
  </g>

  <!-- log output -->
  <rect x="24" y="276" width="500" height="130" rx="11" fill="#1b2a3a"/>
  <text x="40" y="298" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">log the topic too, so you can see where each record came from</text>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="40" y="324" opacity="0">topic=order-events&#160;&#160;&#160;key=null&#160;value=order-1<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1;0.14;1"/></text>
    <text x="40" y="342" opacity="0">topic=order-events&#160;&#160;&#160;key=null&#160;value=order-2<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.25;0.29;1"/></text>
    <text x="40" y="360" opacity="0">topic=order-events&#160;&#160;&#160;key=null&#160;value=order-3<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4;0.44;1"/></text>
    <text x="40" y="378" fill="#f4b400" opacity="0">topic=order-returns&#160;&#160;key=null&#160;value=order-1-return<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6;0.64;1"/></text>
    <text x="40" y="396" fill="#f4b400" opacity="0">topic=order-returns&#160;&#160;key=null&#160;value=order-2-return<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.8;0.84;1"/></text>
  </g>

  <rect x="540" y="276" width="316" height="130" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="698" y="300" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">Why split the topics at all?</text>
  <text x="698" y="324" font-size="10.5" fill="#1e7a44" text-anchor="middle">For scalability, or because different teams own</text>
  <text x="698" y="340" font-size="10.5" fill="#1e7a44" text-anchor="middle">them, or because they scale at different rates.</text>
  <text x="698" y="366" font-size="10.5" fill="#1e7a44" text-anchor="middle">But the inventory service does the same kind of</text>
  <text x="698" y="382" font-size="10.5" fill="#1e7a44" text-anchor="middle">work either way &#8212; so one consumer handles both.</text>
</svg>
