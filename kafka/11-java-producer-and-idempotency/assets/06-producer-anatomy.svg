<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Anatomy of the Java Kafka producer: ProducerConfig, serializers, ProducerRecord and send with a callback">
  <defs>
    <marker id="v6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · The producer in Java</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Same shape as the consumer, different config class &#8212; and no <tspan font-family="Consolas, monospace">group.id</tspan>, because groups are a consumer concept.</text>

  <rect x="24" y="66" width="470" height="290" rx="12" fill="#1b2a3a"/>
  <g font-size="10.5" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="42" y="92">Properties props = new Properties();</text>
    <text x="42" y="112">props.put(ProducerConfig.BOOTSTRAP_SERVERS_CONFIG,</text>
    <text x="42" y="126">&#160;&#160;&#160;&#160;&#160;&#160;"localhost:9092");</text>
    <text x="42" y="146">props.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG,</text>
    <text x="42" y="160">&#160;&#160;&#160;&#160;&#160;&#160;StringSerializer.class);</text>
    <text x="42" y="180">props.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG,</text>
    <text x="42" y="194">&#160;&#160;&#160;&#160;&#160;&#160;StringSerializer.class);</text>

    <text x="42" y="222">try (KafkaProducer&lt;String, String&gt; producer =</text>
    <text x="42" y="236">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;new KafkaProducer&lt;&gt;(props)) {</text>

    <text x="42" y="260">&#160;&#160;for (int i = 0; i &lt; 100; i++) {</text>
    <text x="42" y="278">&#160;&#160;&#160;&#160;var record = new ProducerRecord&lt;&gt;(</text>
    <text x="42" y="292">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;"order-events", Integer.toString(i), "order-" + i);</text>
    <text x="42" y="314">&#160;&#160;&#160;&#160;producer.send(record, (metadata, exception) -&gt; { &#8230; });</text>
    <text x="42" y="332">&#160;&#160;}</text>
    <text x="42" y="348">&#160;&#160;producer.flush();</text>
  </g>
  <rect x="34" y="102" width="450" height="96" rx="5" fill="#f4b400" opacity="0.16">
    <animate attributeName="y" dur="14s" repeatCount="indefinite" values="102;212;268;304;338;102" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete"/>
    <animate attributeName="height" dur="14s" repeatCount="indefinite" values="96;32;34;18;18;96" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete"/>
  </rect>

  <rect x="510" y="66" width="346" height="290" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <g text-anchor="middle">
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.19;0.21;1"/>
      <text x="683" y="150" font-size="13.5" font-weight="700" fill="#0f4d2a">ProducerConfig, not ConsumerConfig</text>
      <text x="683" y="178" font-size="11.5" fill="#1e7a44">Every component has its own set of</text>
      <text x="683" y="196" font-size="11.5" fill="#1e7a44">properties. There is <tspan font-weight="700">no group.id</tspan> here.</text>
      <text x="683" y="224" font-size="11.5" fill="#1e7a44">And only <tspan font-weight="700">serializers</tspan> &#8212; object to bytes.</text>
      <text x="683" y="242" font-size="11.5" fill="#1e7a44">Deserializers belong to the consumer,</text>
      <text x="683" y="258" font-size="11.5" fill="#1e7a44">which has to read bytes back.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.21;0.23;0.39;0.41;1"/>
      <text x="683" y="150" font-size="13.5" font-weight="700" fill="#0f4d2a">try-with-resources</text>
      <text x="683" y="178" font-size="11.5" fill="#1e7a44"><tspan font-family="Consolas, monospace">KafkaProducer</tspan> is <tspan font-family="Consolas, monospace">AutoCloseable</tspan>.</text>
      <text x="683" y="200" font-size="11.5" fill="#1e7a44">Leave it unclosed and your IDE will</text>
      <text x="683" y="216" font-size="11.5" fill="#1e7a44">warn you about a resource leak &#8212;</text>
      <text x="683" y="232" font-size="11.5" fill="#1e7a44">rightly, it holds sockets and threads.</text>
      <text x="683" y="258" font-size="11.5" fill="#1e7a44">Do the same for the consumer.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.41;0.43;0.59;0.61;1"/>
      <text x="683" y="150" font-size="13.5" font-weight="700" fill="#0f4d2a">ProducerRecord</text>
      <text x="683" y="178" font-size="11.5" fill="#1e7a44">One class, one message.</text>
      <text x="683" y="204" font-size="11.5" fill="#1e7a44">The constructor takes</text>
      <text x="683" y="224" font-size="11.5" fill="#0f4d2a" font-family="Consolas, monospace">(topic, key, value)</text>
      <text x="683" y="250" font-size="11.5" fill="#1e7a44">and that <tspan font-weight="700">key is the partition key</tspan> &#8212;</text>
      <text x="683" y="266" font-size="11.5" fill="#1e7a44">exactly what we typed as <tspan font-family="Consolas, monospace">1:order-1</tspan>.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.61;0.63;0.79;0.81;1"/>
      <text x="683" y="144" font-size="13.5" font-weight="700" fill="#0f4d2a">send(record, callback)</text>
      <text x="683" y="172" font-size="11.5" fill="#1e7a44">Two forms: fire it and forget, or pass</text>
      <text x="683" y="188" font-size="11.5" fill="#1e7a44">a callback and find out what happened.</text>
      <text x="683" y="214" font-size="11.5" fill="#0f4d2a" font-family="Consolas, monospace">(RecordMetadata, Exception)</text>
      <text x="683" y="240" font-size="11.5" fill="#1e7a44">Exception not null &#8594; it never made it</text>
      <text x="683" y="256" font-size="11.5" fill="#1e7a44">to the broker. Log it, alert on it.</text>
      <text x="683" y="278" font-size="11.5" fill="#1e7a44">Otherwise log the correlation id.</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.81;0.83;0.98;1"/>
      <text x="683" y="150" font-size="13.5" font-weight="700" fill="#0f4d2a">flush()</text>
      <text x="683" y="178" font-size="11.5" fill="#1e7a44">Ensures every send has completed</text>
      <text x="683" y="194" font-size="11.5" fill="#1e7a44">before the block closes the producer.</text>
      <text x="683" y="222" font-size="11.5" fill="#1e7a44">Covered properly in the next diagram &#8212;</text>
      <text x="683" y="238" font-size="11.5" fill="#1e7a44">it is the one line people forget.</text>
    </g>
  </g>

  <!-- record shape -->
  <rect x="24" y="374" width="832" height="80" rx="10" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="44" y="396" font-size="11" font-weight="700" fill="#1b2a3a">what one <tspan font-family="Consolas, monospace">ProducerRecord</tspan> carries</text>
  <rect x="60" y="406" width="220" height="34" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4"/>
  <text x="170" y="427" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">topic = "order-events"</text>
  <rect x="300" y="406" width="220" height="34" rx="7" fill="#fff3cd" stroke="#b8860b" stroke-width="1.4"/>
  <text x="410" y="422" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle" font-family="Consolas, monospace">key = "7"</text>
  <text x="410" y="435" font-size="8" fill="#8a6d00" text-anchor="middle">the partition key &#8212; decides which partition</text>
  <rect x="540" y="406" width="296" height="34" rx="7" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.4"/>
  <text x="688" y="422" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle" font-family="Consolas, monospace">value = "order-7"</text>
  <text x="688" y="435" font-size="8" fill="#2f5fa8" text-anchor="middle">the payload &#8212; in real life a JSON document</text>
</svg>
