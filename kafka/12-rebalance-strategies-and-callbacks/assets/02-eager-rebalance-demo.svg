<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="With the default assignor every consumer revokes all its partitions on every rebalance">
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · What the logs actually said &#8212; with the default assignor</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Three consumers started one after another, producer running the whole time. Watch who gets disturbed.</text>

  <!-- stage 1 -->
  <rect x="24" y="66" width="832" height="112" rx="11" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="44" y="88" font-size="12" font-weight="700" fill="#1b2a3a">consumer 1 starts alone</text>
  <rect x="44" y="98" width="500" height="62" rx="8" fill="#1b2a3a"/>
  <text x="58" y="120" font-size="10" fill="#a8d5ba" font-family="Consolas, monospace">group = inventory-service</text>
  <text x="58" y="140" font-size="10" fill="#f4b400" font-family="Consolas, monospace">Assigned: [order-events-0, order-events-1, order-events-2]</text>
  <rect x="566" y="98" width="270" height="62" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="701" y="122" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">consumer 1</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="640" y="146" fill="#7a5b00">p0</text><text x="701" y="146" fill="#0f4d2a">p1</text><text x="762" y="146" fill="#a01818">p2</text>
  </g>

  <!-- stage 2 -->
  <rect x="24" y="188" width="832" height="112" rx="11" fill="#fffdf5" stroke="#b8860b" stroke-width="1.6"/>
  <text x="44" y="210" font-size="12" font-weight="700" fill="#7a5b00">consumer 2 starts &#8212; first rebalance</text>
  <rect x="44" y="220" width="500" height="62" rx="8" fill="#1b2a3a"/>
  <text x="58" y="240" font-size="10" fill="#c96a6a" font-family="Consolas, monospace">c1 &#8594; Revoked: [order-events-0, -1, -2]&#160;&#160;&#8592; ALL of them</text>
  <text x="58" y="256" font-size="10" fill="#f4b400" font-family="Consolas, monospace">c1 &#8594; Assigned: [order-events-0, order-events-1]</text>
  <text x="58" y="274" font-size="10" fill="#f4b400" font-family="Consolas, monospace">c2 &#8594; Assigned: [order-events-2]</text>
  <rect x="566" y="220" width="132" height="62" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="632" y="244" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">consumer 1</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <text x="612" y="268" fill="#7a5b00">p0</text><text x="652" y="268" fill="#0f4d2a">p1</text>
  </g>
  <rect x="710" y="220" width="126" height="62" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="773" y="244" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">consumer 2</text>
  <text x="773" y="268" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">p2</text>

  <!-- stage 3 -->
  <rect x="24" y="310" width="832" height="112" rx="11" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="44" y="332" font-size="12" font-weight="700" fill="#a01818">consumer 3 starts &#8212; and <tspan text-decoration="underline">everybody</tspan> is disturbed</text>
  <rect x="44" y="342" width="500" height="66" rx="8" fill="#1b2a3a"/>
  <text x="58" y="362" font-size="10" fill="#c96a6a" font-family="Consolas, monospace">c1 &#8594; Revoked: [order-events-0, -1]&#160;&#160;&#8594; Assigned: [-0]</text>
  <text x="58" y="380" font-size="10" fill="#c96a6a" font-family="Consolas, monospace">c2 &#8594; Revoked: [order-events-2]&#160;&#160;&#160;&#160;&#8594; Assigned: [-1]</text>
  <text x="58" y="398" font-size="10" fill="#f4b400" font-family="Consolas, monospace">c3 &#8594; Assigned: [order-events-2]</text>
  <rect x="566" y="342" width="88" height="66" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="610" y="366" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle">consumer 1</text>
  <text x="610" y="390" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">p0</text>
  <rect x="662" y="342" width="88" height="66" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.4">
    <animate attributeName="stroke-width" dur="2.4s" repeatCount="indefinite" values="2.4;4;2.4"/>
  </rect>
  <text x="706" y="366" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">consumer 2</text>
  <text x="706" y="390" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">p1</text>
  <rect x="758" y="342" width="78" height="66" rx="8" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="797" y="366" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle">consumer 3</text>
  <text x="797" y="390" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">p2</text>

  <rect x="24" y="432" width="832" height="30" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.8"/>
  <text x="440" y="452" font-size="11.5" font-weight="700" fill="#a01818" text-anchor="middle">Consumer 2 owned exactly one partition and was processing it happily &#8212; it had no reason to be touched. It was anyway. That is the bottleneck.</text>
</svg>
