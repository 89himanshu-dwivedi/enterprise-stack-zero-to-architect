<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Eager stop-the-world rebalancing compared with the cooperative sticky assignor">
  <rect width="880" height="450" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">3 · Default vs <tspan font-family="Consolas, monospace">CooperativeStickyAssignor</tspan></text>

  <!-- default -->
  <rect x="20" y="46" width="400" height="330" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="220" y="70" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle">Default &#8212; eager, stop-the-world</text>
  <text x="220" y="88" font-size="10" fill="#c0392b" text-anchor="middle">everyone drops everything, then everyone gets a new plan</text>

  <text x="44" y="114" font-size="10.5" font-weight="700" fill="#a01818">before consumer 3 joins</text>
  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.4">
    <rect x="44" y="122" width="164" height="40" rx="7"/><rect x="222" y="122" width="164" height="40" rx="7"/>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <text x="126" y="139" fill="#a01818">consumer 1</text><text x="126" y="154" fill="#c0392b">p0 &#183; p1</text>
    <text x="304" y="139" fill="#a01818">consumer 2</text><text x="304" y="154" fill="#c0392b">p2</text>
  </g>

  <rect x="44" y="176" width="342" height="40" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="2">
    <animate attributeName="stroke-width" dur="3s" repeatCount="indefinite" values="2;3.6;2"/>
  </rect>
  <text x="215" y="193" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">EVERY consumer revokes EVERY partition</text>
  <text x="215" y="208" font-size="9" fill="#a01818" text-anchor="middle">nothing is consumed while this happens</text>

  <text x="44" y="238" font-size="10.5" font-weight="700" fill="#a01818">after</text>
  <g fill="#fdf1f1" stroke="#c62828" stroke-width="1.4">
    <rect x="44" y="246" width="108" height="40" rx="7"/><rect x="162" y="246" width="108" height="40" rx="7"/>
    <rect x="280" y="246" width="106" height="40" rx="7"/>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <text x="98" y="263" fill="#a01818">consumer 1</text><text x="98" y="278" fill="#c0392b">p0</text>
    <text x="216" y="263" fill="#a01818">consumer 2</text><text x="216" y="278" fill="#c0392b">p1&#160;&#8592; moved</text>
    <text x="333" y="263" fill="#a01818">consumer 3</text><text x="333" y="278" fill="#c0392b">p2</text>
  </g>

  <g font-size="10.5" fill="#a01818">
    <text x="44" y="312">&#10007;&#160; A pause across the whole group on every join or leave</text>
    <text x="44" y="332">&#10007;&#160; Consumers that did nothing wrong lose their partitions</text>
    <text x="44" y="352">&#10007;&#160; Warm caches, in-flight batches and locality all thrown away</text>
  </g>

  <!-- cooperative -->
  <rect x="460" y="46" width="400" height="330" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.8"/>
  <text x="660" y="70" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">CooperativeStickyAssignor &#160;&#9733;</text>
  <text x="660" y="88" font-size="10" fill="#1e7a44" text-anchor="middle">only what has to move, moves</text>

  <text x="484" y="114" font-size="10.5" font-weight="700" fill="#0f4d2a">before consumer 3 joins</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="484" y="122" width="164" height="40" rx="7"/><rect x="662" y="122" width="164" height="40" rx="7"/>
  </g>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <text x="566" y="139" fill="#0f4d2a">consumer 1</text><text x="566" y="154" fill="#1e7a44">p0 &#183; p1</text>
    <text x="744" y="139" fill="#0f4d2a">consumer 2</text><text x="744" y="154" fill="#1e7a44">p2</text>
  </g>

  <rect x="484" y="176" width="342" height="40" rx="7" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
  <text x="655" y="193" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">only consumer 1 &#8212; the one holding more &#8212; gives one up</text>
  <text x="655" y="208" font-size="9" fill="#1e7a44" text-anchor="middle">consumer 2 keeps consuming right through the rebalance</text>

  <text x="484" y="238" font-size="10.5" font-weight="700" fill="#0f4d2a">after</text>
  <g fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.4">
    <rect x="484" y="246" width="108" height="40" rx="7"/><rect x="602" y="246" width="108" height="40" rx="7"/>
    <rect x="720" y="246" width="106" height="40" rx="7"/>
  </g>
  <rect x="602" y="246" width="108" height="40" rx="7" fill="none" stroke="#0f4d2a" stroke-width="2.6" stroke-dasharray="6 4">
    <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.3;1;0.3"/>
  </rect>
  <g font-size="10" font-weight="700" text-anchor="middle">
    <text x="538" y="263" fill="#0f4d2a">consumer 1</text><text x="538" y="278" fill="#1e7a44">p0</text>
    <text x="656" y="263" fill="#0f4d2a">consumer 2</text><text x="656" y="278" fill="#0f4d2a">p2&#160;&#8212;&#160;untouched</text>
    <text x="773" y="263" fill="#0f4d2a">consumer 3</text><text x="773" y="278" fill="#1e7a44">p1</text>
  </g>

  <g font-size="10.5" fill="#0f4d2a">
    <text x="484" y="312">&#10003;&#160; No stop-the-world pause &#8212; unaffected consumers keep working</text>
    <text x="484" y="332">&#10003;&#160; Partitions stick to their owner wherever possible</text>
    <text x="484" y="352">&#10003;&#160; Serious benefit once you are running at scale</text>
  </g>

  <rect x="24" y="392" width="832" height="46" rx="10" fill="#1b2a3a"/>
  <text x="44" y="410" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">one line changes all of the above</text>
  <text x="44" y="428" font-size="10.5" fill="#a8d5ba" font-family="Consolas, monospace">props.put(ConsumerConfig.PARTITION_ASSIGNMENT_STRATEGY_CONFIG, CooperativeStickyAssignor.class.getName());</text>
</svg>
