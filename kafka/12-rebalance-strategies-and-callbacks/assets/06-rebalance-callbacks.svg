<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="ConsumerRebalanceListener: commit offsets when partitions are revoked, seek back when they are assigned">
  <defs>
    <marker id="w6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">6 · Hooking into it &#8212; <tspan font-family="Consolas, monospace">ConsumerRebalanceListener</tspan></text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Pass it as the second argument to <tspan font-family="Consolas, monospace">subscribe()</tspan> and Kafka calls you at both ends of a rebalance.</text>

  <!-- revoked -->
  <rect x="20" y="66" width="400" height="176" rx="12" fill="#fff8f8" stroke="#e0b4b4" stroke-width="1.8"/>
  <text x="220" y="90" font-size="12.5" font-weight="700" fill="#a01818" text-anchor="middle"><tspan font-family="Consolas, monospace">onPartitionsRevoked</tspan></text>
  <text x="220" y="108" font-size="10" fill="#c0392b" text-anchor="middle">your last chance before the partitions belong to somebody else</text>
  <rect x="44" y="120" width="352" height="52" rx="8" fill="#1b2a3a"/>
  <text x="58" y="140" font-size="10" fill="#a8d5ba" font-family="Consolas, monospace">log.info("partitions revoked {}", partitions);</text>
  <text x="58" y="160" font-size="10" fill="#f4b400" font-family="Consolas, monospace">consumer.commitSync();</text>
  <text x="220" y="196" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">Commit the offsets for what you have already processed.</text>
  <text x="220" y="216" font-size="10.5" fill="#a01818" text-anchor="middle">Skip this and the next owner replays work you already did &#8212;</text>
  <text x="220" y="232" font-size="10.5" fill="#a01818" text-anchor="middle">the duplicate problem from part 11, all over again.</text>

  <!-- assigned -->
  <rect x="460" y="66" width="400" height="176" rx="12" fill="#f7fbf8" stroke="#b6ddc4" stroke-width="1.8"/>
  <text x="660" y="90" font-size="12.5" font-weight="700" fill="#0f4d2a" text-anchor="middle"><tspan font-family="Consolas, monospace">onPartitionsAssigned</tspan></text>
  <text x="660" y="108" font-size="10" fill="#1e7a44" text-anchor="middle">you own them now &#8212; decide where to start reading</text>
  <rect x="484" y="120" width="352" height="84" rx="8" fill="#1b2a3a"/>
  <g font-size="10" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="498" y="140">for (TopicPartition tp : partitions) {</text>
    <text x="498" y="156">&#160;&#160;long current = consumer.position(tp);</text>
    <text x="498" y="172">&#160;&#160;long seekTo&#160;&#160;= Math.max(0, current - 1);</text>
    <text x="498" y="188" fill="#f4b400">&#160;&#160;consumer.seek(tp, seekTo);</text>
  </g>
  <text x="660" y="222" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">Note the <tspan font-family="Consolas, monospace">Math.max(0, &#8230;)</tspan> &#8212; the offset must never go negative.</text>

  <!-- use case -->
  <text x="24" y="278" font-size="14" font-weight="700" fill="#1b2a3a">Why you would ever seek backwards on assignment</text>

  <rect x="24" y="290" width="832" height="118" rx="11" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>

  <rect x="48" y="308" width="176" height="76" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="136" y="330" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">topic of aggregates</text>
  <text x="136" y="350" font-size="9.5" fill="#1e7a44" text-anchor="middle">e.g. &#8220;orders processed&#8221;</text>
  <text x="136" y="368" font-size="9.5" fill="#1e7a44" text-anchor="middle">each record is a running total</text>

  <path d="M224 346 L268 346" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#w6)"/>

  <rect x="274" y="308" width="196" height="76" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.6"/>
  <text x="372" y="330" font-size="10.5" font-weight="700" fill="#12305e" text-anchor="middle">a consumer starts up</text>
  <text x="372" y="350" font-size="9.5" fill="#2f5fa8" text-anchor="middle">it has <tspan font-weight="700">no storage</tspan> of its own &#8212;</text>
  <text x="372" y="366" font-size="9.5" fill="#2f5fa8" text-anchor="middle">its in-memory cache is empty</text>

  <path d="M470 346 L514 346" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#w6)"/>

  <rect x="520" y="308" width="196" height="76" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.8"/>
  <text x="618" y="330" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">seek back one record</text>
  <text x="618" y="350" font-size="9.5" fill="#8a6d00" text-anchor="middle">re-read the last message on</text>
  <text x="618" y="366" font-size="9.5" fill="#8a6d00" text-anchor="middle">every assigned partition</text>

  <path d="M716 346 L760 346" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#w6)"/>

  <rect x="766" y="308" width="70" height="76" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.6"/>
  <text x="801" y="336" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">cache</text>
  <text x="801" y="354" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">warm</text>
  <text x="801" y="370" font-size="8.5" fill="#1e7a44" text-anchor="middle">ready to work</text>

  <circle r="6" fill="#b8860b" cy="346">
    <animate attributeName="cx" dur="4s" repeatCount="indefinite" values="136;372;618;801"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.9;1"/>
  </circle>

  <rect x="24" y="420" width="832" height="40" rx="9" fill="#1b2a3a"/>
  <text x="44" y="437" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">the log you will see, once per assigned partition</text>
  <text x="44" y="453" font-size="10" fill="#f4b400" font-family="Consolas, monospace">seeking order-events-0 to offset 1550&#160;&#160;&#183;&#160;&#160;seeking order-events-1 to offset 1551&#160;&#160;&#183;&#160;&#160;seeking order-events-2 to offset 1614</text>
</svg>
