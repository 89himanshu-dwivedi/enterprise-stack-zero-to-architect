<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How the demo is wired: one consumer class with a start method and three main methods driving it">
  <defs>
    <marker id="w7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">7 · How to run three consumers from one IDE</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">Turn <tspan font-family="Consolas, monospace">main</tspan> into <tspan font-family="Consolas, monospace">start(instanceId)</tspan>, then give each instance its own tiny <tspan font-family="Consolas, monospace">main</tspan> so the IDE can launch three JVMs.</text>

  <rect x="24" y="70" width="380" height="196" rx="11" fill="#1b2a3a"/>
  <text x="40" y="92" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">Day03KafkaConsumerGroup.java</text>
  <g font-size="10" font-family="Consolas, monospace" fill="#dbe4ee">
    <text x="40" y="118">static class Consumer1 {</text>
    <text x="40" y="134">&#160;&#160;public static void main(String[] a) {</text>
    <text x="40" y="150" fill="#a8d5ba">&#160;&#160;&#160;&#160;Day03KafkaConsumer.start("1");</text>
    <text x="40" y="166">&#160;&#160;}</text>
    <text x="40" y="182">}</text>
    <text x="40" y="206" fill="#8ea3bb">&#8230; Consumer2 with "2", Consumer3 with "3"</text>
    <text x="40" y="234" fill="#f4b400">each main() = its own JVM = its own group member</text>
    <text x="40" y="252" fill="#8ea3bb">and that instance id is what group.instance.id gets</text>
  </g>

  <path d="M410 168 L446 168" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#w7)"/>

  <rect x="452" y="70" width="404" height="196" rx="11" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="654" y="94" font-size="12" font-weight="700" fill="#0f4d2a" text-anchor="middle">one shared consumer class</text>
  <rect x="474" y="106" width="360" height="30" rx="6" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.3"/>
  <text x="654" y="126" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">static void start(String instanceId)</text>
  <g font-size="10.5" fill="#1e7a44">
    <text x="474" y="158">&#8226;&#160; same <tspan font-family="Consolas, monospace">group.id = inventory-service</tspan> for all three</text>
    <text x="474" y="180">&#8226;&#160; different <tspan font-family="Consolas, monospace">group.instance.id</tspan> per instance</text>
    <text x="474" y="202">&#8226;&#160; the whole poll loop wrapped in try/catch</text>
    <text x="490" y="220" font-size="9.5" fill="#0f4d2a">a rebalance can throw &#8212; uncaught, it kills the while loop</text>
    <text x="474" y="244">&#8226;&#160; producer pushes <tspan font-weight="700">10,000</tspan> records, not 100</text>
    <text x="490" y="260" font-size="9.5" fill="#0f4d2a">you need traffic flowing to actually watch a rebalance</text>
  </g>

  <!-- setup commands -->
  <rect x="24" y="286" width="832" height="96" rx="11" fill="#1b2a3a"/>
  <text x="44" y="308" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">the topic must have more than one partition, or there is nothing to rebalance</text>
  <g font-size="10" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="44" y="332">$ kafka-topics.sh --bootstrap-server localhost:9092 --list</text>
    <text x="44" y="352" fill="#f4b400">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic order-events --create --partitions 3</text>
    <text x="44" y="372">$ kafka-topics.sh --bootstrap-server localhost:9092 --topic order-events --describe</text>
  </g>
  <text x="700" y="332" font-size="9" fill="#c96a6a" font-family="Consolas, monospace">--bootstrap-server, singular</text>
</svg>
