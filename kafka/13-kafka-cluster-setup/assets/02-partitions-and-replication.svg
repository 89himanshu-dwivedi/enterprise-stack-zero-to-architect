<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The controller receives the create-topic command and lays out leaders and followers across the cluster">
  <defs>
    <marker id="x2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · Creating a topic &#8212; the controller lays out the whole plan</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">A topic is abstract. It is <tspan font-weight="700">nothing but a collection of partitions</tspan>. Want performance and scaling? Create it with more partitions.</text>

  <rect x="24" y="66" width="620" height="30" rx="7" fill="#1b2a3a"/>
  <text x="40" y="86" font-size="10.5" fill="#a8d5ba" font-family="Consolas, monospace">kafka-topics.sh --bootstrap-server ... --topic order-events --partitions 2 --replication-factor 3 --create</text>

  <path d="M334 96 L334 122" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#x2)"/>
  <text x="360" y="115" font-size="9.5" fill="#5b6b7f">somebody has to receive this &#8212; the controller does</text>

  <rect x="234" y="126" width="200" height="56" rx="10" fill="#fff3cd" stroke="#b8860b" stroke-width="2.4"/>
  <text x="334" y="150" font-size="12" font-weight="700" fill="#7a5b00" text-anchor="middle">ACTIVE CONTROLLER</text>
  <text x="334" y="170" font-size="9.5" fill="#8a6d00" text-anchor="middle">picks the nodes, then tells everyone</text>

  <path d="M280 182 L150 212" fill="none" stroke="#b8860b" stroke-width="1.6" marker-end="url(#x2)"/>
  <path d="M334 182 L334 212" fill="none" stroke="#b8860b" stroke-width="1.6" marker-end="url(#x2)"/>
  <path d="M388 182 L518 212" fill="none" stroke="#b8860b" stroke-width="1.6" marker-end="url(#x2)"/>
  <path d="M420 176 L700 212" fill="none" stroke="#b8860b" stroke-width="1.6" marker-end="url(#x2)"/>

  <!-- brokers -->
  <g fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8">
    <rect x="40" y="216" width="200" height="118" rx="10"/>
    <rect x="256" y="216" width="200" height="118" rx="10"/>
    <rect x="472" y="216" width="180" height="118" rx="10"/>
    <rect x="668" y="216" width="180" height="118" rx="10"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">
    <text x="140" y="238">broker 1</text><text x="356" y="238">broker 2</text>
    <text x="562" y="238">broker 3</text><text x="758" y="238">broker 4</text>
  </g>

  <!-- partition 0 chips -->
  <g>
    <rect x="56" y="250" width="168" height="34" rx="7" fill="#d6ecdd" stroke="#0f4d2a" stroke-width="2.4"/>
    <text x="140" y="264" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">partition 0 &#8212; LEADER</text>
    <text x="140" y="277" font-size="8.5" fill="#1e7a44" text-anchor="middle">every write lands here first</text>

    <rect x="272" y="250" width="168" height="34" rx="7" fill="#eef4fd" stroke="#2f5fa8" stroke-width="1.5"/>
    <text x="356" y="270" font-size="10" font-weight="600" fill="#12305e" text-anchor="middle">partition 0 &#8212; follower</text>

    <rect x="488" y="250" width="148" height="34" rx="7" fill="#eef4fd" stroke="#2f5fa8" stroke-width="1.5"/>
    <text x="562" y="270" font-size="10" font-weight="600" fill="#12305e" text-anchor="middle">partition 0 &#8212; follower</text>
  </g>

  <!-- partition 1 chips -->
  <g>
    <rect x="272" y="292" width="168" height="34" rx="7" fill="#f8dede" stroke="#a01818" stroke-width="2.4"/>
    <text x="356" y="306" font-size="10" font-weight="700" fill="#a01818" text-anchor="middle">partition 1 &#8212; LEADER</text>
    <text x="356" y="319" font-size="8.5" fill="#c0392b" text-anchor="middle">a different node leads this one</text>

    <rect x="488" y="292" width="148" height="34" rx="7" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
    <text x="562" y="312" font-size="10" font-weight="600" fill="#a01818" text-anchor="middle">partition 1 &#8212; follower</text>

    <rect x="684" y="292" width="148" height="34" rx="7" fill="#fdf1f1" stroke="#c62828" stroke-width="1.5"/>
    <text x="758" y="312" font-size="10" font-weight="600" fill="#a01818" text-anchor="middle">partition 1 &#8212; follower</text>
  </g>

  <!-- write flow -->
  <rect x="24" y="352" width="180" height="52" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="114" y="374" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">producer</text>
  <text x="114" y="392" font-size="9" fill="#2f5fa8" text-anchor="middle">writing to partition 0</text>

  <path d="M204 378 L240 378 L240 300 L140 300 L140 288" fill="none" stroke="#2f5fa8" stroke-width="1.8" marker-end="url(#x2)"/>
  <text x="250" y="372" font-size="9.5" font-weight="700" fill="#12305e">1 &#183; the LEADER receives it first</text>

  <g stroke="#0f4d2a" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#x2)">
    <path d="M224 262 L266 262"/>
    <path d="M440 262 L482 262"/>
  </g>
  <text x="380" y="248" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">2 &#183; then the leader replicates to its followers</text>
  <g fill="#0f4d2a">
    <circle r="5" cy="267"><animate attributeName="cx" dur="3s" repeatCount="indefinite" values="140;356;562"/><animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="1;1;0" keyTimes="0;0.88;1"/></circle>
  </g>

  <rect x="24" y="418" width="832" height="42" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="1.6"/>
  <text x="440" y="438" font-size="11.5" font-weight="700" fill="#7a5b00" text-anchor="middle">2 partitions &#215; replication factor 3 = 6 copies, spread so no single node loss takes a partition down.</text>
  <text x="440" y="454" font-size="10.5" fill="#8a6d00" text-anchor="middle">And it is the <tspan font-weight="700">controller&#8217;s</tspan> job to redo this layout whenever a server comes up or goes down.</text>
</svg>
