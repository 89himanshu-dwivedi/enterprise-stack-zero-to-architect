<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Every broker subscribes to the cluster metadata topic, and the client writes straight to the leader rather than through the bootstrap server">
  <defs>
    <marker id="x3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
    <marker id="x3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f4d2a"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">3 · <tspan font-family="Consolas, monospace">__cluster_metadata</tspan> &#8212; and why the bootstrap server never forwards anything</text>

  <rect x="24" y="44" width="200" height="50" rx="9" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
  <text x="124" y="66" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">ACTIVE CONTROLLER</text>
  <text x="124" y="83" font-size="9" fill="#8a6d00" text-anchor="middle">has just decided the layout</text>
  <path d="M224 69 L268 69" fill="none" stroke="#b8860b" stroke-width="2" marker-end="url(#x3)"/>

  <rect x="274" y="44" width="582" height="50" rx="9" fill="#e6f4ea" stroke="#1e7a44" stroke-width="2"/>
  <text x="565" y="66" font-size="11.5" font-weight="700" fill="#0f4d2a" text-anchor="middle" font-family="Consolas, monospace">__cluster_metadata</text>
  <text x="565" y="83" font-size="9.5" fill="#1e7a44" text-anchor="middle">an internal topic &#8212; the controller publishes the whole picture here, and it reaches the entire cluster</text>

  <g stroke="#1e7a44" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#x3)">
    <path d="M360 94 L120 132"/><path d="M470 94 L330 132"/><path d="M660 94 L540 132"/><path d="M780 94 L750 132"/>
  </g>

  <g fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.6">
    <rect x="40" y="136" width="180" height="76" rx="9"/>
    <rect x="240" y="136" width="180" height="76" rx="9"/>
    <rect x="450" y="136" width="180" height="76" rx="9"/>
  </g>
  <rect x="660" y="136" width="196" height="76" rx="9" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">
    <text x="130" y="158">broker 1</text><text x="330" y="158">broker 2</text><text x="540" y="158">broker 3</text>
  </g>
  <text x="758" y="158" font-size="11" font-weight="700" fill="#5b6b7f" text-anchor="middle">broker 4</text>
  <g font-size="9" fill="#1e7a44" text-anchor="middle">
    <text x="130" y="178">leads partition 0</text><text x="330" y="178">leads partition 1</text><text x="540" y="178">follower only</text>
  </g>
  <text x="758" y="178" font-size="9" fill="#a01818" text-anchor="middle">no partitions assigned at all</text>
  <g font-size="9" font-weight="700" fill="#0f4d2a" text-anchor="middle">
    <text x="130" y="198">subscribed &#10003;</text><text x="330" y="198">subscribed &#10003;</text><text x="540" y="198">subscribed &#10003;</text>
    <text x="758" y="198" fill="#0f4d2a">subscribed &#10003; &#8212; yes, still</text>
  </g>
  <rect x="660" y="136" width="196" height="76" rx="9" fill="none" stroke="#0f4d2a" stroke-width="2.4" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.9;1"/>
  </rect>

  <rect x="24" y="224" width="832" height="34" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="1.5"/>
  <text x="440" y="245" font-size="11" font-weight="700" fill="#7a5b00" text-anchor="middle">Why does a broker with nothing assigned still subscribe? Because you never know which node a client will use as its <tspan font-style="italic">bootstrap server</tspan> &#8212; so all of them must know everything.</text>

  <!-- client flow -->
  <text x="24" y="290" font-size="14" font-weight="700" fill="#1b2a3a">So what does the bootstrap server actually do?</text>

  <rect x="24" y="304" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#2f5fa8" stroke-width="1.8"/>
  <text x="99" y="330" font-size="11" font-weight="700" fill="#12305e" text-anchor="middle">client library</text>
  <text x="99" y="348" font-size="9" fill="#2f5fa8" text-anchor="middle">producer or consumer</text>
  <text x="99" y="364" font-size="9" fill="#2f5fa8" text-anchor="middle">knows one address</text>

  <path d="M174 322 L216 322" fill="none" stroke="#5b6b7f" stroke-width="1.8" marker-end="url(#x3)"/>
  <text x="196" y="314" font-size="8.5" fill="#5b6b7f" text-anchor="middle">1</text>

  <rect x="222" y="304" width="280" height="70" rx="9" fill="#f7fbf8" stroke="#1e7a44" stroke-width="1.8"/>
  <text x="362" y="326" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">any broker, acting as bootstrap server</text>
  <text x="362" y="346" font-size="9.5" fill="#1e7a44" text-anchor="middle">hands back the metadata it read from</text>
  <text x="362" y="362" font-size="9.5" fill="#1e7a44" text-anchor="middle" font-family="Consolas, monospace">__cluster_metadata</text>

  <path d="M222 358 L180 358" fill="none" stroke="#1e7a44" stroke-width="1.8" marker-end="url(#x3)"/>
  <text x="200" y="376" font-size="8.5" fill="#0f4d2a" text-anchor="middle">2</text>

  <rect x="522" y="290" width="334" height="98" rx="9" fill="#1b2a3a"/>
  <text x="538" y="310" font-size="9.5" fill="#8ea3bb" font-family="Consolas, monospace">what the client now holds</text>
  <g font-size="10" font-family="Consolas, monospace" fill="#a8d5ba">
    <text x="538" y="332">topic&#160;&#160;&#160;&#160;&#160;= order-events</text>
    <text x="538" y="348">partition = 0</text>
    <text x="538" y="364" fill="#f4b400">leader&#160;&#160;&#160;&#160;= node 1&#160;&#160;(and its address)</text>
    <text x="538" y="380">followers = node 2, node 3</text>
  </g>

  <path d="M99 374 L99 428 L440 428" fill="none" stroke="#0f4d2a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#x3g)"/>
  <circle r="6" fill="#0f4d2a">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M99 374 L99 428 L440 428"/>
    <animate attributeName="opacity" dur="3.5s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.1;0.85;1"/>
  </circle>
  <text x="270" y="422" font-size="9.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">3 &#183; the client publishes <tspan font-style="italic">directly</tspan> to the leader</text>

  <rect x="24" y="440" width="832" height="26" rx="7" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="440" y="458" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">The bootstrap server does <tspan text-decoration="underline">not</tspan> forward your request to the leader. It only hands over the map. Your client does the routing.</text>
</svg>
