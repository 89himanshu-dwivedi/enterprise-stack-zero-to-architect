# Broker 1 of the three-node KRaft cluster.

process.roles=broker,controller
node.id=1

# every node that may vote for the active controller, on the controller port
controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

# where this broker binds
listeners=INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:8081

# what it tells clients to come back on - internal names resolve only inside the docker network
advertised.listeners=INTERNAL://kafka-1:9092,EXTERNAL://localhost:8081

listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=INTERNAL

auto.create.topics.enable=false

# internal topics get a copy on every broker
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

default.replication.factor=3
min.insync.replicas=2
num.partitions=3

log.dirs=/tmp/kraft-combined-logs
log.retention.hours=168

num.network.threads=3
num.io.threads=8
