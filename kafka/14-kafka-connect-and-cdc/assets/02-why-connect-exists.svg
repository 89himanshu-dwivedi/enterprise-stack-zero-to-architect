<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Why Kafka Connect exists: the custom producer carries six burdens, and everyone rewrites the same logic">
  <defs>
    <marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="24" y="28" font-size="18" font-weight="600" fill="#1b2a3a">2 · Why Connect exists &#8212; Kafka already has producers and consumers</text>
  <text x="24" y="50" font-size="12.5" fill="#5b6b7f">The requirement is trivial: whatever lands in MySQL, feed it to Kafka. Look at what the producer app actually has to carry.</text>

  <!-- left: without connect -->
  <rect x="24" y="66" width="416" height="308" rx="12" fill="#fff8f8" stroke="#c62828" stroke-width="2"/>
  <text x="232" y="90" font-size="13" font-weight="700" fill="#a01818" text-anchor="middle">Without Kafka Connect</text>

  <rect x="46" y="106" width="96" height="52" rx="8" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="94" y="130" font-size="10.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">MySQL</text>
  <text x="94" y="146" font-size="9" fill="#5b6b7f" text-anchor="middle">the source</text>

  <path d="M142 132 L182 132" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#c2)"/>

  <rect x="188" y="100" width="140" height="64" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.2"/>
  <text x="258" y="124" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">your producer app</text>
  <text x="258" y="142" font-size="9" fill="#a01818" text-anchor="middle">one instance you now own</text>
  <text x="258" y="156" font-size="9" fill="#a01818" text-anchor="middle">and have to keep alive</text>

  <path d="M328 132 L368 132" fill="none" stroke="#5b6b7f" stroke-width="2" marker-end="url(#c2)"/>
  <rect x="374" y="106" width="52" height="52" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
  <text x="400" y="136" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka</text>

  <text x="232" y="186" font-size="11" font-weight="700" fill="#a01818" text-anchor="middle">everything that little box has to do</text>

  <g font-size="10" fill="#a01818">
    <g>
      <rect x="46" y="196" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="46" y="196" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.14;0.17;1"/>
      </rect>
      <text x="60" y="216">1 &#183; continuously poll the database</text>
    </g>
    <g>
      <rect x="238" y="196" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="238" y="196" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.17;0.19;0.31;0.34;1"/>
      </rect>
      <text x="252" y="216">2 &#183; handle retries when the DB is down</text>
    </g>
    <g>
      <rect x="46" y="232" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="46" y="232" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.34;0.36;0.48;0.51;1"/>
      </rect>
      <text x="60" y="252">3 &#183; manage offsets &#8212; last row published</text>
    </g>
    <g>
      <rect x="238" y="232" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="238" y="232" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.51;0.53;0.65;0.68;1"/>
      </rect>
      <text x="252" y="252">4 &#183; handle scaling &#8212; 1M rows, more traffic</text>
    </g>
    <g>
      <rect x="46" y="268" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="46" y="268" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.70;0.82;0.85;1"/>
      </rect>
      <text x="60" y="288">5 &#183; handle fault tolerance on crash</text>
    </g>
    <g>
      <rect x="238" y="268" width="184" height="30" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="1.3"/>
      <rect x="238" y="268" width="184" height="30" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2.4" opacity="0">
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.85;0.87;0.98;1"/>
      </rect>
      <text x="252" y="288">6 &#183; handle schema changes</text>
    </g>
  </g>

  <text x="232" y="322" font-size="10.5" font-weight="700" fill="#a01818" text-anchor="middle">Did we lose data? Did we duplicate it?</text>
  <text x="232" y="340" font-size="10" fill="#a01818" text-anchor="middle">Where was the last row read? You answer all of that yourself.</text>
  <text x="232" y="360" font-size="10" font-style="italic" fill="#a01818" text-anchor="middle">And every team, in every company, writes this again.</text>

  <!-- right: with connect -->
  <rect x="456" y="66" width="400" height="308" rx="12" fill="#f7fbf8" stroke="#1e7a44" stroke-width="2"/>
  <text x="656" y="90" font-size="13" font-weight="700" fill="#0f4d2a" text-anchor="middle">With Kafka Connect</text>

  <rect x="478" y="106" width="88" height="52" rx="8" fill="#eef2f7" stroke="#5b6b7f" stroke-width="1.5"/>
  <text x="522" y="136" font-size="10.5" font-weight="700" fill="#1b2a3a" text-anchor="middle">MySQL</text>
  <path d="M566 132 L600 132" fill="none" stroke="#1e7a44" stroke-width="2" marker-end="url(#c2)"/>
  <rect x="606" y="100" width="130" height="64" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="2.2"/>
  <text x="671" y="122" font-size="10.5" font-weight="700" fill="#7a5b00" text-anchor="middle">Kafka Connect</text>
  <text x="671" y="140" font-size="9" fill="#8a6d00" text-anchor="middle">a battle-tested connector,</text>
  <text x="671" y="154" font-size="9" fill="#8a6d00" text-anchor="middle">configured &#8212; not written</text>
  <path d="M736 132 L770 132" fill="none" stroke="#1e7a44" stroke-width="2" marker-end="url(#c2)"/>
  <rect x="776" y="106" width="56" height="52" rx="8" fill="#e6f4ea" stroke="#1e7a44" stroke-width="1.5"/>
  <text x="804" y="136" font-size="10" font-weight="700" fill="#0f4d2a" text-anchor="middle">Kafka</text>

  <text x="656" y="186" font-size="11" font-weight="700" fill="#0f4d2a" text-anchor="middle">all six problems, already solved</text>
  <g font-size="10" fill="#0f4d2a">
    <rect x="478" y="196" width="356" height="26" rx="6" fill="#ffffff" stroke="#1e7a44" stroke-width="1.3"/>
    <text x="492" y="214">&#10003; polling, retries and schema handling live in the connector</text>
    <rect x="478" y="228" width="356" height="26" rx="6" fill="#ffffff" stroke="#1e7a44" stroke-width="1.3"/>
    <text x="492" y="246">&#10003; scaling &#8212; tasks, distributed workers, automatic rebalancing</text>
    <rect x="478" y="260" width="356" height="26" rx="6" fill="#ffffff" stroke="#1e7a44" stroke-width="1.3"/>
    <text x="492" y="278">&#10003; fault tolerance &#8212; offsets and status kept in internal topics</text>
    <rect x="478" y="292" width="356" height="26" rx="6" fill="#ffffff" stroke="#1e7a44" stroke-width="1.3"/>
    <text x="492" y="310">&#10003; ready connectors: JDBC, Mongo, Elasticsearch, S3, Redis, Cassandra</text>
  </g>
  <text x="656" y="340" font-size="10.5" font-weight="700" fill="#0f4d2a" text-anchor="middle">You write a JSON config, not an application.</text>
  <text x="656" y="360" font-size="10" font-style="italic" fill="#1e7a44" text-anchor="middle">Standardized integration, tested against far more data than yours.</text>

  <rect x="24" y="388" width="832" height="62" rx="10" fill="#f9fafc" stroke="#c9d3e0" stroke-width="1.6"/>
  <text x="440" y="412" font-size="12" font-weight="700" fill="#1b2a3a" text-anchor="middle">Kafka is the central event streaming system. Kafka Connect is the standardized bridge to everything else.</text>
  <text x="440" y="436" font-size="11" fill="#5b6b7f" text-anchor="middle">It exists so engineers stop reinventing data integration every single time they connect Kafka to another system.</text>
</svg>
